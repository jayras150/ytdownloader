name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        default: 'test_job'

jobs:
  auto-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video & Extract Audio
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          YOUTUBE_URL="${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}"
          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          yt-dlp \
            $COOKIE_ARG \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=ios,mweb" \
            -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --merge-output-format mp4 \
            "$YOUTUBE_URL" -o "raw_video.mp4"

          rm -f cookies.txt

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          echo "VIDEO_DURATION=$DURATION" >> $GITHUB_ENV

      # Kurasi Multi-Clips (Hasilkan hingga 3 klip viral berbeda)
      - name: AI Multi-Clip Viral Curation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT_TEXT="Durasi total video ini ${VIDEO_DURATION} detik.
          Sebagai AI video editor profesional ala OpusClip, temukan 3 SEGMEN TERBAIK yang berbeda untuk dijadikan video Shorts/TikTok (panjang masing-masing 30 hingga 60 detik).
          Pastikan rentang waktu start_sec dan end_sec tidak saling tumpang tindih secara berlebihan.
          
          Keluarkan HANYA array JSON murni tanpa markdown:
          [
            {
              \"clip_index\": 1,
              \"start_sec\": 10.0,
              \"end_sec\": 45.0,
              \"viral_score\": 95,
              \"hook\": \"Hook pembuka menarik\",
              \"title\": \"Judul Klip 1\",
              \"tags\": [\"#viral\", \"#shorts\", \"#trending\"]
            },
            {
              \"clip_index\": 2,
              \"start_sec\": 80.0,
              \"end_sec\": 120.0,
              \"viral_score\": 90,
              \"hook\": \"Momen puncak kedua\",
              \"title\": \"Judul Klip 2\",
              \"tags\": [\"#fyp\", \"#clipzy\"]
            },
            {
              \"clip_index\": 3,
              \"start_sec\": 150.0,
              \"end_sec\": 195.0,
              \"viral_score\": 86,
              \"hook\": \"Penutup yang seru\",
              \"title\": \"Judul Klip 3\",
              \"tags\": [\"#highlight\", \"#popular\"]
            }
          ]"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{
            model: "openai/gpt-4o-mini",
            messages: [
              {
                role: "system",
                content: "You are an expert video editor. Output strictly a JSON array of clip segments without markdown fences."
              },
              {
                role: "user",
                content: $prompt
              }
            ],
            temperature: 0.3
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://clipzy.app" \
            -H "X-Title: Clipzy Engine" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          RAW_CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g' | tr -d '\r\n')

          if ! echo "$CLEAN_JSON" | jq empty > /dev/null 2>&1 || [ -z "$CLEAN_JSON" ]; then
            CLEAN_JSON='[
              {"clip_index":1,"start_sec":0.0,"end_sec":35.0,"viral_score":92,"hook":"Opening Hook","title":"Klip 1","tags":["#viral","#shorts"]},
              {"clip_index":2,"start_sec":40.0,"end_sec":75.0,"viral_score":88,"hook":"Highlight 2","title":"Klip 2","tags":["#fyp"]},
              {"clip_index":3,"start_sec":80.0,"end_sec":115.0,"viral_score":85,"hook":"Highlight 3","title":"Klip 3","tags":["#trending"]}
            ]'
          fi

          echo "$CLEAN_JSON" > clips_manifest.json
          cat clips_manifest.json

      # Render Setiap Klip Menggunakan Format yang Pasti Bisa Diputar di Android (pix_fmt yuv420p)
      - name: Render All Clips (Android Compatible)
        run: |
          mkdir -p output_clips

          jq -c '.[]' clips_manifest.json | while read -r clip; do
            IDX=$(echo "$clip" | jq -r '.clip_index')
            START=$(echo "$clip" | jq -r '.start_sec')
            END=$(echo "$clip" | jq -r '.end_sec')
            DUR=$(echo "$END - $START" | bc)

            echo "Rendering Clip #$IDX: Mulai $START detik, Durasi $DUR detik..."

            # Filter 9:16 Center Crop dan Standardisasi Video Player Android
            ffmpeg -y -ss "$START" -t "$DUR" -i raw_video.mp4 \
              -vf "crop='w=min(in_w,in_h*9/16):h=min(in_h,in_w*16/9):x=(in_w-out_w)/2:y=(in_h-out_h)/2',scale=1080:1920:flags=bilinear" \
              -c:v libx264 -preset ultrafast -crf 22 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -movflags +faststart \
              "output_clips/clip_${IDX}.mp4"
          done

      # Upload Klip & Kompatibilitas Path Lama/Baru
      - name: Upload Clips to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          JOB_ID="${{ env.JOB_ID }}"

          # 1. Upload SEMUA klip ke subfolder outputs/${JOB_ID}/
          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL"

          # 2. Upload klip utama langsung ke root outputs/ agar terbaca oleh poller lama
          aws s3 cp "output_clips/clip_1.mp4" \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL"

          # 3. Upload manifest JSON ke outputs/${JOB_ID}_meta.json
          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          # 4. Buat file status JSON penanda bahwa proses selesai 100%
          cat <<EOF > status.json
          {
            "job_id": "${JOB_ID}",
            "status": "ready",
            "file_name": "${JOB_ID}.mp4",
            "download_url": "${R2_PUBLIC_DOMAIN}/outputs/${JOB_ID}.mp4"
          }
          EOF

          aws s3 cp status.json \
            "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          echo "File berhasil diunggah ke semua path kompatibel!"