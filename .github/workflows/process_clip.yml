name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        type: string
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        type: string
        default: 'test_job'
      target_duration:
        description: 'Target clip duration in seconds (e.g. 30-60 or 45)'
        required: false
        type: string
        default: '30-60'
      subtitle_style:
        description: 'Android subtitle preset (NONE disables burned-in subtitles)'
        required: false
        type: choice
        default: 'VIRAL'
        options:
          - VIRAL
          - PODCAST
          - IMPACT
          - NEON
          - MAGENTA
          - GOLD
          - CRIMSON
          - CYBER
          - BEAST
          - MARKER
          - RETRO
          - GLITCH
          - MINIMAL
          - EMERALD
          - SUNSET
          - VIOLET
          - NONE
      subtitle_language:
        description: 'Language hint for Whisper + subtitles (BCP-47, empty = auto-detect)'
        required: false
        type: string
        default: ''
      aspect_ratio:
        description: 'Output aspect ratio ("source" preserves the native ratio)'
        required: false
        type: choice
        default: 'source'
        options:
          - source
          - '9:16'
          - '16:9'
          - '1:1'
          - '4:5'
          - '4:3'
          - '3:4'
          - '21:9'
      preserve_source_quality:
        description: 'Never upscale and keep native resolution/frame rate'
        required: false
        type: boolean
        default: true
      output_quality:
        description: 'Output resolution policy (original = native, never upscale)'
        required: false
        type: choice
        default: 'original'
        options:
          - original
          - '1080p'
          - '720p'
          - '480p'
      manual_transform:
        description: 'Manual pinch-zoom framing as JSON {"scale":1.0,"offset_x":0.0,"offset_y":0.0} (empty = none)'
        required: false
        type: string
        default: ''
      watermark_base64:
        description: 'Base64 encoded watermark logo PNG'
        required: false
        type: string
        default: ''
      watermark_url:
        description: 'URL to watermark logo PNG'
        required: false
        type: string
        default: ''
      watermark_position:
        description: 'Watermark position (top_left, top_right, bottom_left, bottom_right)'
        required: false
        type: string
        default: 'bottom_right'
      watermark_size:
        description: 'Watermark size (small, medium, large)'
        required: false
        type: string
        default: 'medium'

permissions:
  contents: read

concurrency:
  group: clipzy-${{ github.event.client_payload.job_id || github.event.inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-process:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ---------------------------------------------------------------------------
      # Centralized AI model constants. Every OpenRouter request in this workflow
      # reads these values and refuses to run if they are changed or substituted.
      # ---------------------------------------------------------------------------
      OPENROUTER_CHAT_MODEL: openai/gpt-6-luna
      OPENROUTER_STT_MODEL: openai/whisper-large-v3-turbo
      OPENROUTER_API_BASE: https://openrouter.ai/api/v1
      CLIPZY_FONTS_DIR: /usr/local/share/fonts/clipzy
      CLIPZY_MODELS_DIR: /home/runner/clipzy-models
      CLIPZY_VENV_DIR: /home/runner/clipzy-venv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-clipzy-deno-v1

      # -------------------------------------------------------------------------
      # Reusable-resource caches (models, fonts, Python environment). These are
      # version-keyed and integrity-checked on use. Videos are NEVER cached:
      # every job downloads its own source and renders its own outputs.
      # -------------------------------------------------------------------------
      - name: Cache Python venv (OpenCV, numpy, yt-dlp, requests)
        uses: actions/cache@v4
        with:
          path: /home/runner/clipzy-venv
          key: ${{ runner.os }}-clipzy-venv-v1-${{ hashFiles('.github/workflows/process_clip.yml') }}
          restore-keys: |
            ${{ runner.os }}-clipzy-venv-v1-

      - name: Cache pip download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-clipzy-pip-v1-${{ hashFiles('.github/workflows/process_clip.yml') }}
          restore-keys: |
            ${{ runner.os }}-clipzy-pip-v1-

      - name: Cache YuNet face-detection model
        uses: actions/cache@v4
        with:
          path: /home/runner/clipzy-models
          key: ${{ runner.os }}-clipzy-yunet-2023mar-v1

      - name: Cache subtitle preset fonts
        uses: actions/cache@v4
        with:
          path: /home/runner/clipzy-fonts
          key: ${{ runner.os }}-clipzy-fonts-v1

      - name: Setup FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq bc curl python3 python3-venv awscli ca-certificates

          # yt-dlp comes from PyPI with the [default] extra so that the
          # yt-dlp-ejs plugin (EJS challenge solver, required for full YouTube
          # support) is bundled. The standalone release binary does NOT include
          # yt-dlp-ejs, so it is only a last-resort fallback below.
          PIP_TARGETS=(opencv-python-headless numpy requests "yt-dlp[default]")

          # Isolated Python environment at a STABLE path so it can be restored
          # from the actions cache (venvs embed absolute paths). The cache key
          # hashes this workflow file, so any dependency change invalidates it.
          # pip also re-verifies every target on each run, so a partially stale
          # or corrupted restore self-heals instead of failing the job.
          VENV_DIR="${CLIPZY_VENV_DIR:-/home/runner/clipzy-venv}"
          # CACHE_NOTE must ALWAYS be initialized before any conditional branch:
          # under `set -u` an unset variable would abort the whole step (the
          # "CACHE_NOTE: unbound variable" failure on fresh, cache-miss runs).
          CACHE_NOTE="fresh install"
          VENV_USABLE=false
          if [[ -x "$VENV_DIR/bin/python3" ]] \
             && "$VENV_DIR/bin/python3" -c 'import cv2, numpy, requests' >/dev/null 2>&1; then
            VENV_USABLE=true
            CACHE_NOTE="restored from cache"
          fi
          if [[ "$VENV_USABLE" != "true" ]]; then
            python3 -m venv "$VENV_DIR" || true
          fi
          # Upgrade pip/setuptools inside the venv (best effort, never fatal).
          python3 -m venv --upgrade-deps "$VENV_DIR" >/dev/null 2>&1 || true

          if "$VENV_DIR/bin/pip" install --quiet --upgrade pip \
             && "$VENV_DIR/bin/pip" install --quiet "${PIP_TARGETS[@]}" \
             && "$VENV_DIR/bin/python3" -c 'import cv2, numpy, requests' >/dev/null 2>&1; then
            echo "CLIPZY_PY=$VENV_DIR/bin/python3" >> "$GITHUB_ENV"
            sudo ln -sf "$VENV_DIR/bin/yt-dlp" /usr/local/bin/yt-dlp
            echo "Python venv ready at $VENV_DIR ($CACHE_NOTE): $(du -sh "$VENV_DIR" | cut -f1)"
          else
            echo "WARN: venv setup failed; installing into system Python instead."
            rm -rf "$VENV_DIR"
            if ! sudo python3 -m pip install --quiet --break-system-packages "${PIP_TARGETS[@]}"; then
              python3 -m pip install --quiet opencv-python-headless numpy requests \
                || echo "WARN: system pip install failed too; CV features may degrade."
            fi
            echo "CLIPZY_PY=python3" >> "$GITHUB_ENV"
            if ! command -v yt-dlp >/dev/null 2>&1; then
              # Last resort: standalone release binary WITHOUT the EJS solver
              # plugin; full YouTube support is not guaranteed on this path.
              sudo curl -fL \
                https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
                -o /usr/local/bin/yt-dlp
              sudo chmod 755 /usr/local/bin/yt-dlp
            fi
          fi

          yt-dlp --version
          ffmpeg -version | head -n 1
          aws --version

      - name: Verify FFmpeg capabilities (libass subtitle rendering)
        shell: bash
        run: |
          set -Eeuo pipefail

          FFMPEG_BIN="$(command -v ffmpeg)"
          FFPROBE_BIN="$(command -v ffprobe)"

          if ! "$FFMPEG_BIN" -hide_banner -filters 2>/dev/null | grep -q ' subtitles '; then
            echo "WARN: bundled ffmpeg lacks the libass subtitles filter; installing distro ffmpeg."
            sudo apt-get install -y -qq ffmpeg
            FFMPEG_BIN="/usr/bin/ffmpeg"
            FFPROBE_BIN="/usr/bin/ffprobe"
          fi

          "$FFMPEG_BIN" -hide_banner -filters 2>/dev/null | grep -q ' subtitles ' \
            || { echo "ERROR: no ffmpeg build with libass subtitles support is available."; exit 1; }

          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> "$GITHUB_ENV"
          "$FFMPEG_BIN" -version | head -n 1

      - name: Validate and normalize job parameters
        shell: bash
        env:
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          set -Eeuo pipefail
          mkdir -p work

          python3 <<'PY_NORMALIZE'
          import json
          import os
          import re
          import sys


          SUBTITLE_STYLES = [
              "NONE", "VIRAL", "PODCAST", "IMPACT", "NEON", "MAGENTA", "GOLD", "CRIMSON",
              "CYBER", "BEAST", "MARKER", "RETRO", "GLITCH", "MINIMAL", "EMERALD", "SUNSET", "VIOLET",
          ]
          ASPECT_RATIOS = ["source", "9:16", "16:9", "1:1", "4:5", "4:3", "3:4", "21:9"]
          OUTPUT_QUALITIES = ["original", "1080p", "720p", "480p"]


          def parse_env_json(name):
              raw = (os.environ.get(name) or "").strip()
              if not raw or raw.lower() == "null":
                  return {}
              try:
                  data = json.loads(raw)
              except json.JSONDecodeError:
                  return {}
              return data if isinstance(data, dict) else {}


          payload = parse_env_json("EVENT_PAYLOAD")
          inputs = parse_env_json("INPUTS_JSON")


          def pick(*names, default=None):
              """Read a parameter with snake_case + camelCase aliases, payload first."""
              for source in (payload, inputs):
                  for name in names:
                      if name in source:
                          value = source[name]
                          if value is not None and str(value).strip() != "":
                              return str(value).strip()
              return default


          youtube_url = pick("youtube_url", "youtubeUrl", default="")
          job_id = pick("job_id", "jobId", default="test_job")
          target_duration = pick("target_duration", "targetDuration", default="30-60")
          subtitle_style = pick("subtitle_style", "subtitleStyle", default="VIRAL").upper()
          subtitle_language = pick("subtitle_language", "subtitleLanguage", default="").lower()
          aspect_ratio = pick("aspect_ratio", "aspectRatio", default="source").lower()
          preserve_quality = pick("preserve_source_quality", "preserveSourceQuality", default="true").lower()
          output_quality = pick("output_quality", "outputQuality", default="original").lower()

          errors = []

          # The manual pinch-zoom transform arrives either as a nested object
          # (repository_dispatch / Android payload) or as a JSON string
          # (workflow_dispatch input). It is the SINGLE source of truth shared
          # by the Android preview and the FFmpeg render:
          #   scale    >= 1.0  (1.0 = unzoomed)
          #   offset_x/y        window-center offset in SOURCE-fraction units
          # The visible source window is (W/scale, H/scale) centered at
          # (0.5+offset_x, 0.5+offset_y), clamped so it never leaves the frame.
          manual_raw = None
          for source in (payload, inputs):
              for name in ("manual_transform", "manualTransform"):
                  if name in source and source[name] is not None:
                      manual_raw = source[name]
                      break
              if manual_raw is not None:
                  break
          if isinstance(manual_raw, str):
              manual_raw = manual_raw.strip() or None
              if manual_raw:
                  try:
                      manual_raw = json.loads(manual_raw)
                  except json.JSONDecodeError:
                      errors.append(f"manual_transform is not valid JSON: {str(manual_raw)[:120]}")
                      manual_raw = None
          manual_transform = None
          if isinstance(manual_raw, dict):
              try:
                  scale = float(manual_raw.get("scale", 1.0))
                  off_x = float(manual_raw.get("offset_x", manual_raw.get("offsetX", 0.0)))
                  off_y = float(manual_raw.get("offset_y", manual_raw.get("offsetY", 0.0)))
              except (TypeError, ValueError):
                  errors.append("manual_transform scale/offset_x/offset_y must be numbers.")
                  scale, off_x, off_y = 1.0, 0.0, 0.0
              if not (1.0 <= scale <= 5.0):
                  clamped = min(5.0, max(1.0, scale))
                  print(f"WARN: manual_transform.scale {scale} clamped to {clamped}.")
                  scale = clamped
              limit = (1.0 - 1.0 / scale) / 2.0 if scale > 1.0 else 0.0
              for label, value in (("offset_x", off_x), ("offset_y", off_y)):
                  if abs(value) > limit + 1e-9:
                      print(f"WARN: manual_transform.{label} {value:.4f} clamped to "
                            f"{limit:.4f} so no empty borders appear.")
              off_x = min(limit, max(-limit, off_x))
              off_y = min(limit, max(-limit, off_y))
              if scale > 1.001 or abs(off_x) > 1e-4 or abs(off_y) > 1e-4:
                  manual_transform = {"scale": round(scale, 4),
                                      "offset_x": round(off_x, 4),
                                      "offset_y": round(off_y, 4)}
          elif manual_raw is not None:
              errors.append("manual_transform must be an object with scale/offset_x/offset_y.")

          if not youtube_url:
              errors.append("youtube_url is empty; the Android app must send a video URL.")
          elif not youtube_url.startswith(("http://", "https://")):
              errors.append("youtube_url must start with http:// or https://.")
          elif re.search(r"\s", youtube_url):
              errors.append("youtube_url must not contain whitespace.")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", job_id or ""):
              errors.append("job_id may contain only letters, numbers, dot, underscore and hyphen (max 100 chars).")
          if not re.fullmatch(r"\d+(?:-\d+)?", target_duration or ""):
              errors.append("target_duration must be a number or a range, for example 45 or 30-60.")
          if subtitle_style not in SUBTITLE_STYLES:
              errors.append(f"subtitle_style must be one of: {', '.join(SUBTITLE_STYLES)} (got '{subtitle_style}').")
          if subtitle_language and not re.fullmatch(r"[a-z]{2}(?:-[a-z0-9]{2,8})?", subtitle_language):
              errors.append("subtitle_language must be a BCP-47 style code such as 'id', 'en' or 'en-US' (or empty).")
          if aspect_ratio not in ASPECT_RATIOS:
              errors.append(f"aspect_ratio must be one of: {', '.join(ASPECT_RATIOS)} (got '{aspect_ratio}').")
          if output_quality not in OUTPUT_QUALITIES:
              errors.append(f"output_quality must be one of: {', '.join(OUTPUT_QUALITIES)} (got '{output_quality}').")
          if preserve_quality not in ("true", "false", "1", "0", "yes", "no"):
              errors.append("preserve_source_quality must be true or false.")
          else:
              preserve_quality = "true" if preserve_quality in ("true", "1", "yes") else "false"

          if errors:
              print("ERROR: invalid job parameters:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)

          watermark_url = pick("watermark_url", "watermarkUrl", default="")
          watermark_position = pick("watermark_position", "watermarkPosition", default="bottom_right").lower()
          if watermark_position not in ("top_left", "top_right", "bottom_left", "bottom_right"):
              watermark_position = "bottom_right"
          watermark_size = pick("watermark_size", "watermarkSize", default="medium").lower()
          if watermark_size not in ("small", "medium", "large"):
              watermark_size = "medium"

          params = {
              "youtube_url": youtube_url,
              "job_id": job_id,
              "target_duration": target_duration,
              "subtitle_style": subtitle_style,
              "subtitle_language": subtitle_language,
              "aspect_ratio": aspect_ratio,
              "preserve_source_quality": preserve_quality,
              "output_quality": output_quality,
              "manual_transform": manual_transform,
              "watermark_url": watermark_url,
              "watermark_position": watermark_position,
              "watermark_size": watermark_size,
          }

          os.makedirs("work", exist_ok=True)
          with open("work/params.json", "w", encoding="utf-8") as fh:
              json.dump(params, fh, indent=2, ensure_ascii=False)

          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a", encoding="utf-8") as fh:
                  # Export BOTH naming conventions: the canonical lowercase keys
                  # mirror the Android payload, while later steps read UPPER_CASE
                  # aliases ($YOUTUBE_URL, $JOB_ID, TARGET_DURATION, SUBTITLE_STYLE,
                  # SUBTITLE_LANGUAGE, ASPECT_RATIO, OUTPUT_QUALITY,
                  # PRESERVE_SOURCE_QUALITY). A missing alias would abort the job
                  # under `set -u` (download, upload steps) or silently fall back
                  # to a wrong default (whisper, curation, status.json). All
                  # values are single-line; the manual transform is exported as
                  # compact single-line JSON (downstream consumes params.json).
                  for key, value in params.items():
                      if isinstance(value, dict):
                          value = json.dumps(value, separators=(",", ":"), ensure_ascii=False)
                      value = "" if value is None else str(value)
                      fh.write(f"{key}={value}\n")
                      fh.write(f"{key.upper()}={value}\n")

          print("Normalized job parameters:")
          for key, value in params.items():
              shown = value if key != "youtube_url" else value[:80]
              print(f"  {key} = {shown}")
          if manual_transform:
              print("Manual transform accepted: "
                    f"scale={manual_transform['scale']}, offsets="
                    f"({manual_transform['offset_x']}, {manual_transform['offset_y']}) "
                    "(applied as the base framing for every rendered clip).")
          else:
              print("Manual transform: none (default framing).")
          PY_NORMALIZE

      - name: Download source video
        shell: bash
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -Eeuo pipefail

          # Transcription no longer depends on YouTube captions: every job is
          # transcribed by openai/whisper-large-v3-turbo, so subtitles are not
          # downloaded anymore.
          #
          # =========================================================================
          # FORMAT SELECTION POLICY
          # =========================================================================
          # The render pipeline re-encodes EVERYTHING to H.264 + AAC (libx264 CRF
          # 18, AAC 192k). The source codec/container is therefore irrelevant to
          # the OUTPUT: a VP9/AV1/Opus source yields the same H.264 output as an
          # H.264/AAC source. Forcing `[ext=mp4][ext=m4a]` is pure downside:
          # YouTube increasingly serves 1080p+ as VP9/AV1 video-only + Opus
          # audio-only (no H.264 at that height), so a codec-restricted selector
          # matches nothing on those videos and silently falls through to the
          # muxed `b` limb — which on YouTube is frequently format 18 (360p MP4).
          #
          # The selector below filters on HEIGHT only and uses the `+` operator
          # so yt-dlp MERGES the best DASH video with the best audio via FFmpeg
          # (rather than taking a pre-muxed 360p file). The final `b` is a true
          # last-resort muxed fallback; we explicitly log which format ID was
          # selected so a silent 360p fallback is loudly visible.
          #
          # Selector anatomy:
          #   bv*[height<=N]+ba/bv*+ba/b
          #   ^^^^^^^^^^^^^^^^^^^^  limb 1: best video <=N px MERGED with best audio
          #                       ^^^^^^^^  limb 2: best video ANY height MERGED with best audio
          #                                ^  limb 3: best muxed single-file (last resort)
          #
          # `output_quality=original` -> take up to 4K (highest source pixel count)
          # `output_quality=1080p/720p/480p` -> cap source at 1080p (no benefit
          #   to fetching >1080p when output is fixed at 1080p; saves bandwidth
          #   and decode cost). The render step never upscales beyond source.
          if [[ "${OUTPUT_QUALITY:-original}" == "original" ]]; then
            VIDEO_FMT="bv*[height<=2160]+ba/bv*+ba/b"
          else
            VIDEO_FMT="bv*[height<=1080]+ba/bv*+ba/b"
          fi
          echo "Source format selection (${OUTPUT_QUALITY:-original}): $VIDEO_FMT"

          # =========================================================================
          # PLAYER CLIENT SELECTION (cookie-aware; verified against yt-dlp's
          # extractor source for the pinned version)
          # =========================================================================
          # Root causes of the production failures, confirmed in yt-dlp's
          # youtube extractor code:
          #   1. `tv_embedded` NO LONGER EXISTS in current yt-dlp -> it is
          #      silently dropped from player_client lists (the "tv_embedded
          #      unsupported" log line). Removed everywhere below.
          #   2. `ios`, `android`, `visionos`, `tv_simply` set
          #      SUPPORTS_COOKIES=False: the moment cookies are provided,
          #      yt-dlp SKIPS them ("Skipping client ... since it does not
          #      support cookies"). Requesting ios/android on an authenticated
          #      run was therefore a no-op.
          #   3. `web`, `web_safari`, `mweb` REQUIRE a GVS PO token for
          #      https/dash media. Without a PO token they return only HLS
          #      fragments and storyboards -> the "Only images are available
          #      for download" / "Requested format is not available" errors.
          #   4. `web_embedded`, `tv`, `tv_samsung`, `tv_downgraded` require
          #      NO PO token and DO accept cookies. yt-dlp's own defaults are
          #      _DEFAULT_CLIENTS=(tv_samsung, visionos, web) for anonymous and
          #      _DEFAULT_AUTHED_CLIENTS=(web_embedded, tv_samsung, web) for
          #      cookie-authenticated runs; the sets below mirror them and add
          #      a bounded, differently-shaped fallback set.
          if [[ -n "${YT_COOKIES:-}" ]]; then
            PRIMARY_CLIENTS="web_embedded,tv_samsung,web"
            FALLBACK_CLIENTS="tv,tv_samsung,web_embedded,web,web_safari,mweb"
          else
            PRIMARY_CLIENTS="tv_samsung,visionos,web"
            FALLBACK_CLIENTS="visionos,tv_samsung,android,ios,web"
          fi
          echo "Player clients (primary):  $PRIMARY_CLIENTS"
          echo "Player clients (fallback): $FALLBACK_CLIENTS"

          # =========================================================================
          # COOKIE HANDLING (kept OUT of the workflow log)
          # =========================================================================
          # YT_COOKIES is a Netscape-format cookie file stored as a GitHub
          # Actions secret. We write it to a 0600 file BEFORE invoking yt-dlp
          # and NEVER echo $YT_COOKIES itself (only a true/false marker). The
          # file persists across the diagnostic retry below so the retry can
          # authenticate the same way the main attempt did.
          COOKIE_FLAG=()
          if [[ -n "${YT_COOKIES:-}" ]]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            chmod 600 cookies.txt
            COOKIE_FLAG=(--cookies cookies.txt)
            echo "YouTube cookies: provided (${#YT_COOKIES} bytes); used for main + diagnostic attempts."
          else
            echo "YouTube cookies: NOT provided (anonymous). Bot-detection errors will be unrecoverable."
          fi

          # =========================================================================
          # DOWNLOAD ATTEMPTS (bounded ladder: primary set, then one fallback)
          # =========================================================================
          # `--check-formats` (with NO argument) verifies that the selected
          # format is actually downloadable before committing to the download.
          # NB: yt-dlp's --check-formats accepts NO positional value; an extra
          # word like `present` is parsed as a SECOND URL, producing the
          # `[generic] Extracting URL: present` / `'present' is not a valid URL`
          # error seen in production. NEVER pass an argument after this flag.
          FFMPEG_BIN_VAL="${FFMPEG_BIN:-ffmpeg}"
          FFPROBE_BIN_VAL="${FFPROBE_BIN:-ffprobe}"
          # Top-level defaults: the final "Download complete" echo can never hit
          # an unset variable under `set -u` (verify_download re-initializes
          # these on every attempt; the diagnostic block exits before the echo
          # on any failure path).
          V_W=0
          V_H=0
          V_DUR=0
          V_SIZE=0

          # Storyboard guard: never treat image-only results as video. yt-dlp
          # prints this exact phrasing when the client set exposed only
          # storyboard formats (PO-token gated clients, wrong client for the
          # authentication state, etc.).
          attempt_download() {
            local clients="$1" log="$2"
            yt-dlp \
              --no-playlist \
              --js-runtimes deno \
              --extractor-args "youtube:player_client=$clients" \
              -f "$VIDEO_FMT" \
              --merge-output-format mp4 \
              --check-formats \
              --retries 3 \
              --no-warnings \
              -o "raw_video.%(ext)s" \
              "${COOKIE_FLAG[@]}" \
              "$YOUTUBE_URL" 2>&1 | tee "$log" || true
            # Capture the selected format ID for the audit trail (yt-dlp prints
            # "[info] Downloading N format(s): <id>[:<id>]" for DASH merges, or
            # a single id for muxed streams).
            SELECTED_FMT=$(grep -m1 -oE 'Downloading [0-9]+ format\(s\): [^ ]+' "$log" \
                            | sed -E 's/^Downloading [0-9]+ format\(s\): //') || SELECTED_FMT="(unknown)"
            echo "yt-dlp selected format(s): $SELECTED_FMT"
            if grep -qiE 'only images are available|storyboard' "$log"; then
              echo "WARN: client set [$clients] exposed storyboard/image formats only - no real video streams."
            fi
          }

          verify_download() {
            # Trust the FILE on disk, validated by FFprobe — never yt-dlp's
            # exit code (it is unreliable in both directions). Sets
            # DOWNLOAD_OK=true plus V_W/V_H/V_DUR/V_SIZE on success.
            DOWNLOAD_OK=false
            V_W=0
          V_H=0
          V_DUR=0
          V_SIZE=0

            shopt -s nullglob
            local raw_files=(raw_video.*)
            shopt -u nullglob
            if [[ ${#raw_files[@]} -eq 0 ]]; then
              echo "VERIFY: no raw_video.* file was produced."
              return 0
            fi
            # yt-dlp's output template is raw_video.%(ext)s with
            # --merge-output-format mp4; normalize any odd container to mp4.
            if [[ ${#raw_files[@]} -eq 1 && "${raw_files[0]}" == "raw_video.mp4" ]]; then
              : # canonical, nothing to do
            else
              local largest
              largest=$(ls -S raw_video.* 2>/dev/null | head -1)
              if [[ "$largest" != "raw_video.mp4" ]]; then
                echo "Normalizing source container: $largest -> raw_video.mp4 (no re-encode, just remux)."
                "$FFMPEG_BIN_VAL" -y -nostdin -hide_banner -loglevel error \
                  -i "$largest" -c copy -map 0 -map_metadata 0 raw_video.mp4
                rm -f "$largest"
              fi
            fi

            [[ -s raw_video.mp4 ]] || { echo "VERIFY: raw_video.mp4 missing/empty after normalization."; return 0; }
            local probe width height duration size
            probe=$("$FFPROBE_BIN_VAL" -v error -print_format json \
                          -show_streams -show_format raw_video.mp4 2>/dev/null || echo '{}')
            width=$(printf '%s' "$probe" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((int(s.get('width') or 0) for s in d.get('streams',[]) if s.get('codec_type')=='video'),0))")
            height=$(printf '%s' "$probe" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((int(s.get('height') or 0) for s in d.get('streams',[]) if s.get('codec_type')=='video'),0))")
            duration=$(printf '%s' "$probe" | python3 -c "import json,sys;d=json.load(sys.stdin);print(round(float(d.get('format',{}).get('duration') or 0),3))")
            size=$(stat -c%s raw_video.mp4 2>/dev/null || echo 0)
            V_W=$width; V_H=$height; V_DUR=$duration; V_SIZE=$size
            echo "Verified source: ${V_W}x${V_H}, duration=${V_DUR}s, size=$((V_SIZE/1024/1024))MB"

            [[ "$V_W" -gt 0 && "$V_H" -gt 0 && "$V_SIZE" -gt 10240 ]] || {
              echo "VERIFY: FFprobe validation failed (width=$V_W height=$V_H size=$V_SIZE)."
              return 0
            }
            # Duration is a float; bash `[[ -gt ]]` only handles integers.
            if ! awk -v d="$V_DUR" 'BEGIN{exit !(d > 1.0)}'; then
              echo "VERIFY: duration ${V_DUR}s is too short."
              return 0
            fi
            DOWNLOAD_OK=true
            # Loud warning if the source resolution is below the requested
            # output_quality (a silent 360p fallback must never go unnoticed).
            if [[ "${OUTPUT_QUALITY:-original}" != "original" ]]; then
              local target_short short_side
              target_short=$(echo "${OUTPUT_QUALITY:-1080p}" | tr -d 'p')
              short_side=$(( V_W < V_H ? V_W : V_H ))
              if [[ "$short_side" -lt "$target_short" ]]; then
                echo "WARN: source short-side ${short_side}px is BELOW requested ${OUTPUT_QUALITY};"
                echo "      YouTube returned only muxed/low-res formats for this URL."
                echo "      Output will be capped at ${V_W}x${V_H} (no upscaling; the render step enforces this)."
              fi
            fi
          }

          ATTEMPT_LOGS=()
          USED_CLIENTS="(none)"
          for CLIENT_SET in "$PRIMARY_CLIENTS" "$FALLBACK_CLIENTS"; do
            echo "--- Download attempt with player clients: $CLIENT_SET ---"
            ATTEMPT_LOG="$(mktemp)"
            ATTEMPT_LOGS+=("$ATTEMPT_LOG")
            attempt_download "$CLIENT_SET" "$ATTEMPT_LOG"
            verify_download
            if [[ "$DOWNLOAD_OK" == "true" ]]; then
              USED_CLIENTS="$CLIENT_SET"
              echo "SUCCESS: valid source video obtained with client set [$CLIENT_SET]."
              break
            fi
            echo "Client set [$CLIENT_SET] did not produce a valid video; trying the fallback set..."
          done

          # =========================================================================
          # DIAGNOSTIC DUMP (only on real failure, never prints secrets)
          # =========================================================================
          if [[ "$DOWNLOAD_OK" != "true" ]]; then
            echo "----- yt-dlp failed; diagnostic dump follows (no secrets) -----"
            echo "URL: $YOUTUBE_URL"
            echo "Selector: $VIDEO_FMT"
            echo "Primary clients:   $PRIMARY_CLIENTS"
            echo "Fallback clients:  $FALLBACK_CLIENTS"
            echo "yt-dlp version: $(yt-dlp --version 2>&1 | head -1)"
            echo "Cookies: $([[ -s cookies.txt ]] && echo yes || echo no)"
            echo "Attempts made: ${#ATTEMPT_LOGS[@]}"
            local_i=0
            for LOG in "${ATTEMPT_LOGS[@]}"; do
              local_i=$((local_i + 1))
              echo ""
              echo "=== Attempt $local_i log tail ==="
              tail -30 "$LOG"
            done
            echo ""
            echo "=== Formats visible to PRIMARY client set ($PRIMARY_CLIENTS) ==="
            yt-dlp --no-playlist --js-runtimes deno \
              --extractor-args "youtube:player_client=$PRIMARY_CLIENTS" \
              "${COOKIE_FLAG[@]}" \
              --list-formats "$YOUTUBE_URL" 2>&1 | tail -40 || true
            echo ""
            echo "=== Formats visible to FALLBACK client set ($FALLBACK_CLIENTS) ==="
            yt-dlp --no-playlist --js-runtimes deno \
              --extractor-args "youtube:player_client=$FALLBACK_CLIENTS" \
              "${COOKIE_FLAG[@]}" \
              --list-formats "$YOUTUBE_URL" 2>&1 | tail -40 || true
            echo ""
            echo "REASON HINTS:"
            if [[ -s cookies.txt ]]; then
              echo "  - Cookies were provided: only cookie-compatible clients were used"
              echo "    (ios/android/visionos are auto-skipped by yt-dlp when cookies are set)."
              echo "  - If the format table above shows only storyboard/image rows, the"
              echo "    remaining clients are PO-token gated for this IP; refresh the"
              echo "    YT_COOKIES secret or add a PO-token provider plugin."
            else
              echo "  - No cookies were provided: consider setting the YT_COOKIES secret;"
              echo "    anonymous runner IPs are frequently PO-token/bot gated."
            fi
            echo "----- end diagnostic dump -----"
            for LOG in "${ATTEMPT_LOGS[@]}"; do rm -f "$LOG"; done
            rm -f cookies.txt
            exit 1
          fi

          # Cleanup. Cookie file is removed only AFTER we know we succeeded.
          for LOG in "${ATTEMPT_LOGS[@]}"; do rm -f "$LOG"; done
          rm -f cookies.txt
          echo "Download complete: raw_video.mp4 (${V_W}x${V_H}, ${V_DUR}s) via client set [$USED_CLIENTS]."

      - name: Probe source and enforce duration limits
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work

          # Shared cache manager for all computation caches. Cache entries are
          # JSON keyed by (source content hash, model, parameters, pipeline
          # version) with an embedded TTL; restore-time validation recomputes
          # on any mismatch, so stale entries are ignored, never trusted.
          cat > work/cache_manager.py <<'PY_CACHE_MANAGER'
          """Clipzy computation-cache helpers (never caches videos)."""
          import json
          import os
          import tempfile
          import time


          def load_cached(path, expect, ttl_days=None):
              """Return the cached payload dict when meta matches `expect` and the TTL
              holds; otherwise return None so the caller recomputes."""
              try:
                  with open(path, encoding="utf-8") as fh:
                      data = json.load(fh)
              except (OSError, json.JSONDecodeError, ValueError):
                  return None
              if not isinstance(data, dict):
                  return None
              meta = data.get("cache_meta") or {}
              for key, value in expect.items():
                  if str(meta.get(key)) != str(value):
                      return None
              try:
                  created = float(meta.get("created_at") or 0.0)
              except (TypeError, ValueError):
                  created = 0.0
              if ttl_days and created and (time.time() - created) > ttl_days * 86400.0:
                  return None
              return data


          def save_cached(path, payload, meta):
              """Atomically write payload + cache_meta so a future job can reuse it."""
              os.makedirs(os.path.dirname(path), exist_ok=True)
              body = dict(payload)
              body["cache_meta"] = dict(meta)
              body["cache_meta"]["created_at"] = time.time()
              fd, tmp = tempfile.mkstemp(dir=os.path.dirname(path), suffix=".tmp")
              with os.fdopen(fd, "w", encoding="utf-8") as fh:
                  json.dump(body, fh, ensure_ascii=False)
              os.replace(tmp, path)
          PY_CACHE_MANAGER

          python3 <<'PY_PROBE'
          import hashlib
          import json
          import math
          import os
          import subprocess
          import sys

          ffprobe = os.environ.get("FFPROBE_BIN", "ffprobe")
          cmd = [ffprobe, "-v", "error", "-print_format", "json", "-show_format", "-show_streams", "raw_video.mp4"]
          proc = subprocess.run(cmd, capture_output=True, text=True)
          if proc.returncode != 0:
              print("ERROR: ffprobe failed to inspect raw_video.mp4:")
              print(proc.stderr[-1500:])
              sys.exit(1)

          data = json.loads(proc.stdout)
          video = None
          audio = None
          for stream in data.get("streams", []):
              if stream.get("codec_type") == "video" and video is None:
                  video = stream
              elif stream.get("codec_type") == "audio" and audio is None:
                  audio = stream

          if video is None:
              print("ERROR: the downloaded file contains no video stream.")
              sys.exit(1)

          width = int(video.get("width") or 0)
          height = int(video.get("height") or 0)
          if width <= 0 or height <= 0:
              print("ERROR: could not read video dimensions.")
              sys.exit(1)

          # Honor rotation metadata so the probe reflects display dimensions.
          rotation = 0
          for side_data in video.get("side_data_list") or []:
              if "rotation" in side_data:
                  try:
                      rotation += int(side_data["rotation"])
                  except (TypeError, ValueError):
                      pass
          rotation = abs(rotation) % 360
          if rotation in (90, 270):
              width, height = height, width
              print(f"Rotation metadata detected ({rotation} deg); display dimensions are {width}x{height}.")


          def parse_rate(value):
              if not value:
                  return None
              if "/" in value:
                  num, den = value.split("/", 1)
                  try:
                      num = float(num)
                      den = float(den)
                      return num / den if den else None
                  except ValueError:
                      return None
              try:
                  return float(value)
              except ValueError:
                  return None


          fps = parse_rate(video.get("r_frame_rate")) or parse_rate(video.get("avg_frame_rate")) or 25.0
          SNAP_FPS = [23.976, 24.0, 25.0, 29.97, 30.0, 48.0, 50.0, 59.94, 60.0, 90.0, 120.0]
          fps_snapped = fps
          for candidate in SNAP_FPS:
              if abs(fps - candidate) <= 0.02:
                  fps_snapped = candidate
                  break

          duration = 0.0
          try:
              duration = float(data.get("format", {}).get("duration") or 0.0)
          except (TypeError, ValueError):
              duration = 0.0
          if duration <= 0:
              try:
                  duration = float(video.get("duration") or 0.0)
              except (TypeError, ValueError):
                  duration = 0.0
          if duration <= 0:
              print("ERROR: unable to read video duration.")
              sys.exit(1)

          MAX_SOURCE_SECONDS = 90 * 60
          if duration > MAX_SOURCE_SECONDS:
              print(f"ERROR: source video is {duration / 60.0:.1f} minutes long; the pipeline limit is 90 minutes.")
              print("Rejecting the job before any AI/API spend. Split the source or provide a shorter upload.")
              sys.exit(1)
          if duration > 60 * 60:
              print(f"WARN: source is {duration / 60.0:.1f} minutes long; this job may take a while.")

          gcd = math.gcd(width, height)
          ratio_w, ratio_h = width // gcd, height // gcd
          aspect_label = f"{width / height:.4f}" if ratio_h > 50 else f"{ratio_w}:{ratio_h}"

          # Content fingerprint for the computation caches. The SAME video gets
          # the same hash, so transcripts / keyframes / face scans / curation
          # can be reused on re-runs; a different video can never collide with
          # an old job's results. Videos themselves are never cached.
          sha = hashlib.sha256()
          with open("raw_video.mp4", "rb") as fh:
              for block in iter(lambda: fh.read(4 * 1024 * 1024), b""):
                  sha.update(block)
          source_sha256 = sha.hexdigest()

          video_bitrate = 0
          try:
              video_bitrate = int(video.get("bit_rate") or 0)
          except (TypeError, ValueError):
              video_bitrate = 0
          if not video_bitrate:
              try:
                  video_bitrate = int(data.get("format", {}).get("bit_rate") or 0)
              except (TypeError, ValueError):
                  video_bitrate = 0

          audio_info = None
          if audio is not None:
              audio_info = {
                  "codec": audio.get("codec_name", "unknown"),
                  "channels": int(audio.get("channels") or 0),
                  "sample_rate": int(audio.get("sample_rate") or 0),
                  "bitrate": int(audio.get("bit_rate") or 0),
              }

          source = {
              "file": "raw_video.mp4",
              "width": width,
              "height": height,
              "fps": fps_snapped,
              "fps_exact": round(fps, 6),
              "rotation": rotation,
              "vcodec": video.get("codec_name", "unknown"),
              "pix_fmt": video.get("pix_fmt", "unknown"),
              "duration": round(duration, 3),
              "aspect_ratio": aspect_label,
              "aspect_value": round(width / height, 6),
              "has_audio": audio is not None,
              "audio": audio_info,
              "source_sha256": source_sha256,
              "video_bitrate": video_bitrate,
          }

          os.makedirs("work", exist_ok=True)
          with open("work/source.json", "w", encoding="utf-8") as fh:
              json.dump(source, fh, indent=2)

          env_file = os.environ.get("GITHUB_ENV", "")
          env_values = {
              "SRC_W": str(width),
              "SRC_H": str(height),
              "SRC_FPS": str(round(fps_snapped, 6)),
              "SRC_DURATION": str(round(duration, 3)),
              "SRC_ASPECT": aspect_label,
              "SRC_VCODEC": source["vcodec"],
              "SRC_PIXFMT": source["pix_fmt"],
              "SRC_BITRATE": str(video_bitrate),
              "HAS_AUDIO": "true" if audio is not None else "false",
              "SOURCE_SHA256": source_sha256,
          }
          if env_file:
              with open(env_file, "a", encoding="utf-8") as fh:
                  for key, value in env_values.items():
                      fh.write(f"{key}={value}\n")

          print(f"Source: {width}x{height} @ {fps_snapped:g} fps, {source['vcodec']}/{source['pix_fmt']}, "
                f"{duration:.1f}s, aspect {aspect_label}, audio={audio_info}")
          print(f"Source fingerprint (computation cache key): sha256:{source_sha256[:16]}...; "
                f"video bitrate ~{video_bitrate / 1e6:.2f} Mbps.")
          PY_PROBE

      # ---------------------------------------------------------------------------
      # Computation caches keyed by the source content hash. A cache entry can
      # only ever be restored for the SAME video bytes (and matching model /
      # parameters / pipeline version), and every consumer re-validates the
      # embedded meta before trusting it. Source and rendered videos are
      # deliberately NOT part of any cached path.
      # ---------------------------------------------------------------------------
      - name: Restore transcript cache (Whisper result for this exact source)
        uses: actions/cache@v4
        with:
          path: work/cache/transcript
          key: clipzy-transcript-v2-${{ env.SOURCE_SHA256 }}-${{ env.OPENROUTER_STT_MODEL }}-${{ env.SUBTITLE_LANGUAGE }}

      - name: Restore vision analysis cache (keyframes, scene cuts, face context)
        uses: actions/cache@v4
        with:
          path: |
            work/coarse
            work/frames
            work/frames.json
            work/face_context.json
          key: clipzy-vision-v2-${{ env.SOURCE_SHA256 }}-yunet2023mar

      - name: Prepare speech audio chunks
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_CHUNK'
          import json
          import os
          import subprocess
          import sys

          ffmpeg = os.environ.get("FFMPEG_BIN", "ffmpeg")

          source = json.load(open("work/source.json", encoding="utf-8"))
          duration = source["duration"]
          has_audio = source["has_audio"]

          # 16 kHz mono AAC, 8-minute chunks with a 2 s overlap so word-level timestamps
          # can be de-duplicated across chunk boundaries without losing speech.
          CHUNK_SECONDS = 480.0
          OVERLAP_SECONDS = 2.0

          os.makedirs("work/audio", exist_ok=True)
          chunks = []

          if has_audio:
              index = 0
              start = 0.0
              while start < duration - 0.5:
                  end = min(duration, start + CHUNK_SECONDS)
                  length = end - start
                  if length < 1.5:
                      break
                  path = f"work/audio/chunk_{index:03d}.m4a"
                  cmd = [
                      ffmpeg, "-y", "-nostdin", "-hide_banner", "-loglevel", "error",
                      "-ss", f"{start:.3f}", "-t", f"{length:.3f}", "-i", "raw_video.mp4",
                      "-vn", "-ac", "1", "-ar", "16000", "-c:a", "aac", "-b:a", "48k", path,
                  ]
                  proc = subprocess.run(cmd, capture_output=True, text=True)
                  if proc.returncode != 0 or not os.path.exists(path) or os.path.getsize(path) < 2048:
                      print(f"ERROR: failed to extract speech audio chunk {index}.")
                      print(proc.stderr[-1500:])
                      sys.exit(1)
                  chunks.append({
                      "index": index,
                      "file": path,
                      "start": round(start, 3),
                      "duration": round(length, 3),
                      "overlap": OVERLAP_SECONDS,
                  })
                  print(f"Prepared speech audio chunk {index}: {start:.1f}s +{length:.1f}s (16 kHz mono AAC).")
                  index += 1
                  if end >= duration - 0.5:
                      break
                  start = end - OVERLAP_SECONDS
          else:
              print("Source has no audio stream; transcription will be skipped and no subtitles will be burned.")

          with open("work/audio_chunks.json", "w", encoding="utf-8") as fh:
              json.dump(chunks, fh, indent=2)

          print(f"Speech audio plan: {len(chunks)} chunk(s), {CHUNK_SECONDS:.0f}s each, {OVERLAP_SECONDS:.0f}s overlap.")
          PY_CHUNK

      - name: Download branding watermark logo (if enabled)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY_WM'
          import json
          import os
          import urllib.request

          params = json.load(open("work/params.json", encoding="utf-8"))
          wm_b64 = params.get("watermark_base64", "").strip()
          wm_url = params.get("watermark_url", "").strip()
          if wm_b64:
              print("Decoding Base64 watermark logo...")
              try:
                  import base64
                  if wm_b64.startswith("data:"):
                      wm_b64 = wm_b64.split(",", 1)[-1]
                  data = base64.b64decode(wm_b64)
                  with open("work/watermark_logo.png", "wb") as fh:
                      fh.write(data)
                  print(f"Successfully decoded Base64 watermark_logo.png ({len(data)} bytes) for FFmpeg overlay.")
              except Exception as e:
                  print(f"WARN: failed to decode Base64 watermark logo: {e}; skipping watermark overlay.")
          elif wm_url:
              print(f"Downloading branding watermark logo from {wm_url}...")
              try:
                  urllib.request.urlretrieve(wm_url, "work/watermark_logo.png")
                  if os.path.exists("work/watermark_logo.png") and os.path.getsize("work/watermark_logo.png") > 0:
                      print("Successfully downloaded watermark_logo.png for FFmpeg overlay.")
                  else:
                      print("WARN: downloaded watermark file is empty; skipping watermark overlay.")
              except Exception as e:
                  print(f"WARN: failed to download watermark logo: {e}; skipping watermark overlay.")
          else:
              print("No watermark_base64 or watermark_url provided: skipping watermark overlay.")
          PY_WM

      - name: Transcribe speech with Whisper (word-level timestamps)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "ERROR: OPENROUTER_API_KEY secret is not configured."
            exit 1
          fi

          "$CLIPZY_PY" <<'PY_TRANSCRIBE'
          import json
          import os
          import re
          import sys
          import time
          from difflib import SequenceMatcher

          import requests

          API_BASE = (os.environ.get("OPENROUTER_API_BASE") or "https://openrouter.ai/api/v1").rstrip("/")
          API_KEY = os.environ.get("OPENROUTER_API_KEY", "").strip()
          STT_MODEL = os.environ.get("OPENROUTER_STT_MODEL", "").strip()
          EXPECTED_STT_MODEL = "openai/whisper-large-v3-turbo"
          TRANSCRIBE_ENDPOINT = f"{API_BASE}/audio/transcriptions"

          if not API_KEY:
              print("ERROR: OPENROUTER_API_KEY secret is not configured.")
              sys.exit(1)
          if STT_MODEL != EXPECTED_STT_MODEL:
              print(f"ERROR: refusing to transcribe with '{STT_MODEL}'; Clipzy requires '{EXPECTED_STT_MODEL}'.")
              print("The transcription model must never be silently substituted.")
              sys.exit(1)

          LANGUAGE_HINT = (os.environ.get("SUBTITLE_LANGUAGE") or "").strip()

          sys.path.insert(0, "work")
          import cache_manager

          source = json.load(open("work/source.json", encoding="utf-8"))

          # ---- Computation cache ---------------------------------------------
          # Reuse the Whisper result only for the EXACT same source bytes, STT
          # model, language hint and pipeline version; anything else recomputes.
          TRANSCRIPT_CACHE_VER = "v2"
          cached = cache_manager.load_cached(
              "work/cache/transcript/transcript.json",
              expect={"source_sha256": source.get("source_sha256"), "model": STT_MODEL,
                      "language_hint": LANGUAGE_HINT, "pipeline": TRANSCRIPT_CACHE_VER},
              ttl_days=30)
          if cached is not None:
              transcript = cached["transcript"]
              with open("work/transcript.json", "w", encoding="utf-8") as fh:
                  json.dump(transcript, fh, ensure_ascii=False)
              with open("transcript.txt", "w", encoding="utf-8") as fh:
                  fh.write(cached.get("transcript_text") or "")
              env_file = os.environ.get("GITHUB_ENV", "")
              if env_file:
                  with open(env_file, "a", encoding="utf-8") as fh:
                      fh.write(f"TRANSCRIPT_LANGUAGE={transcript.get('language', '')}\n")
                      fh.write(f"WORD_TIMINGS={'true' if transcript.get('word_timings_available') else 'false'}\n")
                      fh.write("HAS_SPEECH=true\n")
              meta = cached.get("cache_meta") or {}
              print(f"CACHE HIT: transcript reused for source sha256:{source['source_sha256'][:12]} "
                    f"(model {STT_MODEL}); the Whisper API was NOT called - "
                    f"{meta.get('api_calls', '?')} call(s) and ~{meta.get('api_seconds', '?')}s saved.")
              sys.exit(0)

          try:
              chunks = json.load(open("work/audio_chunks.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              chunks = []

          if not chunks:
              transcript = {
                  "language": LANGUAGE_HINT,
                  "word_timings_available": False,
                  "chunk_count": 0,
                  "segments": [],
                  "words": [],
                  "note": "no speech audio available",
              }
              with open("work/transcript.json", "w", encoding="utf-8") as fh:
                  json.dump(transcript, fh, ensure_ascii=False)
              open("transcript.txt", "w", encoding="utf-8").close()
              env_file = os.environ.get("GITHUB_ENV", "")
              if env_file:
                  with open(env_file, "a", encoding="utf-8") as fh:
                      fh.write("TRANSCRIPT_LANGUAGE=\n")
                      fh.write("WORD_TIMINGS=false\n")
                      fh.write("HAS_SPEECH=false\n")
              print("No speech audio; transcript is empty and subtitles will not be burned.")
              sys.exit(0)


          def norm_word(text):
              return re.sub(r"[^\w']+", "", str(text or "").lower())


          def transcribe_chunk(chunk):
              """POST one audio chunk to the OpenRouter transcription endpoint with retries."""
              last_error = ""
              for attempt in range(1, 5):
                  if attempt > 1:
                      delay = min(45, 5 * (2 ** (attempt - 2)))
                      print(f"Retry {attempt}/4 for chunk {chunk['index']} in {delay}s (model {STT_MODEL}).")
                      time.sleep(delay)
                  try:
                      with open(chunk["file"], "rb") as fh:
                          files = {"file": (os.path.basename(chunk["file"]), fh, "audio/mp4")}
                          data = [
                              ("model", STT_MODEL),
                              ("response_format", "verbose_json"),
                              ("timestamp_granularities[]", "segment"),
                              ("timestamp_granularities[]", "word"),
                          ]
                          if LANGUAGE_HINT:
                              data.append(("language", LANGUAGE_HINT))
                          response = requests.post(
                              TRANSCRIBE_ENDPOINT,
                              headers={
                                  "Authorization": f"Bearer {API_KEY}",
                                  "HTTP-Referer": "https://clipzy.app",
                                  "X-Title": "Clipzy Engine",
                              },
                              files=files,
                              data=data,
                              timeout=600,
                          )
                  except requests.RequestException as exc:
                      last_error = f"transport error: {exc}"
                      print(f"WARN: chunk {chunk['index']} attempt {attempt}: {last_error}")
                      continue
                  if response.status_code == 200:
                      try:
                          return response.json()
                      except ValueError:
                          last_error = "invalid JSON in 200 response"
                          print(f"WARN: chunk {chunk['index']} attempt {attempt}: {last_error}")
                          continue
                  body = (response.text or "")[:500]
                  if response.status_code in (400, 401, 403, 404, 405, 422):
                      raise RuntimeError(
                          f"Whisper transcription rejected chunk {chunk['index']} "
                          f"(HTTP {response.status_code}, model {STT_MODEL}): {body}")
                  last_error = f"HTTP {response.status_code}: {body}"
                  print(f"WARN: chunk {chunk['index']} attempt {attempt}: {last_error}")
              raise RuntimeError(
                  f"Whisper transcription failed for chunk {chunk['index']} after 4 attempts "
                  f"using model {STT_MODEL} on {TRANSCRIBE_ENDPOINT}. Last error: {last_error}. "
                  "The pipeline refuses to switch transcription models; check the OpenRouter dashboard and retry.")


          def extract_words(payload, offset):
              """Collect word-level timings (offset to global time) from verbose_json."""
              words = []

              def absorb(entry):
                  try:
                      word = str(entry.get("word") or entry.get("text") or "").strip()
                      start = float(entry["start"]) + offset
                      end = float(entry["end"]) + offset
                  except (KeyError, TypeError, ValueError):
                      return
                  if word and end > start - 0.2:
                      words.append({"word": word, "start": round(start, 3), "end": round(end, 3)})

              for segment in payload.get("segments") or []:
                  for entry in segment.get("words") or []:
                      absorb(entry)
              if not words:
                  for entry in payload.get("words") or []:
                      absorb(entry)
              return words


          def extract_segments(payload, offset):
              segments = []
              for segment in payload.get("segments") or []:
                  try:
                      text = str(segment.get("text") or "").strip()
                      start = float(segment["start"]) + offset
                      end = float(segment["end"]) + offset
                  except (KeyError, TypeError, ValueError):
                      continue
                  if text:
                      segments.append({"start": round(start, 3), "end": round(end, 3), "text": text})
              return segments


          merged_words = []
          merged_segments = []
          detected_language = ""
          word_timings_available = False

          # Chunks are independent API calls: transcribe them in parallel to
          # cut wall-clock time on long sources (results stay ordered because
          # executor.map preserves input order; merging is still sequential).
          api_started = time.time()
          MAX_PARALLEL = 4
          try:
              from concurrent.futures import ThreadPoolExecutor
              if len(chunks) > 1:
                  print(f"Transcribing {len(chunks)} chunk(s) with {MAX_PARALLEL} parallel workers (model {STT_MODEL}).")
              with ThreadPoolExecutor(max_workers=min(MAX_PARALLEL, max(1, len(chunks)))) as pool:
                  payloads = list(pool.map(transcribe_chunk, chunks))
          except RuntimeError as exc:
              print(f"ERROR: {exc}")
              sys.exit(1)
          api_seconds = time.time() - api_started

          for chunk, payload in zip(chunks, payloads):
              served = payload.get("model")
              if served and served != STT_MODEL:
                  print(f"WARN: upstream served '{served}' for a '{STT_MODEL}' request.")
              if not detected_language:
                  detected_language = str(payload.get("language") or "").strip()

              offset = chunk["start"]
              overlap = float(chunk.get("overlap") or 0.0)
              chunk_words = extract_words(payload, offset)
              chunk_segments = extract_segments(payload, offset)
              if chunk_words:
                  word_timings_available = True

              # Remove words duplicated by the chunk overlap before merging.
              if chunk["index"] > 0:
                  recent = [(norm_word(w["word"]), w["start"]) for w in merged_words[-40:]]
                  kept_words = []
                  for word in chunk_words:
                      local_start = word["start"] - offset
                      duplicate = local_start < overlap - 0.15
                      if not duplicate and local_start < overlap + 0.6:
                          for norm, start in recent:
                              if norm == norm_word(word["word"]) and abs(start - word["start"]) < 0.75:
                                  duplicate = True
                                  break
                      if not duplicate:
                          kept_words.append(word)
                  chunk_words = kept_words

                  kept_segments = []
                  for segment in chunk_segments:
                      local_start = segment["start"] - offset
                      duplicate = local_start < overlap - 0.15
                      if not duplicate and local_start < overlap + 1.0:
                          for merged in merged_segments[-8:]:
                              if (merged["end"] > segment["start"] - 0.5
                                      and SequenceMatcher(None, merged["text"], segment["text"]).ratio() > 0.85):
                                  duplicate = True
                                  break
                      if not duplicate:
                          kept_segments.append(segment)
                  chunk_segments = kept_segments

              merged_words.extend(chunk_words)
              merged_segments.extend(chunk_segments)
              print(f"Transcribed chunk {chunk['index']}: {len(chunk_segments)} segments, {len(chunk_words)} words.")

          merged_words.sort(key=lambda item: item["start"])

          # Group words into segments when the provider only returned word timings.
          if merged_words and not merged_segments:
              current = None
              for word in merged_words:
                  if current is None or (word["start"] - current["end"]) > 0.8 or len(current["_words"]) >= 14:
                      if current is not None:
                          merged_segments.append(current)
                      current = {"start": word["start"], "end": word["end"], "text": word["word"], "_words": [word]}
                  else:
                      current["end"] = max(current["end"], word["end"])
                      current["text"] = (current["text"] + " " + word["word"]).strip()
                      current["_words"].append(word)
              if current is not None:
                  merged_segments.append(current)

          merged_segments.sort(key=lambda item: item["start"])

          # Attach word timings to their segments (segment-level timing only otherwise).
          for segment in merged_segments:
              seg_words = [w for w in merged_words
                           if segment["start"] - 0.3 <= w["start"] <= segment["end"] + 0.3]
              segment["words"] = seg_words
              segment.pop("_words", None)

          resolved_language = LANGUAGE_HINT or detected_language or ""

          transcript = {
              "language": resolved_language,
              "detected_language": detected_language,
              "word_timings_available": word_timings_available,
              "chunk_count": len(chunks),
              "model": STT_MODEL,
              "segments": merged_segments,
              "words": merged_words,
          }

          with open("work/transcript.json", "w", encoding="utf-8") as fh:
              json.dump(transcript, fh, ensure_ascii=False)


          def fmt_ts(seconds):
              seconds = max(0.0, float(seconds))
              minutes = int(seconds // 60)
              return f"{minutes:02d}:{seconds - minutes * 60:05.2f}"


          MAX_TRANSCRIPT_CHARS = 15000
          lines = [f"[{fmt_ts(seg['start'])}] {seg['text']}" for seg in merged_segments]
          if lines and sum(len(line) for line in lines) > MAX_TRANSCRIPT_CHARS:
              total = len(lines)
              step = max(1, total // 900)
              sampled = lines[::step]
              if sampled[-1] != lines[-1]:
                  sampled.append(lines[-1])
              lines = [f"(transcript sampled for length: showing {len(sampled)} of {total} segments)"] + sampled

          with open("transcript.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines))

          env_file = os.environ.get("GITHUB_ENV", "")
          if env_file:
              with open(env_file, "a", encoding="utf-8") as fh:
                  fh.write(f"TRANSCRIPT_LANGUAGE={resolved_language}\n")
                  fh.write(f"WORD_TIMINGS={'true' if word_timings_available else 'false'}\n")
                  fh.write("HAS_SPEECH=true\n")

          # Store the transcript in the computation cache for future re-runs of
          # this exact source (never the video itself, only derived JSON).
          cache_manager.save_cached(
              "work/cache/transcript/transcript.json",
              {"transcript": transcript,
               "transcript_text": open("transcript.txt", encoding="utf-8").read()},
              meta={"source_sha256": source.get("source_sha256"), "model": STT_MODEL,
                    "language_hint": LANGUAGE_HINT, "pipeline": TRANSCRIPT_CACHE_VER,
                    "api_calls": len(chunks), "api_seconds": round(api_seconds, 1)})

          print(f"Transcript complete: {len(merged_segments)} segments, {len(merged_words)} words, "
                f"language={resolved_language or 'unknown'}, word_timings={word_timings_available} "
                f"({len(chunks)} Whisper call(s) in {api_seconds:.1f}s; cached for this source hash).")
          PY_TRANSCRIBE

      - name: Extract representative keyframes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p work/frames

          python3 <<'PY_FRAMES'
          import json
          import os
          import re
          import subprocess
          import sys

          ffmpeg = os.environ.get("FFMPEG_BIN", "ffmpeg")
          source = json.load(open("work/source.json", encoding="utf-8"))
          duration = source["duration"]

          sys.path.insert(0, "work")
          import cache_manager

          # ---- Computation cache ---------------------------------------------
          # Keyframes + scene cuts are a pure function of the source bytes:
          # reuse them for the exact same video, skip the decode passes.
          VISION_CACHE_VER = "v2"
          cached = cache_manager.load_cached(
              "work/frames.json",
              expect={"source_sha256": source.get("source_sha256"),
                      "pipeline": VISION_CACHE_VER},
              ttl_days=30)
          if cached is not None:
              ai_frames = cached.get("ai_frames") or []
              files_ok = all(os.path.exists(f["file"]) for f in ai_frames)
              if ai_frames and files_ok:
                  print(f"CACHE HIT: {len(ai_frames)} keyframes + scene cuts reused for source "
                        f"sha256:{source['source_sha256'][:12]} (no frame decode passes this run).")
                  sys.exit(0)
              print("WARN: cached frame manifest references missing files; re-extracting.")

          os.makedirs("work/coarse", exist_ok=True)
          os.makedirs("work/frames", exist_ok=True)

          # One bounded decode pass produces the coarse sampling grid (~1 frame / 8 s,
          # capped at 400 samples). These frames serve BOTH the AI vision input and the
          # coarse face scan.
          MAX_COARSE_SAMPLES = 400
          interval = max(8.0, duration / MAX_COARSE_SAMPLES)

          cmd = [
              ffmpeg, "-y", "-nostdin", "-hide_banner", "-loglevel", "error", "-i", "raw_video.mp4",
              "-an", "-vf", f"fps=1/{interval:.3f},scale=768:-2:flags=bicubic",
              "-q:v", "5", "work/coarse/coarse_%05d.jpg",
          ]
          proc = subprocess.run(cmd, capture_output=True, text=True)
          if proc.returncode != 0:
              print("ERROR: coarse frame extraction failed:")
              print(proc.stderr[-1500:])
              sys.exit(1)

          coarse_frames = []
          for index, name in enumerate(sorted(os.listdir("work/coarse"))):
              if name.endswith(".jpg"):
                  coarse_frames.append({"file": f"work/coarse/{name}", "t": round(index * interval, 2)})
          print(f"Extracted {len(coarse_frames)} coarse frames at 1/{interval:.1f}s sampling.")

          # Precise scene-change detection (bounded decode cost: sources up to 30 minutes).
          scene_times = []
          if duration <= 1800:
              cmd = [
                  ffmpeg, "-nostdin", "-hide_banner", "-i", "raw_video.mp4", "-an",
                  "-vf", "select='gt(scene,0.30)',showinfo", "-f", "null", "-",
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True)
              scene_times = [float(m) for m in re.findall(r"pts_time:(\d+(?:\.\d+)?)", proc.stderr or "")]
              scene_times = [t for t in scene_times if 0.5 < t < duration - 0.5]
              if len(scene_times) > 40:
                  step = len(scene_times) / 40.0
                  scene_times = [scene_times[int(i * step)] for i in range(40)]
              print(f"Scene-change detection found {len(scene_times)} cuts.")

          scene_frames = []
          for position, t in enumerate(scene_times[:8]):
              path = f"work/frames/scene_{position:03d}.jpg"
              cmd = [
                  ffmpeg, "-y", "-nostdin", "-hide_banner", "-loglevel", "error",
                  "-ss", f"{t:.3f}", "-i", "raw_video.mp4", "-frames:v", "1",
                  "-vf", "scale=768:-2:flags=bicubic", "-q:v", "5", path,
              ]
              if subprocess.run(cmd, capture_output=True).returncode == 0 and os.path.exists(path):
                  scene_frames.append({"file": path, "t": round(t, 2)})

          # Choose the final AI frame set: scene-change frames + evenly spaced interval
          # frames, de-duplicated, capped at 12 (the GPT-6 Luna vision budget).
          MAX_AI_FRAMES = 12
          chosen = []
          used_times = []
          for frame in scene_frames:
              if any(abs(frame["t"] - t) < 2.0 for t in used_times):
                  continue
              chosen.append(frame)
              used_times.append(frame["t"])
              if len(chosen) >= 6:
                  break

          if coarse_frames:
              remaining = MAX_AI_FRAMES - len(chosen)
              if remaining > 0:
                  step = max(1, len(coarse_frames) // remaining)
                  for frame in coarse_frames[::step]:
                      if len(chosen) >= MAX_AI_FRAMES:
                          break
                      if any(abs(frame["t"] - t) < 2.0 for t in used_times):
                          continue
                      chosen.append(frame)
                      used_times.append(frame["t"])

          chosen.sort(key=lambda frame: frame["t"])
          if chosen and coarse_frames:
              if (chosen[0]["t"] > interval * 1.5 and len(chosen) < MAX_AI_FRAMES
                      and not any(abs(coarse_frames[0]["t"] - t) < 2.0 for t in used_times)):
                  chosen.append(coarse_frames[0])
                  used_times.append(coarse_frames[0]["t"])
              if (chosen[-1]["t"] < duration - interval * 1.5 and len(chosen) < MAX_AI_FRAMES
                      and not any(abs(coarse_frames[-1]["t"] - t) < 2.0 for t in used_times)):
                  chosen.append(coarse_frames[-1])
                  used_times.append(coarse_frames[-1]["t"])
              chosen.sort(key=lambda frame: frame["t"])

          frames_manifest = {
              "coarse_interval": round(interval, 3),
              "coarse_count": len(coarse_frames),
              "scene_cuts": scene_times,
              "ai_frames": chosen,
          }
          cache_manager.save_cached(
              "work/frames.json", frames_manifest,
              meta={"source_sha256": source.get("source_sha256"),
                    "pipeline": VISION_CACHE_VER})

          print(f"GPT-6 Luna will receive {len(chosen)} representative frames at "
                f"{[f['t'] for f in chosen]}")
          PY_FRAMES

      - name: Scan for faces (coarse)
        shell: bash
        run: |
          set -Eeuo pipefail

          # YuNet (OpenCV Zoo) is the primary detector; the Haar cascade is the
          # fallback. The model file is cached between jobs at
          # $CLIPZY_MODELS_DIR (version-tagged cache key); it is only
          # downloaded when the cached copy is missing or fails validation.
          # The model is stored via Git LFS upstream, so the media endpoint is
          # required (the raw URL only returns a 131-byte LFS pointer stub).
          MODELS_DIR="${CLIPZY_MODELS_DIR:-/home/runner/clipzy-models}"
          mkdir -p "$MODELS_DIR" work
          YUNET_URL="https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"

          yunet_ready() {
            [[ -s "$1" ]] && [[ "$(stat -c%s "$1" 2>/dev/null || echo 0)" -gt 100000 ]]
          }

          if yunet_ready "$MODELS_DIR/yunet.onnx"; then
            cp "$MODELS_DIR/yunet.onnx" work/yunet.onnx
            echo "YuNet model restored from the resource cache: $(stat -c%s work/yunet.onnx) bytes."
          else
            if curl -fsSL --retry 3 --retry-delay 2 -m 90 -o work/yunet.onnx "$YUNET_URL" \
               && yunet_ready work/yunet.onnx; then
              cp work/yunet.onnx "$MODELS_DIR/yunet.onnx"
              echo "YuNet model downloaded ($(stat -c%s work/yunet.onnx) bytes) and added to the resource cache."
            else
              echo "WARN: YuNet model unavailable; the Haar cascade will be used."
              rm -f work/yunet.onnx "$MODELS_DIR/yunet.onnx"
            fi
          fi

          cat > work/clipzy_vision.py <<'PY_VISION_MODULE'
          """Shared computer-vision helpers for Clipzy (exists only inside the Actions runner)."""
          import os

          import cv2
          import numpy as np


          def load_detector(score_threshold=0.6):
              """Load YuNet (preferred) or the Haar cascade fallback."""
              model_path = os.path.join(os.path.dirname(os.path.abspath(__file__)), "yunet.onnx")
              if os.path.exists(model_path) and os.path.getsize(model_path) > 100_000:
                  try:
                      detector = cv2.FaceDetectorYN.create(model_path, "", (320, 320), score_threshold, 0.3, 5000)
                      return "yunet", detector
                  except cv2.error:
                      pass
              cascade = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_frontalface_default.xml")
              return "haar", cascade


          def detect_faces(image, method, detector):
              """Return [(x, y, w, h, confidence)] in image pixel coordinates."""
              height, width = image.shape[:2]
              boxes = []
              if method == "yunet":
                  scale = 1.0
                  working = image
                  if max(width, height) > 640:
                      scale = 640.0 / max(width, height)
                      working = cv2.resize(image, (int(width * scale), int(height * scale)),
                                           interpolation=cv2.INTER_AREA)
                  wh, ww = working.shape[:2]
                  detector.setInputSize((ww, wh))
                  retval, faces = detector.detect(working)
                  if retval is not None and faces is not None:
                      for face in faces:
                          x, y, w, h = (float(v) / scale for v in face[:4])
                          score = float(face[14]) if len(face) > 14 else 0.0
                          boxes.append((x, y, w, h, score))
              else:
                  gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
                  rects = detector.detectMultiScale(
                      gray, scaleFactor=1.08, minNeighbors=5,
                      minSize=(max(24, int(min(height, width) * 0.06)),) * 2,
                  )
                  if rects is not None:
                      for (x, y, w, h) in rects:
                          boxes.append((float(x), float(y), float(w), float(h), 0.55))
              return boxes


          class IoUTracker:
              """Minimal IoU-based face tracker with stable IDs and an aging policy."""

              def __init__(self, max_age_seconds=1.0):
                  self.max_age = max_age_seconds
                  self.tracks = []
                  self.next_id = 1

              @staticmethod
              def _iou(a, b):
                  ax, ay, aw, ah = a
                  bx, by, bw, bh = b
                  x1, y1 = max(ax, bx), max(ay, by)
                  x2, y2 = min(ax + aw, bx + bw), min(ay + ah, by + bh)
                  inter = max(0.0, x2 - x1) * max(0.0, y2 - y1)
                  union = aw * ah + bw * bh - inter
                  return inter / union if union > 0 else 0.0

              def update(self, t, detections):
                  """detections: [(x, y, w, h, conf)]. Returns [(id, box, conf)] after matching."""
                  assigned = set()
                  results = []
                  for track in self.tracks:
                      best, best_iou = None, 0.25
                      for index, (x, y, w, h, conf) in enumerate(detections):
                          if index in assigned:
                              continue
                          iou = self._iou(track["box"], (x, y, w, h))
                          if iou > best_iou:
                              best, best_iou = index, iou
                      if best is not None:
                          x, y, w, h, conf = detections[best]
                          track["box"] = (x, y, w, h)
                          track["last_t"] = t
                          track["missed_since"] = None
                          track["history"].append((t, x, y, w, h, conf))
                          assigned.add(best)
                          results.append((track["id"], (x, y, w, h), conf))
                  for track in self.tracks:
                      if track["missed_since"] is None and track["last_t"] != t:
                          track["missed_since"] = t
                  self.tracks = [tr for tr in self.tracks
                                 if tr["missed_since"] is None or (t - tr["missed_since"]) <= self.max_age]
                  for index, (x, y, w, h, conf) in enumerate(detections):
                      if index in assigned:
                          continue
                      track = {"id": self.next_id, "box": (x, y, w, h), "last_t": t,
                               "missed_since": None, "history": [(t, x, y, w, h, conf)]}
                      self.next_id += 1
                      self.tracks.append(track)
                      results.append((track["id"], (x, y, w, h), conf))
                  return results


          def histogram_correlation(prev_gray, gray):
              """Scene-cut helper: histogram correlation between consecutive frames."""
              if prev_gray is None:
                  return 1.0
              hist_a = cv2.calcHist([prev_gray], [0], None, [64], [0, 256])
              hist_b = cv2.calcHist([gray], [0], None, [64], [0, 256])
              cv2.normalize(hist_a, hist_a)
              cv2.normalize(hist_b, hist_b)
              return float(cv2.compareHist(hist_a, hist_b, cv2.HISTCMP_CORREL))
          PY_VISION_MODULE

          "$CLIPZY_PY" <<'PY_FACE_SCAN'
          import json
          import os
          import sys

          sys.path.insert(0, "work")

          import cv2

          import cache_manager
          import clipzy_vision as vision

          source = json.load(open("work/source.json", encoding="utf-8"))
          method, detector = vision.load_detector()

          # ---- Computation cache ---------------------------------------------
          # The coarse face scan is deterministic for (source bytes, detector):
          # reuse it when both match exactly.
          VISION_CACHE_VER = "v2"
          cached = cache_manager.load_cached(
              "work/face_context.json",
              expect={"source_sha256": source.get("source_sha256"),
                      "pipeline": VISION_CACHE_VER, "detector": method},
              ttl_days=30)
          if cached is not None:
              print(f"CACHE HIT: coarse face scan reused for source "
                    f"sha256:{source['source_sha256'][:12]} (detector {method}).")
              sys.exit(0)

          frames_manifest = json.load(open("work/frames.json", encoding="utf-8"))
          interval = frames_manifest["coarse_interval"]

          samples = []
          faces_total = 0
          for index in range(frames_manifest["coarse_count"]):
              path = f"work/coarse/coarse_{index + 1:05d}.jpg"
              if not os.path.exists(path):
                  continue
              image = cv2.imread(path)
              if image is None:
                  continue
              height, width = image.shape[:2]
              boxes = vision.detect_faces(image, method, detector)
              faces = []
              for (x, y, w, h, conf) in boxes:
                  faces.append({
                      "x": round((x + w / 2) / width, 4),
                      "y": round((y + h / 2) / height, 4),
                      "w": round(w / width, 4),
                      "h": round(h / height, 4),
                      "conf": round(float(conf), 3),
                  })
              faces_total += len(faces)
              samples.append({"t": round(index * interval, 2), "faces": faces})

          frames_with_faces = sum(1 for s in samples if s["faces"])
          pct = (100.0 * frames_with_faces / len(samples)) if samples else 0.0
          avg = (faces_total / len(samples)) if samples else 0.0

          context = {
              "method": method,
              "sample_count": len(samples),
              "frames_with_faces_pct": round(pct, 1),
              "avg_faces_per_frame": round(avg, 2),
              "samples": samples,
          }
          cache_manager.save_cached(
              "work/face_context.json", context,
              meta={"source_sha256": source.get("source_sha256"),
                    "pipeline": VISION_CACHE_VER, "detector": method})

          print(f"Coarse face scan ({method}): faces visible in {pct:.0f}% of {len(samples)} samples, "
                f"average {avg:.1f} face(s) per frame.")
          PY_FACE_SCAN

      - name: Restore curation cache (GPT-6 Luna result for this exact source)
        uses: actions/cache@v4
        with:
