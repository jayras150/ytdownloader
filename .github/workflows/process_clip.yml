          key: clipzy-curation-v2-${{ env.SOURCE_SHA256 }}-${{ env.OPENROUTER_CHAT_MODEL }}-${{ env.TARGET_DURATION }}-${{ env.SUBTITLE_LANGUAGE }}-p1

      - name: Curate viral clips with GPT-6 Luna (multimodal)
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -Eeuo pipefail

