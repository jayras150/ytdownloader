name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        default: 'test_job'

jobs:
  auto-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Cache Tools & Dependencies
      - name: Cache Tools & Dependencies
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/yt-dlp
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-clipzy-tools-v1
          restore-keys: |
            ${{ runner.os }}-clipzy-tools-

      # 1. Setup FFmpeg & FFprobe
      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Deno (Engine JS Bypass Proteksi YouTube)
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 3. Install Standalone yt-dlp & Tool Pendukung
      - name: Install yt-dlp & Dependencies
        run: |
          if [ ! -f /usr/local/bin/yt-dlp ]; then
            echo "Mengunduh binary yt-dlp..."
            sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
            sudo chmod a+rx /usr/local/bin/yt-dlp
          else
            echo "yt-dlp dipulihkan dari cache."
            sudo chmod a+rx /usr/local/bin/yt-dlp
          fi
          which jq >/dev/null 2>&1 && which bc >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq jq bc)

      # 4. Download Video, Ekstrak Audio Ringan, & Ekstrak Subtitle YouTube
      - name: Download Video & Extract Audio
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          YOUTUBE_URL="${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}"
          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          echo "Downloading video dari $YOUTUBE_URL..."
          yt-dlp \
            $COOKIE_ARG \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web,tv_embedded" \
            -f "bv*[ext=mp4]+ba[ext=m4a]/bestvideo+bestaudio/b[ext=mp4]/best" \
            --merge-output-format mp4 \
            --write-auto-sub --sub-lang "id,en" --convert-subs "srt" \
            "$YOUTUBE_URL" -o "raw_video.mp4"

          rm -f cookies.txt

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          echo "Durasi video: $DURATION detik"
          echo "VIDEO_DURATION=$DURATION" >> $GITHUB_ENV

          ffmpeg -y -i raw_video.mp4 -vn -ac 1 -ar 16000 -c:a aac -b:a 32k audio_speech.m4a

      # 5. Baca Subtitle/Transkrip Asli
      - name: Extract Transcript Text
        run: |
          SUB_FILE=$(ls *.srt 2>/dev/null | head -n 1)
          if [ -n "$SUB_FILE" ] && [ -f "$SUB_FILE" ]; then
            echo "Subtitle ditemukan ($SUB_FILE), mengambil percakapan video..."
            CLEAN_TEXT=$(grep -vE '^[0-9]+$' "$SUB_FILE" | grep -vE '^[0-9]{2}:[0-9]{2}' | tr '\n' ' ' | sed 's/  */ /g' | cut -c 1-2500)
            echo "TRANSCRIPT_SUMMARY=$CLEAN_TEXT" >> $GITHUB_ENV
          else
            echo "Subtitle auto-sub tidak ada, menggunakan ringkasan estimasi konten..."
            echo "TRANSCRIPT_SUMMARY=Percakapan menarik dan diskusi viral video berdurasi $VIDEO_DURATION detik." >> $GITHUB_ENV
          fi

      # 6. Kurasi AI Multi-Clips via OpenRouter (openai/gpt-6-luna)
      - name: AI Multi-Clip Viral Curation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT_TEXT="Durasi video: ${VIDEO_DURATION} detik.
          Transkrip isi video:
          ${TRANSCRIPT_SUMMARY}

          Kamu adalah AI video editor profesional ala OpusClip.
          Pilih 3 segmen paling seru dan viral dengan durasi 30-50 detik per segmen.
          Pastikan start_sec dan end_sec proporsional sesuai isi video (jangan melebihi ${VIDEO_DURATION}).
          Berikan judul nyata yang sesuai dengan topik bahasan (BUKAN 'Judul Clickbait'), hook asli, dan deskripsi relevan.

          Kembalikan HANYA array JSON murni tanpa markdown:
          [
            {
              \"clip_index\": 1,
              \"start_sec\": 5.0,
              \"end_sec\": 35.0,
              \"viral_score\": 95,
              \"hook\": \"Hook kalimat pertama yang menarik\",
              \"title\": \"Judul Relevan Topik Video\",
              \"description\": \"Deskripsi video singkat\",
              \"tags\": [\"#shorts\", \"#viral\", \"#fyp\"]
            }
          ]"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{
            model: "openai/gpt-6-luna",
            messages: [
              {"role": "system", "content": "You are a professional viral video curator. Output strictly raw valid JSON array."},
              {"role": "user", "content": $prompt}
            ],
            temperature: 0.3
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://clipzy.app" \
            -H "X-Title: Clipzy Engine" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "OpenRouter HTTP Status: $HTTP_STATUS"
          RAW_CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g' | tr -d '\r\n')

          if [ "$HTTP_STATUS" -ne 200 ] || [ -z "$CLEAN_JSON" ] || ! echo "$CLEAN_JSON" | jq empty > /dev/null 2>&1; then
            echo "OpenRouter Response atau JSON tidak valid:"
            echo "$HTTP_BODY"

            S1=$(echo "$VIDEO_DURATION * 0.05" | bc | cut -d'.' -f1)
            E1=$(echo "$S1 + 30" | bc)
            S2=$(echo "$VIDEO_DURATION * 0.35" | bc | cut -d'.' -f1)
            E2=$(echo "$S2 + 30" | bc)
            S3=$(echo "$VIDEO_DURATION * 0.65" | bc | cut -d'.' -f1)
            E3=$(echo "$S3 + 30" | bc)

            CLEAN_JSON=$(jq -n \
              --arg s1 "$S1.0" --arg e1 "$E1.0" \
              --arg s2 "$S2.0" --arg e2 "$E2.0" \
              --arg s3 "$S3.0" --arg e3 "$E3.0" \
              '[
                {"clip_index":1,"start_sec":($s1|tonumber),"end_sec":($e1|tonumber),"viral_score":95,"hook":"Momen terbaik pembuka!","title":"Sorotan Utama Pembahasan","description":"Bagian penting yang wajib kamu lihat.","tags":["#shorts","#viral"]},
                {"clip_index":2,"start_sec":($s2|tonumber),"end_sec":($e2|tonumber),"viral_score":91,"hook":"Bagian paling menarik!","title":"Klimaks Pembicaraan","description":"Simak penjelasan detailnya di sini.","tags":["#trending","#clipzy"]},
                {"clip_index":3,"start_sec":($s3|tonumber),"end_sec":($e3|tonumber),"viral_score":87,"hook":"Kesimpulan tak terduga!","title":"Ending Penjelasan Menarik","description":"Bagikan pendapatmu di komentar!","tags":["#highlight","#popular"]}
              ]')
          fi

          echo "$CLEAN_JSON" > clips_manifest.json
          cat clips_manifest.json

      # 7. Render Semua Klip (Anti Black Screen, Frame-Accurate, & -nostdin)
      - name: Render All Clips (Android Compatible)
        run: |
          mkdir -p output_clips

          jq -c '.[]' clips_manifest.json | while read -r clip; do
            IDX=$(echo "$clip" | jq -r '.clip_index')
            START=$(echo "$clip" | jq -r '.start_sec')
            END=$(echo "$clip" | jq -r '.end_sec')
            DUR=$(echo "$END - $START" | bc)

            echo "Rendering Clip #$IDX: $START s/d $END (Durasi $DUR s)..."

            ffmpeg -nostdin -y -i raw_video.mp4 \
              -ss "$START" -t "$DUR" \
              -vf "crop='w=min(in_w,in_h*9/16):h=min(in_h,in_w*16/9):x=(in_w-out_w)/2:y=(in_h-out_h)/2',scale=1080:1920:flags=bilinear" \
              -c:v libx264 -preset ultrafast -crf 20 \
              -g 30 -keyint_min 30 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -avoid_negative_ts make_zero \
              -movflags +faststart \
              "output_clips/clip_${IDX}.mp4" < /dev/null
          done

      # 8. Upload Semua Klip & Metadata ke Cloudflare R2
      - name: Upload Clips to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          JOB_ID="${{ env.JOB_ID }}"

          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL"

          aws s3 cp "output_clips/clip_1.mp4" \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL"

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          cat <<EOF > status.json
          {
            "job_id": "${JOB_ID}",
            "status": "ready",
            "file_name": "${JOB_ID}.mp4",
            "download_url": "${R2_PUBLIC_DOMAIN}/outputs/${JOB_ID}.mp4"
          }
          EOF

          aws s3 cp status.json \
            "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          echo "Seluruh klip & metadata berhasil diunggah ke Cloudflare R2!"
