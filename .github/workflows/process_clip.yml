name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        type: string
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        type: string
        default: 'test_job'
      target_duration:
        description: 'Target clip duration in seconds (e.g. 30-60 or 45)'
        required: false
        type: string
        default: '30-60'

permissions:
  contents: read

concurrency:
  group: clipzy-${{ github.event.client_payload.job_id || github.event.inputs.job_id || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-clipzy-deno-v1

      - name: Setup FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq bc curl python3 awscli

          sudo curl -fL \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod 755 /usr/local/bin/yt-dlp

          yt-dlp --version
          ffmpeg -version | head -n 1
          aws --version

      - name: Validate input and prepare job variables
        shell: bash
        env:
          RAW_URL: ${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}
          RAW_JOB: ${{ github.event.client_payload.job_id || github.event.inputs.job_id }}
          RAW_DURATION: ${{ github.event.client_payload.target_duration || github.event.inputs.target_duration || '30-60' }}
        run: |
          set -Eeuo pipefail

          YOUTUBE_URL="${RAW_URL:-}"
          JOB_ID="${RAW_JOB:-test_job}"
          TARGET_DURATION="${RAW_DURATION:-30-60}"

          if [[ -z "$YOUTUBE_URL" ]]; then
            echo "ERROR: youtube_url is empty."
            exit 1
          fi

          # Prevent path traversal and invalid R2 object names.
          if [[ ! "$JOB_ID" =~ ^[a-zA-Z0-9._-]{1,100}$ ]]; then
            echo "ERROR: job_id may contain only letters, numbers, dot, underscore, and hyphen (max 100 chars)."
            exit 1
          fi

          # Accept a single duration (45) or a range (30-60).
          if [[ ! "$TARGET_DURATION" =~ ^[0-9]+(-[0-9]+)?$ ]]; then
            echo "ERROR: target_duration must be a number or range, for example 45 or 30-60."
            exit 1
          fi

          echo "YOUTUBE_URL=$YOUTUBE_URL" >> "$GITHUB_ENV"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"

      - name: Download video and subtitles
        shell: bash
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -Eeuo pipefail

          YT_DLP_ARGS=(
            --no-playlist
            --js-runtimes deno
            --extractor-args "youtube:player_client=web,tv_embedded"
            -f "bv*[ext=mp4]+ba[ext=m4a]/bestvideo+bestaudio/b[ext=mp4]/best"
            --merge-output-format mp4
            --write-auto-subs
            --write-subs
            --sub-langs "id,en"
            --sub-format "srt/best"
            --convert-subs srt
            --no-warnings
            -o "raw_video.%(ext)s"
          )

          if [[ -n "${YT_COOKIES:-}" ]]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            chmod 600 cookies.txt
            YT_DLP_ARGS+=(--cookies cookies.txt)
          fi

          yt-dlp "${YT_DLP_ARGS[@]}" "$YOUTUBE_URL"
          rm -f cookies.txt

          if [[ ! -s raw_video.mp4 ]]; then
            echo "ERROR: yt-dlp did not produce raw_video.mp4."
            find . -maxdepth 1 -type f -printf '%f\n'
            exit 1
          fi

          VIDEO_DURATION="$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)"

          if [[ -z "$VIDEO_DURATION" ]]; then
            echo "ERROR: unable to read video duration."
            exit 1
          fi

          echo "VIDEO_DURATION=$VIDEO_DURATION" >> "$GITHUB_ENV"
          echo "Video duration: $VIDEO_DURATION seconds"

          ffmpeg -nostdin -y -i raw_video.mp4 -vn -ac 1 -ar 16000 \
            -c:a aac -b:a 32k audio_speech.m4a

      - name: Extract transcript text
        shell: bash
        run: |
          set -Eeuo pipefail

          SUB_FILE="$(find . -maxdepth 1 -type f -name '*.srt' -print -quit)"

          if [[ -n "$SUB_FILE" ]]; then
            python3 - "$SUB_FILE" <<'PY' > transcript.txt
          import re
          import sys
          from pathlib import Path

          content = Path(sys.argv[1]).read_text(encoding="utf-8-sig", errors="replace")
          lines = []
          for line in content.splitlines():
              line = line.strip()
              if not line or line.isdigit():
                  continue
              if re.match(r"\d{2}:\d{2}:\d{2}[,.]\d{3}\s+-->", line):
                  continue
              line = re.sub(r"<[^>]+>", "", line)
              lines.append(line)

          text = re.sub(r"\s+", " ", " ".join(lines)).strip()
          print(text[:12000])
          PY
          else
            echo "No subtitle was available for this video. Select clips using the video timeline and distribute candidate moments across the full duration." > transcript.txt
          fi

          # Use a delimiter so transcript punctuation and special characters are safe in GITHUB_ENV.
          DELIMITER="CLIPZY_TRANSCRIPT_$(date +%s)_${RANDOM}"
          {
            echo "TRANSCRIPT_SUMMARY<<$DELIMITER"
            cat transcript.txt
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"

      - name: AI multi-clip viral curation
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "ERROR: OPENROUTER_API_KEY secret is not configured."
            exit 1
          fi

          PROMPT_TEXT="You are an expert short-form video editor and viral-content strategist.

          VIDEO DURATION: ${VIDEO_DURATION} seconds.
          REQUESTED CLIP DURATION: ${TARGET_DURATION} seconds per clip.

          TRANSCRIPT:
          ${TRANSCRIPT_SUMMARY}

          TASK:
          Find at least 6 distinct, genuinely interesting moments suitable for YouTube Shorts, TikTok, and Reels. Choose moments based on hooks, surprising statements, useful information, humor, emotional peaks, conflict, or strong conclusions. Do not invent spoken quotes or events.

          RULES:
          - Return at least 6 clips when the source duration allows it. If the source is too short to provide 6 distinct clips, return only valid non-duplicate segments.
          - Every start_sec and end_sec must be within 0 and ${VIDEO_DURATION}; start_sec must be smaller than end_sec.
          - Clip duration must be within the requested duration ${TARGET_DURATION}. If this is a range, choose a duration inside that range. If the source is shorter, use the longest valid duration available.
          - Clips should focus on complete thoughts and avoid cutting off sentences.
          - Avoid near-duplicate or heavily overlapping segments unless there is a strong editorial reason.
          - zoom_cuts must contain 1 to 3 moments relative to the beginning of the clip. Each moment must satisfy 0 <= start_rel_sec < end_rel_sec <= clip duration.
          - title: catchy, accurate, maximum 60 characters, in the language spoken in the video.
          - description: concise social-media caption.
          - hook: a real short quote from the transcript when possible; do not fabricate a quote.
          - tags: array of 5 relevant hashtags.
          - viral_score: integer from 1 to 100; score honestly, do not assign all clips an inflated score.

          OUTPUT: Return only a JSON array. No Markdown fences and no explanatory text.
          Each object must have this schema:
          {
            \"clip_index\": 1,
            \"start_sec\": 5.0,
            \"end_sec\": 45.0,
            \"viral_score\": 90,
            \"hook\": \"A real hook from the video\",
            \"title\": \"Accurate short title\",
            \"description\": \"Short caption\",
            \"tags\": [\"#shorts\", \"#viral\", \"#fyp\", \"#trending\", \"#clipzy\"],
            \"zoom_cuts\": [
              {\"start_rel_sec\": 0.0, \"end_rel_sec\": 3.0}
            ]
          }"

          PAYLOAD="$(jq -n \
            --arg prompt "$PROMPT_TEXT" \
            '{
              model: "openai/gpt-4o-mini",
              messages: [
                {role: "system", content: "Return only valid JSON. Do not use Markdown fences."},
                {role: "user", content: $prompt}
              ],
              temperature: 0.3,
              response_format: {type: "json_object"}
            }')"

          # Use JSON mode but ask for an object containing clips, so the response is reliably parseable.
          PAYLOAD="$(jq '.messages[1].content += "\\nReturn a JSON object with one property named clips, whose value is the array of clip objects." | .response_format = {type: "json_object"}' <<< "$PAYLOAD")"

          HTTP_CODE="$(curl -sS --retry 2 --retry-delay 2 \
            -o openrouter_response.json \
            -w '%{http_code}' \
            https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -H 'HTTP-Referer: https://clipzy.app' \
            -H 'X-Title: Clipzy Engine' \
            --data-binary "$PAYLOAD")"

          echo "OpenRouter HTTP status: $HTTP_CODE"

          RAW_CONTENT="$(jq -r '.choices[0].message.content // empty' openrouter_response.json 2>/dev/null || true)"
          if [[ "$HTTP_CODE" == "200" && -n "$RAW_CONTENT" ]]; then
            printf '%s' "$RAW_CONTENT" | python3 -c '
          import json, sys
          raw = sys.stdin.read().strip()
          if raw.startswith("```"):
              raw = raw.split("\n", 1)[-1]
              if raw.endswith("```"):
                  raw = raw[:-3]
          data = json.loads(raw)
          clips = data.get("clips") if isinstance(data, dict) else data
          if not isinstance(clips, list):
              raise SystemExit("AI response does not contain a clips array")
          print(json.dumps(clips))
          ' > clips_manifest.json || true
          fi

          # Validate and sanitize AI output. If unusable, create evenly distributed fallback clips.
          if [[ ! -s clips_manifest.json ]] || ! python3 - "$VIDEO_DURATION" "$TARGET_DURATION" clips_manifest.json <<'PY'
          import json
          import re
          import sys

          duration = float(sys.argv[1])
          target = sys.argv[2]
          path = sys.argv[3]
          data = json.load(open(path, encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit(1)

          match = re.fullmatch(r"(\d+)(?:-(\d+))?", target)
          low = int(match.group(1)) if match else 30
          high = int(match.group(2) or low) if match else low
          valid = []
          for item in data:
              try:
                  start = float(item["start_sec"])
                  end = float(item["end_sec"])
              except (KeyError, TypeError, ValueError):
                  continue
              length = end - start
              if start < 0 or end > duration or length <= 3:
                  continue
              if duration >= low and not (max(3, low - 5) <= length <= min(duration, high + 5)):
                  continue
              item["start_sec"] = round(start, 2)
              item["end_sec"] = round(end, 2)
              item["clip_index"] = len(valid) + 1
              zooms = item.get("zoom_cuts", [])
              safe_zooms = []
              if isinstance(zooms, list):
                  for zoom in zooms[:3]:
                      try:
                          zs = max(0.0, float(zoom["start_rel_sec"]))
                          ze = min(length, float(zoom["end_rel_sec"]))
                          if ze > zs:
                              safe_zooms.append({"start_rel_sec": round(zs, 2), "end_rel_sec": round(ze, 2)})
                      except (KeyError, TypeError, ValueError):
                          pass
              item["zoom_cuts"] = safe_zooms or [{"start_rel_sec": 0.0, "end_rel_sec": min(3.0, length)}]
              item["viral_score"] = max(1, min(100, int(item.get("viral_score", 70))))
              item["title"] = str(item.get("title", f"Highlight {len(valid)+1}"))[:60]
              item["description"] = str(item.get("description", ""))
              item["hook"] = str(item.get("hook", ""))
              tags = item.get("tags", [])
              item["tags"] = tags[:5] if isinstance(tags, list) else []
              valid.append(item)

          if not valid:
              raise SystemExit(1)
          json.dump(valid, open(path, "w", encoding="utf-8"), ensure_ascii=False)
          PY
          then
            echo "AI response invalid or unusable. Generating fallback clips."
            export PY_VIDEO_DURATION="$VIDEO_DURATION"
            export PY_TARGET_DURATION="$TARGET_DURATION"
            python3 <<'PY' > clips_manifest.json
          import json
          import os
          import re

          duration = float(os.environ["PY_VIDEO_DURATION"])
          target = os.environ["PY_TARGET_DURATION"]
          match = re.fullmatch(r"(\d+)(?:-(\d+))?", target)
          low = int(match.group(1)) if match else 30
          high = int(match.group(2) or low) if match else low
          desired = (low + high) / 2
          clip_duration = min(duration, desired)

          if duration <= 0:
              raise SystemExit("Invalid source video duration")

          count = min(6, max(1, int(duration // max(clip_duration * 0.55, 1))))
          if duration >= clip_duration * 6:
              count = 6
          max_start = max(0.0, duration - clip_duration)
          starts = [max_start * i / max(count - 1, 1) for i in range(count)]

          clips = []
          for i, start in enumerate(starts, 1):
              end = min(duration, start + clip_duration)
              length = end - start
              clips.append({
                  "clip_index": i,
                  "start_sec": round(start, 2),
                  "end_sec": round(end, 2),
                  "viral_score": max(50, 85 - i * 3),
                  "hook": "",
                  "title": f"Video Highlight #{i}",
                  "description": "Selected highlight from the source video.",
                  "tags": ["#shorts", "#viral", "#trending", "#fyp", "#clipzy"],
                  "zoom_cuts": [{"start_rel_sec": 0.0, "end_rel_sec": round(min(3.0, length), 2)}]
              })

          print(json.dumps(clips, ensure_ascii=False))
          PY
          fi

          jq -e 'type == "array" and length > 0' clips_manifest.json >/dev/null
          echo "Generated $(jq 'length' clips_manifest.json) clip entries."
          cat clips_manifest.json

      - name: Render clips with dynamic punch-in zoom
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p output_clips

          TOTAL="$(jq 'length' clips_manifest.json)"
          for INDEX in $(seq 0 $((TOTAL - 1))); do
            CLIP="$(jq -c ".[$INDEX]" clips_manifest.json)"
            CLIP_NUMBER=$((INDEX + 1))
            START="$(jq -r '.start_sec' <<< "$CLIP")"
            END="$(jq -r '.end_sec' <<< "$CLIP")"
            DURATION="$(awk -v s="$START" -v e="$END" 'BEGIN { printf "%.3f", e-s }')"

            if awk -v d="$DURATION" 'BEGIN { exit !(d <= 3) }'; then
              echo "Skipping clip $CLIP_NUMBER: invalid duration $DURATION seconds."
              continue
            fi

            # Build a time expression from AI-selected zoom moments.
            ZOOM_COND="$(jq -r '
              [.zoom_cuts[]? | "between(t,\\("\(.start_rel_sec)"),\\("\(.end_rel_sec)"))"] | join("+")
            ' <<< "$CLIP")"

            if [[ -z "$ZOOM_COND" || "$ZOOM_COND" == "null" ]]; then
              ZOOM_COND="between(t,0,3)"
            fi

            # Crop to 9:16. The crop becomes 20% tighter during selected zoom moments.
            FILTER="crop=w='if(${ZOOM_COND},min(iw,ih*9/16)*0.8,min(iw,ih*9/16))':h='if(${ZOOM_COND},min(ih,iw*16/9)*0.8,min(ih,iw*16/9))':x='(iw-ow)/2':y='(ih-oh)/2':eval=frame,scale=1080:1920:flags=lanczos,setsar=1,format=yuv420p"

            echo "Rendering clip #${CLIP_NUMBER}: ${START}s - ${END}s (${DURATION}s)"

            ffmpeg -hide_banner -loglevel warning -nostdin -y \
              -ss "$START" -i raw_video.mp4 -t "$DURATION" \
              -map 0:v:0 -map '0:a:0?' \
              -vf "$FILTER" \
              -c:v libx264 -preset veryfast -crf 21 \
              -r 30 -g 60 -keyint_min 60 \
              -c:a aac -b:a 128k -ac 2 \
              -movflags +faststart \
              "output_clips/clip_${CLIP_NUMBER}.mp4"
          done

          if ! compgen -G 'output_clips/clip_*.mp4' > /dev/null; then
            echo "ERROR: no clips were rendered."
            exit 1
          fi

          echo "Rendered clips:"
          ls -lh output_clips/*.mp4

      - name: Upload clips and metadata to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          set -Eeuo pipefail

          for REQUIRED in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET_NAME R2_PUBLIC_DOMAIN; do
            if [[ -z "${!REQUIRED:-}" ]]; then
              echo "ERROR: required R2 setting $REQUIRED is missing."
              exit 1
            fi
          done

          R2_PUBLIC_DOMAIN="${R2_PUBLIC_DOMAIN%/}"

          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type video/mp4

          FIRST_CLIP="$(find output_clips -maxdepth 1 -type f -name 'clip_*.mp4' | sort -V | head -n 1)"
          if [[ -z "$FIRST_CLIP" ]]; then
            echo "ERROR: no rendered clip found for primary download."
            exit 1
          fi

          aws s3 cp "$FIRST_CLIP" \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type video/mp4

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          python3 - <<'PY' > status.json
          import json
          import os

          job_id = os.environ["JOB_ID"]
          domain = os.environ["R2_PUBLIC_DOMAIN"].rstrip("/")
          print(json.dumps({
              "job_id": job_id,
              "status": "ready",
              "file_name": f"{job_id}.mp4",
              "download_url": f"{domain}/outputs/{job_id}.mp4",
              "manifest_url": f"{domain}/outputs/{job_id}/manifest.json",
              "clip_count": len(json.load(open("clips_manifest.json", encoding="utf-8")))
          }, ensure_ascii=False))
          PY

          aws s3 cp status.json \
            "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          echo "Upload complete for job: ${JOB_ID}"
