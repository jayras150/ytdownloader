name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        default: 'test_job'

jobs:
  auto-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup FFmpeg & FFprobe
      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Deno untuk JS runtime ekstraktor YouTube
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 3. Pasang yt-dlp binary standalone terbaru
      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      # 4. Siapkan Cookies, Download Video, & Ekstrak Info
      - name: Download Video & Extract Audio
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          YOUTUBE_URL="${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}"
          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          yt-dlp \
            $COOKIE_ARG \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=ios,mweb" \
            -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --merge-output-format mp4 \
            "$YOUTUBE_URL" -o "raw_video.mp4"

          rm -f cookies.txt

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          echo "Durasi video: $DURATION detik"
          echo "VIDEO_DURATION=$DURATION" >> $GITHUB_ENV

          ffmpeg -y -i raw_video.mp4 -vn -c:a aac -b:a 64k audio.aac

# 5. Deteksi Momen Viral via OpenRouter (Curl + JQ)
      - name: Detect Viral Moments via OpenRouter (Curl + JQ)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT_TEXT="Durasi video: ${VIDEO_DURATION} detik. Tentukan momen-momen punchline / reaksi / hook pembuka untuk efek Punch-In Jump Cut Zoom. Berikan HANYA array JSON murni tanpa markdown, format: [{\"startSec\": 0.0, \"endSec\": 3.0, \"scale\": 1.35, \"target\": \"CENTER\"}]. Pilihan target: LEFT, CENTER, RIGHT. Skala 1.25 s/d 1.45."

          PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{
            model: "openai/gpt-4o-mini",
            messages: [
              {
                role: "system",
                content: "You are a professional video editor. Output strictly a raw JSON array of zoom segments without markdown fences."
              },
              {
                role: "user",
                content: $prompt
              }
            ],
            temperature: 0.2
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://clipzy.app" \
            -H "X-Title: Clipzy Engine" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)

          echo "Status API OpenRouter: $HTTP_STATUS"

          RAW_CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g' | tr -d '\r\n')

          if ! echo "$CLEAN_JSON" | jq empty > /dev/null 2>&1 || [ -z "$CLEAN_JSON" ]; then
            echo "Format AI tidak valid atau kosong, menggunakan fallback 0-3s..."
            CLEAN_JSON='[{"startSec":0.0,"endSec":3.0,"scale":1.35,"target":"CENTER"}]'
          fi

          echo "AI Segments: $CLEAN_JSON"

          # Ekstraksi ekspresi w, h, dan x secara terpisah dan bersih tanpa kebocoran objek JSON
          W_EXPR=$(echo "$CLEAN_JSON" | jq -r 'reduce .[] as $item ("in_w"; "if(between(t,\($item.startSec),\($item.endSec)),in_w/\($item.scale),\(.))")')
          H_EXPR=$(echo "$CLEAN_JSON" | jq -r 'reduce .[] as $item ("in_h"; "if(between(t,\($item.startSec),\($item.endSec)),in_h/\($item.scale),\(.))")')
          X_EXPR=$(echo "$CLEAN_JSON" | jq -r '
            reduce .[] as $item (
              "(in_w-out_w)/2";
              (if $item.target == "LEFT" then "(in_w-out_w)*0.2"
               elif $item.target == "RIGHT" then "(in_w-out_w)*0.8"
               else "(in_w-out_w)/2" end) as $tx |
              "if(between(t,\($item.startSec),\($item.endSec)),\($tx),\(.))"
            )
          ')

          FILTER_STRING="crop='w=${W_EXPR}:h=${H_EXPR}:x=${X_EXPR}:y=(in_h-out_h)*0.25',scale=1080:1920:flags=bilinear"

          echo "FFMPEG_FILTER=$FILTER_STRING" >> $GITHUB_ENV
          echo "Generated FFmpeg Filter:"
          echo "$FILTER_STRING"

      # 6. Render Video Punch-In Zoom
      - name: Render Punch-In Zoom Video (FFmpeg)
        run: |
          ffmpeg -y -i raw_video.mp4 \
            -vf "$FFMPEG_FILTER" \
            -c:v libx264 -preset veryfast -crf 22 \
            -c:a copy \
            -movflags +faststart \
            final_output.mp4

# 7. Upload Hasil Render ke Cloudflare R2
      - name: Upload to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          echo "Uploading ke Cloudflare R2 via endpoint: $R2_ENDPOINT_URL"
          
          aws s3 cp final_output.mp4 \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL"

      - name: Pipeline Completed
        run: echo "Proses selesai! File tersimpan di Cloudflare R2."

      - name: Pipeline Completed
        run: echo "Proses selesai! File tersimpan di Cloudflare R2."
