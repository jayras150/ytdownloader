name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        default: 'test_job'

jobs:
  auto-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Latest yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update && sudo apt-get install -y jq bc

      - name: Download Video & Extract Lightweight Audio
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          YOUTUBE_URL="${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}"
          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV

          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          echo "Downloading video from $YOUTUBE_URL..."
          yt-dlp \
            $COOKIE_ARG \
            --no-check-certificates \
            --extractor-args "youtube:player_client=android,web_embedded" \
            -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            "$YOUTUBE_URL" -o "raw_video.mp4"

          rm -f cookies.txt

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          echo "VIDEO_DURATION=$DURATION" >> $GITHUB_ENV

          # Ekstraksi Audio Ringan Mono 32k untuk Transkripsi Whisper AI
          ffmpeg -y -i raw_video.mp4 -vn -ac 1 -ar 16000 -c:a aac -b:a 32k audio_speech.m4a

      # Transkripsi Audio dengan OpenRouter / OpenAI Whisper API
      - name: Speech-To-Text Transcription (Whisper AI)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Transcribing audio speech with Whisper API..."
          
          TX_RESP=$(curl -s -X POST https://api.openai.com/v1/audio/transcriptions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: multipart/form-data" \
            -F file="@audio_speech.m4a" \
            -F model="whisper-1" \
            -F response_format="verbose_json" || true)

          TRANSCRIPT=$(echo "$TX_RESP" | jq -r '.text // empty')

          if [ -z "$TRANSCRIPT" ]; then
            TRANSCRIPT="Percakapan video berdurasi ${VIDEO_DURATION} detik tentang pembahasan menarik dan lelucon viral."
          fi

          echo "TRANSCRIPT_SUMMARY=$TRANSCRIPT" >> $GITHUB_ENV

      # Kurasi AI Multi-Clips berdasarkan Transkrip Ucapan Asli Video
      - name: AI Multi-Clip Viral Curation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT_TEXT="Berikut adalah transkrip ucapan asli dari video (Durasi total: ${VIDEO_DURATION} detik):
          \"${TRANSCRIPT_SUMMARY}\"

          Sebagai AI video editor profesional ala OpusClip, temukan 3 SEGMEN VIRAL TERBAIK (panjang masing-masing 30 hingga 60 detik).
          Untuk setiap klip, buatkan:
          1. 'title': Judul clickbait sangat menarik sesuai isi ucapan video (max 60 karakter).
          2. 'description': Deskripsi video persuasif yang mengundang interaksi & komentar.
          3. 'tags': 5 hashtag viral paling relevan dengan topik bahasan video.

          Keluarkan HANYA array JSON murni tanpa markdown:
          [
            {
              \"clip_index\": 1,
              \"start_sec\": 10.0,
              \"end_sec\": 45.0,
              \"viral_score\": 95,
              \"hook\": \"Hook pembuka menarik\",
              \"title\": \"Judul Clickbait Akurat 1\",
              \"description\": \"Deskripsi video yang mengundang interaksi penonton.\",
              \"tags\": [\"#shorts\", \"#viral\", \"#fyp\", \"#trending\"]
            }
          ]"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{
            model: "openai/gpt-4o-mini",
            messages: [
              {
                role: "system",
                content: "You are an expert video editor. Output strictly a JSON array of clip segments without markdown fences."
              },
              {
                role: "user",
                content: $prompt
              }
            ],
            temperature: 0.3
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://clipzy.app" \
            -H "X-Title: Clipzy Engine" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          RAW_CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g' | tr -d '\r\n')

          if ! echo "$CLEAN_JSON" | jq empty > /dev/null 2>&1 || [ -z "$CLEAN_JSON" ]; then
            CLEAN_JSON='[
              {"clip_index":1,"start_sec":0.0,"end_sec":35.0,"viral_score":92,"hook":"Opening Hook","title":"Highlight Utama Video","description":"Tonton momen terbaik video ini sampai habis!","tags":["#viral","#shorts","#fyp"]},
              {"clip_index":2,"start_sec":40.0,"end_sec":75.0,"viral_score":88,"hook":"Momen Puncak","title":"Momen Paling Seru","description":"Bagian paling menarik yang bikin kaget!","tags":["#trending","#clipzy"]},
              {"clip_index":3,"start_sec":80.0,"end_sec":115.0,"viral_score":85,"hook":"Penutup","title":"Penutup Viral","description":"Gimana menurut kalian? Tulis di kolom komentar!","tags":["#highlight","#popular"]}
            ]'
          fi

          echo "$CLEAN_JSON" > clips_manifest.json
          cat clips_manifest.json

      # Render Setiap Klip (Frame-Accurate Seek untuk Mencegah Black Screen)
      - name: Render All Clips (Android Compatible & Frame-Accurate)
        run: |
          mkdir -p output_clips

          jq -c '.[]' clips_manifest.json | while read -r clip; do
            IDX=$(echo "$clip" | jq -r '.clip_index')
            START=$(echo "$clip" | jq -r '.start_sec')
            END=$(echo "$clip" | jq -r '.end_sec')
            DUR=$(echo "$END - $START" | bc)

            echo "Rendering Clip #$IDX: Mulai $START detik, Durasi $DUR detik..."

            # Frame-Accurate Seeking (-ss diletakkan setelah -i dan -avoid_negative_ts make_zero)
            ffmpeg -y -i raw_video.mp4 -ss "$START" -t "$DUR" \
              -vf "crop='w=min(in_w,in_h*9/16):h=min(in_h,in_w*16/9):x=(in_w-out_w)/2:y=(in_h-out_h)/2',scale=1080:1920:flags=bilinear" \
              -c:v libx264 -preset ultrafast -crf 22 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -avoid_negative_ts make_zero \
              -movflags +faststart \
              "output_clips/clip_${IDX}.mp4"
          done

      # Upload Klip & Kompatibilitas Path
      - name: Upload Clips to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          JOB_ID="${{ env.JOB_ID }}"

          # 1. Upload SEMUA klip ke subfolder outputs/${JOB_ID}/
          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL"

          # 2. Upload klip utama langsung ke root outputs/
          aws s3 cp "output_clips/clip_1.mp4" \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL"

          # 3. Upload manifest JSON ke outputs/${JOB_ID}_meta.json & outputs/${JOB_ID}/manifest.json
          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          echo "Seluruh klip & metadata berhasil diunggah ke Cloudflare R2!"
