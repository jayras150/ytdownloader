name: Clipzy Full Auto Pipeline

on:
  repository_dispatch:
    types: [process_clip]
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'URL YouTube'
        required: true
        default: 'https://www.youtube.com/watch?v=bLreeqoUUTI'
      job_id:
        description: 'Job ID'
        required: false
        default: 'test_job'
      target_duration:
        description: 'Target Clip Duration (seconds)'
        required: false
        default: '30-60'

jobs:
  auto-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 0. Cache Tools & Dependencies
      - name: Cache Tools & Dependencies
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/yt-dlp
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-clipzy-tools-v1
          restore-keys: |
            ${{ runner.os }}-clipzy-tools-

      # 1. Setup FFmpeg & FFprobe
      - name: Setup FFmpeg & FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Setup Deno
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 3. Install Standalone yt-dlp & Dependencies
      - name: Install yt-dlp & Dependencies
        run: |
          if [ ! -f /usr/local/bin/yt-dlp ]; then
            sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
            sudo chmod a+rx /usr/local/bin/yt-dlp
          else
            sudo chmod a+rx /usr/local/bin/yt-dlp
          fi
          which jq >/dev/null 2>&1 && which bc >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq jq bc)

      # 4. Download Video & Extract Audio
      - name: Download Video & Extract Audio
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          YOUTUBE_URL="${{ github.event.client_payload.youtube_url || github.event.inputs.youtube_url }}"
          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id }}"
          TARGET_DUR="${{ github.event.client_payload.target_duration || github.event.inputs.target_duration || '30-60' }}"
          echo "JOB_ID=$JOB_ID" >> $GITHUB_ENV
          echo "TARGET_DURATION=$TARGET_DUR" >> $GITHUB_ENV

          COOKIE_ARG=""
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            COOKIE_ARG="--cookies cookies.txt"
          fi

          yt-dlp \
            $COOKIE_ARG \
            --js-runtimes deno \
            --extractor-args "youtube:player_client=web,tv_embedded" \
            -f "bv*[ext=mp4]+ba[ext=m4a]/bestvideo+bestaudio/b[ext=mp4]/best" \
            --merge-output-format mp4 \
            --write-auto-sub --sub-lang "id,en" --convert-subs "srt" \
            "$YOUTUBE_URL" -o "raw_video.mp4"

          rm -f cookies.txt

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 raw_video.mp4)
          echo "VIDEO_DURATION=$DURATION" >> $GITHUB_ENV

          ffmpeg -y -i raw_video.mp4 -vn -ac 1 -ar 16000 -c:a aac -b:a 32k audio_speech.m4a

      # 5. Extract Transcript Text
      - name: Extract Transcript Text
        run: |
          SUB_FILE=$(ls *.srt 2>/dev/null | head -n 1)
          if [ -n "$SUB_FILE" ] && [ -f "$SUB_FILE" ]; then
            CLEAN_TEXT=$(grep -vE '^[0-9]+$' "$SUB_FILE" | grep -vE '^[0-9]{2}:[0-9]{2}' | tr '\n' ' ' | sed 's/  */ /g' | cut -c 1-3500)
            echo "TRANSCRIPT_SUMMARY=$CLEAN_TEXT" >> $GITHUB_ENV
          else
            echo "TRANSCRIPT_SUMMARY=Engaging conversational video discussing highlights and viral topics with total duration $VIDEO_DURATION seconds." >> $GITHUB_ENV
          fi

      # 6. AI Multi-Clip Viral Curation (Minimal 6 Clips + Dynamic Punch-in Zoom Analysis)
      - name: AI Multi-Clip Viral Curation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          PROMPT_TEXT="Video Total Duration: ${VIDEO_DURATION} seconds.
          User Preferred Duration: ${TARGET_DURATION} seconds per clip.

          Transcript Content:
          \"\"\"
          ${TRANSCRIPT_SUMMARY}
          \"\"\"

          You are an elite short-form video editor and viral strategist (OpusClip/Submagic style).
          Your task: Identify and extract AT LEAST 6 DISTINCT, HIGH-VIRALITY clip segments (numbered 1 to 6 or more).

          CRITICAL RULES:
          1. CLIP COUNT: Return at least 6 clip objects. If the video is short, distribute timestamps across the full duration.
          2. DURATION ENFORCEMENT: Each clip length (end_sec - start_sec) must strictly follow user preference: ${TARGET_DURATION} seconds (±5s tolerance). Range: 0.0 <= start_sec < end_sec <= ${VIDEO_DURATION}.
          3. PUNCH-IN ZOOM MOMENTS ('zoom_cuts'):
             For each clip, analyze the transcript and select 1 to 3 specific moments for dynamic camera punch-in zoom (e.g. initial hook 0.0-3.0s, surprising revelation, funny punchline, dramatic emphasis).
             Use relative seconds from the start of this clip ('start_rel_sec' and 'end_rel_sec').
          4. METADATA: 'title' (catchy high-CTR, matching spoken language, max 60 chars), 'description' (engaging caption), 'hook' (spoken 3s hook line), 'tags' (5 hashtags), 'viral_score' (80-99).

          Return ONLY a valid, raw JSON array matching this exact schema:
          [
            {
              \"clip_index\": 1,
              \"start_sec\": 5.0,
              \"end_sec\": 35.0,
              \"viral_score\": 95,
              \"hook\": \"Hook quote\",
              \"title\": \"Catchy Video Title\",
              \"description\": \"Engaging caption.\",
              \"tags\": [\"#shorts\", \"#viral\", \"#fyp\"],
              \"zoom_cuts\": [
                {\"start_rel_sec\": 0.0, \"end_rel_sec\": 3.5},
                {\"start_rel_sec\": 18.0, \"end_rel_sec\": 21.0}
              ]
            }
          ]"

          PAYLOAD=$(jq -n --arg prompt "$PROMPT_TEXT" '{
            model: "openai/gpt-4o-mini",
            messages: [
              {"role": "system", "content": "You are a professional video editor. Return strictly a raw JSON array of at least 6 clip segments."},
              {"role": "user", "content": $prompt}
            ],
            temperature: 0.3
          }')

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://clipzy.app" \
            -H "X-Title: Clipzy Engine" \
            -d "$PAYLOAD")

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          echo "OpenRouter HTTP Status: $HTTP_STATUS"

          RAW_CONTENT=$(echo "$HTTP_BODY" | jq -r '.choices[0].message.content // empty')
          CLEAN_JSON=$(echo "$RAW_CONTENT" | sed 's/```json//g; s/```//g' | tr -d '\r\n')

          if [ "$HTTP_STATUS" -ne 200 ] || [ -z "$CLEAN_JSON" ] || ! echo "$CLEAN_JSON" | jq empty > /dev/null 2>&1; then
            echo "API Error or invalid format. Generating 6 proportional clips fallback..."
            echo "$HTTP_BODY"

            DUR_VAL=$(echo "$TARGET_DURATION" | grep -oE '[0-9]+' | head -n 1)
            [ -z "$DUR_VAL" ] && DUR_VAL=30

            CLEAN_JSON=$(python3 -c "
import json
dur = float('$VIDEO_DURATION')
cdur = float('$DUR_VAL')
step = max(5.0, (dur - cdur) / 5.0) if dur > cdur else 5.0
clips = []
for i in range(6):
    s = min(dur - cdur, i * step) if dur > cdur else 0.0
    e = min(dur, s + cdur)
    clips.append({
        'clip_index': i + 1,
        'start_sec': round(s, 1),
        'end_sec': round(e, 1),
        'viral_score': 96 - (i * 2),
        'hook': f'Top viral moment #{i+1}!',
        'title': f'Featured Highlight #{i+1}',
        'description': 'Watch this viral moment until the end!',
        'tags': ['#shorts', '#viral', '#trending'],
        'zoom_cuts': [{'start_rel_sec': 0.0, 'end_rel_sec': 3.5}]
    })
print(json.dumps(clips))
")
          fi

          echo "$CLEAN_JSON" > clips_manifest.json
          cat clips_manifest.json

      # 7. Render All Clips with AI-Driven Dynamic Punch-In Zoom
      - name: Render All Clips (Android Compatible & AI Punch-In Zoom)
        run: |
          mkdir -p output_clips

          COUNT=1
          jq -c '.[]' clips_manifest.json | while read -r clip; do
            START=$(echo "$clip" | jq -r '.start_sec // 0')
            END=$(echo "$clip" | jq -r '.end_sec // 30')
            DUR=$(echo "$END - $START" | bc)

            if (( $(echo "$DUR <= 3" | bc -l) )); then
              DUR=30
            fi

            # Format kondisi filter zoom FFmpeg: between(t,s1,e1)+between(t,s2,e2)
            ZOOM_COND=$(echo "$clip" | jq -r '[.zoom_cuts[]? | "between(t," + (.start_rel_sec|tostring) + "," + (.end_rel_sec|tostring) + ")"] | join("+")')

            if [ -z "$ZOOM_COND" ] || [ "$ZOOM_COND" = "null" ]; then
              ZOOM_COND="between(t,0,3.5)"
            fi

            echo "Rendering Clip #$COUNT: $START to $END (Dur: $DUR s) | Dynamic Zoom Filter: $ZOOM_COND"

            # Filter Zoom Dinamis: Hanya zoom in 1.25x (crop 0.8x) saat ZOOM_COND bernilai true
            DYNAMIC_FILTER="crop='w=if($ZOOM_COND, min(in_w,in_h*9/16)*0.8, min(in_w,in_h*9/16)):h=if($ZOOM_COND, min(in_h,in_w*16/9)*0.8, min(in_h,in_w*16/9)):x=(in_w-out_w)/2:y=(in_h-out_h)/2',scale=1080:1920:flags=bilinear"

            ffmpeg -nostdin -y -i raw_video.mp4 \
              -ss "$START" -t "$DUR" \
              -vf "$DYNAMIC_FILTER" \
              -c:v libx264 -preset ultrafast -crf 20 \
              -g 30 -keyint_min 30 \
              -pix_fmt yuv420p \
              -c:a aac -b:a 128k \
              -avoid_negative_ts make_zero \
              -movflags +faststart \
              "output_clips/clip_${COUNT}.mp4" < /dev/null

            COUNT=$((COUNT + 1))
          done

          if [ -z "$(ls -A output_clips/*.mp4 2>/dev/null)" ]; then
            ffmpeg -nostdin -y -i raw_video.mp4 -t 30 \
              -vf "crop='w=min(in_w,in_h*9/16):h=min(in_h,in_w*16/9):x=(in_w-out_w)/2:y=(in_h-out_h)/2',scale=1080:1920:flags=bilinear" \
              -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart \
              "output_clips/clip_1.mp4" < /dev/null
          fi

      # 8. Upload Clips & Metadata to Cloudflare R2
      - name: Upload Clips to Cloudflare R2
        if: success()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          JOB_ID="${{ env.JOB_ID }}"

          # Upload seluruh klip (clip_1.mp4 s/d clip_6+.mp4)
          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL"

          # Upload primary clip untuk kompatibilitas
          FIRST_CLIP=$(ls output_clips/*.mp4 | head -n 1)
          if [ -f "$FIRST_CLIP" ]; then
            aws s3 cp "$FIRST_CLIP" \
              "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
              --endpoint-url "$R2_ENDPOINT_URL"
          fi

          # Upload metadata JSON
          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          # Upload ready status flag
          cat <<EOF > status.json
          {
            "job_id": "${JOB_ID}",
            "status": "ready",
            "file_name": "${JOB_ID}.mp4",
            "download_url": "${R2_PUBLIC_DOMAIN}/outputs/${JOB_ID}.mp4"
          }
          EOF

          aws s3 cp status.json \
            "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" \
            --endpoint-url "$R2_ENDPOINT_URL"

          echo "Seluruh klip (min 6 clips) & AI Dynamic Zoom berhasil diunggah ke Cloudflare R2!"