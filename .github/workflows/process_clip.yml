          def hex_to_ass(hex_color, alpha="00"):
              value = hex_color.lstrip("#")
              if len(value) == 3:
                  value = "".join(ch * 2 for ch in value)
              r, g, b = value[0:2], value[2:4], value[4:6]
              return f"&H{alpha}{b}{g}{r}".upper()


          def fmt_ass_time(seconds):
              seconds = max(0.0, float(seconds))
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              return f"{hours:d}:{minutes:02d}:{seconds % 60:05.2f}"


          if style == "NONE":
              subtitles = {"style": "NONE", "language": language, "word_timings_used": False, "clips": []}
              with open("work/subtitles.json", "w", encoding="utf-8") as fh:
                  json.dump(subtitles, fh, indent=2)
              print("subtitle_style is NONE: no subtitles will be generated or burned in.")
              sys.exit(0)

          preset = SUBTITLE_PRESETS[style]
          scale = out_h / 1080.0
          fontsize = max(20, min(160, round(preset["size_ratio"] * out_h)))
          max_chars = max(10, int((out_w * 0.9) / (fontsize * preset["char_width"])))
          outline_px = max(1, round(preset["outline"] * scale)) if preset["outline"] else 0
          shadow_px = round(preset["shadow_radius"] * 0.45 * scale) if preset["shadow_radius"] else 0
          blur_px = round(preset["shadow_radius"] * scale) if preset["shadow_radius"] else 0
          spacing_px = round(preset["letter_spacing"] * scale)
          bold = 1 if preset["weight"] >= 600 else 0
          italic = 1 if preset["italic"] else 0
          highlight_mode = preset["highlight_mode"]
          caps = preset["caps"]

          if highlight_mode == "none":
              primary = hex_to_ass(preset["text_color"])
              secondary = hex_to_ass(preset["text_color"])
          else:
              primary = hex_to_ass(preset["highlight_color"])
              secondary = hex_to_ass(preset["text_color"])
          outline_colour = hex_to_ass(preset["outline_color"])
          border_style = 3 if highlight_mode == "box" else 1
          if preset["shadow_radius"] > 0:
              back_colour = hex_to_ass(preset["shadow_color"], alpha="70")
          else:
              back_colour = hex_to_ass("#000000", alpha="FF")

          use_karaoke = highlight_mode != "none" and transcript.get("word_timings_available")
          word_source = "whisper" if transcript.get("word_timings_available") else "whisper_segments"


          def build_word_cues(words):
              cues = []
              current = []
              for word in words:
                  text = word["word"].strip()
                  if not text:
                      continue
                  if current:
                      gap = word["start"] - current[-1]["end"]
                      duration = word["end"] - current[0]["start"]
                      joined = len(" ".join(w["word"] for w in current)) + len(text) + 1
                      ends_sentence = current[-1]["word"].rstrip().endswith((".", "!", "?"))
                      if (gap > 0.6 or len(current) >= 8 or duration > 3.2
                              or joined > 2 * max_chars or (ends_sentence and gap > 0.25)):
                          cues.append(current)
                          current = []
                  current.append(word)
              if current:
                  cues.append(current)
              return cues


          def split_index_for(words):
              text = " ".join(w["word"] for w in words)
              if len(text) <= max_chars or len(words) == 1:
                  return None
              best = None
              for i in range(1, len(words)):
                  first = " ".join(w["word"] for w in words[:i])
                  second = " ".join(w["word"] for w in words[i:])
                  if len(first) <= max_chars and len(second) <= max_chars:
                      imbalance = abs(len(first) - len(second))
                      if best is None or imbalance < best[0]:
                          best = (imbalance, i)
              if best is not None:
                  return best[1]
              return max(1, len(words) // 2)


          def dialogue_text(cue_words, split_at):
              parts = []
              for i, word in enumerate(cue_words):
                  text = word["word"]
                  if caps:
                      text = text.upper()
                  if use_karaoke:
                      if i < len(cue_words) - 1:
                          dur = max(4, int(round((cue_words[i + 1]["start"] - word["start"]) * 100)))
                      else:
                          dur = max(4, int(round(max(0.08, word["end"] - word["start"]) * 100)))
                      tag = f"\\k{dur}"
                      if i == 0 and blur_px > 0:
                          tag = f"\\blur{blur_px}" + tag
                      token = "{" + tag + "}" + text
                  else:
                      if i == 0 and blur_px > 0:
                          token = "{\\blur" + str(blur_px) + "}" + text
                      else:
                          token = text
                  if parts:
                      parts.append(" ")
                  parts.append(token)
                  if split_at is not None and i == split_at - 1 and split_at < len(cue_words):
                      parts.append("{\\N}")
              return "".join(parts)


          subtitle_clips = []
          for clip in clips:
              index = clip["clip_index"]
              start = clip["start_sec"]
              end = clip["end_sec"]
              length = round(end - start, 3)
              band = (hints["clips"].get(str(index)) or {}).get("caption_band", "bottom")
              alignment = 8 if band == "top" else 2
              margin_v = round(out_h * preset["margin_ratio"])
              margin_lr = round(out_w * 0.05)

              words = []
              if transcript.get("word_timings_available"):
                  for word in transcript.get("words", []):
                      if word["start"] < end and word["end"] > start:
                          words.append({
                              "word": word["word"],
                              "start": max(word["start"], start),
                              "end": min(word["end"], end),
                          })
                  words.sort(key=lambda w: w["start"])

              cues = []
              if words:
                  for cue_words in build_word_cues(words):
                      cue_start = max(0.0, cue_words[0]["start"] - start)
                      cue_end = min(length, cue_words[-1]["end"] - start + 0.25)
                      if cue_end - cue_start < 0.6:
                          cue_end = min(length, cue_start + 0.6)
                      cues.append({"start": round(cue_start, 2), "end": round(cue_end, 2),
                                   "words": cue_words})
              else:
                  # Segment-level timing only: no fabricated word synchronization.
                  for segment in transcript.get("segments", []):
                      if segment["end"] <= start or segment["start"] >= end:
                          continue
                      text = segment["text"].strip()
                      if not text:
                          continue
                      seg_start = max(segment["start"], start) - start
                      seg_end = min(segment["end"], end) - start
                      chunks = []
                      current = []
                      for token in text.split():
                          candidate = " ".join(current + [token])
                          if current and len(candidate) > 2 * max_chars:
                              chunks.append(" ".join(current))
                              current = [token]
                          else:
                              current.append(token)
                      if current:
                          chunks.append(" ".join(current))
                      total_chars = sum(len(c) for c in chunks) or 1
                      cursor = seg_start
                      span = max(0.6, seg_end - seg_start)
                      for chunk in chunks:
                          share = span * len(chunk) / total_chars
                          cues.append({"start": round(max(0.0, cursor), 2),
                                       "end": round(min(length, cursor + share), 2), "words": None,
                                       "text": chunk})
                          cursor += share

              # Resolve overlaps: captions never stack.
              cues.sort(key=lambda c: c["start"])
              for i in range(1, len(cues)):
                  if cues[i]["start"] < cues[i - 1]["end"] + 0.05:
                      if cues[i - 1]["end"] - cues[i - 1]["start"] > 0.8:
                          cues[i - 1]["end"] = round(max(cues[i]["start"] - 0.05, cues[i - 1]["start"] + 0.5), 2)
                      else:
                          cues[i]["start"] = round(cues[i - 1]["end"] + 0.05, 2)

              events = []
              plain_cues = []
              for cue in cues:
                  if cue.get("words"):
                      split_at = split_index_for(cue["words"])
                      text = dialogue_text(cue["words"], split_at)
                      plain = " ".join(w["word"] for w in cue["words"])
                  else:
                      chunk = cue.get("text", "")
                      lines = [chunk] if len(chunk) <= max_chars else None
                      if lines is None:
                          tokens = chunk.split()
                          best = None
                          for i in range(1, len(tokens)):
                              first = " ".join(tokens[:i])
                              second = " ".join(tokens[i:])
                              if len(first) <= max_chars and len(second) <= max_chars:
                                  imbalance = abs(len(first) - len(second))
                                  if best is None or imbalance < best[0]:
                                      best = (imbalance, first, second)
                          if best:
                              lines = [best[1], best[2]]
                          else:
                              midpoint = len(chunk) // 2
                              cut = chunk.rfind(" ", 0, midpoint)
                              cut = cut if cut > 0 else midpoint
                              lines = [chunk[:cut].strip(), chunk[cut:].strip()]
                      text = "{\\N}".join(lines)
                      if blur_px > 0:
                          text = "{\\blur" + str(blur_px) + "}" + text
                      plain = chunk
                  events.append(f"Dialogue: 0,{fmt_ass_time(cue['start'])},{fmt_ass_time(cue['end'])},"
                                f"Clipzy,,0,0,0,,{text}")
                  plain_cues.append({"start": cue["start"], "end": cue["end"], "text": plain})

              burned_in = bool(events)
              ass_path = f"work/subs/clip_{index}.ass"
              if burned_in:
                  header = (
                      "[Script Info]\n"
                      f"; Clipzy preset {style} (mirrors Android SubtitleStyles.kt)\n"
                      "ScriptType: v4.00+\n"
                      f"PlayResX: {out_w}\n"
                      f"PlayResY: {out_h}\n"
                      "WrapStyle: 0\n"
                      "ScaledBorderAndShadow: yes\n"
                      "\n"
                      "[V4+ Styles]\n"
                      "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, "
                      "BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, "
                      "BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
                      f"Style: Clipzy,{preset['font']},{fontsize},{primary},{secondary},{outline_colour},"
                      f"{back_colour},{bold},{italic},0,0,100,100,{spacing_px},0,{border_style},"
                      f"{outline_px},{shadow_px},{alignment},{margin_lr},{margin_lr},{margin_v},1\n"
                      "\n"
                      "[Events]\n"
                      "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
                  )
                  with open(ass_path, "w", encoding="utf-8") as fh:
                      fh.write(header + "\n".join(events) + "\n")

              subtitle_clips.append({
                  "clip_index": index,
                  "burned_in": burned_in,
                  "file": ass_path if burned_in else None,
                  "alignment": alignment,
                  "cues": plain_cues,
              })
              if burned_in:
                  print(f"Clip {index}: {len(events)} caption events "
                        f"({'word-synced karaoke' if use_karaoke else 'segment-level timing'}).")
              else:
                  print(f"Clip {index}: no speech in range; nothing burned in (reported honestly).")

          subtitles = {
              "style": style,
              "language": language,
              "word_timings_used": use_karaoke,
              "word_source": word_source,
              "preset": {
                  "font": preset["font"], "fontsize": fontsize, "bold": bool(bold),
                  "italic": bool(italic), "highlight_mode": highlight_mode, "caps": caps,
                  "outline_px": outline_px, "shadow_px": shadow_px, "spacing_px": spacing_px,
              },
              "clips": subtitle_clips,
          }
          with open("work/subtitles.json", "w", encoding="utf-8") as fh:
              json.dump(subtitles, fh, indent=2)

          print(f"ASS subtitles generated for preset {style} on {out_w}x{out_h} canvas "
                f"(fontsize {fontsize}, karaoke={use_karaoke}).")
          PY_ASS

      - name: Refine clip metadata with GPT-6 Luna
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "ERROR: OPENROUTER_API_KEY secret is not configured."
            exit 1
          fi

          mkdir -p work/debug

          "$CLIPZY_PY" <<'PY_META'
          import json
          import os
          import re
          import sys
          from difflib import SequenceMatcher

          sys.path.insert(0, "work")

          import clipzy_gpt as gpt

          API_BASE = (os.environ.get("OPENROUTER_API_BASE") or "https://openrouter.ai/api/v1").rstrip("/")
          API_KEY = os.environ.get("OPENROUTER_API_KEY", "").strip()
          CHAT_MODEL = os.environ.get("OPENROUTER_CHAT_MODEL", "").strip()
          EXPECTED_CHAT_MODEL = "openai/gpt-6-luna"

          if not API_KEY:
              print("ERROR: OPENROUTER_API_KEY secret is not configured.")
              sys.exit(1)
          if CHAT_MODEL != EXPECTED_CHAT_MODEL:
              print(f"ERROR: refusing to refine metadata with '{CHAT_MODEL}'; Clipzy requires '{EXPECTED_CHAT_MODEL}'.")
              sys.exit(1)

          clips = json.load(open("work/clips_final.json", encoding="utf-8"))
          transcript = json.load(open("work/transcript.json", encoding="utf-8"))
          tracks = {t["clip_index"]: t for t in json.load(open("work/face_tracks.json", encoding="utf-8"))}
          try:
              video_analysis = json.load(open("work/video_analysis.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              video_analysis = {}


          def fmt_ts(seconds):
              seconds = max(0.0, float(seconds))
              minutes = int(seconds // 60)
              return f"{minutes:02d}:{seconds - minutes * 60:05.2f}"


          blocks = []
          for clip in clips:
              start, end = clip["start_sec"], clip["end_sec"]
              seg_lines = [f"[{fmt_ts(s['start'])}] {s['text']}" for s in transcript.get("segments", [])
                           if s["end"] > start - 10 and s["start"] < end + 10]
              context = "\n".join(seg_lines)[:3500] or "(no speech in this window)"
              faces_detected = bool((tracks.get(clip["clip_index"]) or {}).get("primary"))
              zoom_note = ", ".join(f"{z['start_rel_sec']}-{z['end_rel_sec']}s @ {z['zoom_level']}x"
                                    for z in clip["editing"]["zoom_cuts"]) or "none"
              blocks.append(
                  f"CLIP {clip['clip_index']} ({start:.1f}-{end:.1f}s) | faces_detected={faces_detected} | zoom: {zoom_note}\n"
                  f"TRANSCRIPT CONTEXT:\n{context}")

          prompt = f"""You are refining the publishable metadata for clips you selected from a video. Use the exact transcript context below; the earlier multimodal analysis summary is also provided.

          VIDEO ANALYSIS SUMMARY: {json.dumps(video_analysis, ensure_ascii=False)[:1500]}

          SELECTED CLIPS:
          {chr(10).join(blocks)}

          RULES (per clip):
          - title: HIGH-CTR & VIRAL, max 60 characters, written in the EXACT SPOKEN LANGUAGE of the video (e.g. Bahasa Indonesia for Indonesian videos). Specific, engaging, curiosity-inducing, never misleading. No generic filler ("Amazing Video", "Video Highlight", "Must Watch").
          - description: what is actually said and shown in this specific clip in the video's spoken language, max 200 characters, do not repeat the title.
          - topic: a short specific topic label in the video's spoken language.
          - hook: a short quote VERBATIM from the transcript context inside the clip, or "" when none fits. Never invent quotes.
          - tags: 4-5 niche-specific hashtags strictly grounded in the clip's topic, category, and keywords (e.g. #investasi #keuangan #saham for finance videos in Indonesian). Do NOT pad with generic #viral #fyp #shorts unless genuinely relevant.
          - visual_analysis: main_subject (role-based description) and scene, grounded in the frame analysis.
          - faces_detected is a measured computer-vision fact: never contradict it.

          OUTPUT: a single JSON object {{"clips": [{{"clip_index": 1, "topic": "", "title": "", "description": "", "tags": ["#topic"], "hook": "", "visual_analysis": {{"main_subject": "", "scene": ""}}}}]}} with one entry per input clip. Return only JSON."""

          messages = [
              {"role": "system",
               "content": "You are Clipzy's metadata editor. You return ONLY valid JSON, never Markdown fences."},
              {"role": "user", "content": prompt},
          ]
          # 32k output budget (model supports 128k) - the old 4k limit truncated
          # refine responses exactly like curation responses.
          payload = {"model": CHAT_MODEL, "messages": messages, "temperature": 0.3,
                     "max_tokens": 32000, "response_format": {"type": "json_object"}}

          refined = None
          last_content = ""
          best_refined = None
          for attempt in (1, 2, 3):
              if attempt == 2:
                  payload["messages"] = [
                      messages[0], messages[1],
                      {"role": "assistant", "content": (last_content or "")[:6000]},
                      {"role": "user", "content": (
                          "Your previous response could not be used. Return the COMPLETE JSON object "
                          "with the same schema and one entry per input clip. Remove verbose repetition "
                          "but keep every mandatory field. Never invent quotes or facts.")},
                  ]
                  payload["temperature"] = 0.2
              elif attempt == 3:
                  payload["messages"] = [
                      {"role": "system", "content": "You return ONLY valid compact JSON, no Markdown fences."},
                      {"role": "user", "content": (
                          "Regenerate the metadata for the clips from the earlier prompt with a COMPACT "
                          "structure: title <= 65 chars, description <= 120 chars, topic <= 60 chars, "
                          "3-5 tags, hook verbatim or \"\", visual_analysis fields <= 60 chars. "
                          "One entry per input clip, clip_index must match. Return only JSON.")},
                  ]
                  payload["temperature"] = 0.3

              info = gpt.chat_with_retries(API_BASE, API_KEY, payload, timeout=240)
              last_content = info["content"] or ""
              data, parse_error = gpt.parse_json_content(last_content)
              parse_result = "ok" if data is not None else f"failed ({parse_error})"
              if data is None and info["finish_reason"] == "length":
                  data, repair_note = gpt.repair_truncated_json(last_content)
                  if data is not None:
                      parse_result += f"; salvaged ({repair_note})"

              refined_items = None
              validation_note = "no clips"
              if isinstance(data, dict) and isinstance(data.get("clips"), list):
                  refined_items = {item["clip_index"]: item for item in data["clips"]
                                   if isinstance(item, dict) and "clip_index" in item}
                  validation_note = f"{len(refined_items)} clip entr{'y' if len(refined_items) == 1 else 'ies'}"

              retry_reason = ""
              if info["ok"] and refined_items:
                  retry_reason = ""
              elif not info["ok"]:
                  retry_reason = f"request failed: {info['error'][:200]}"
              elif info["finish_reason"] == "length":
                  retry_reason = "finish_reason=length (response truncated)"
              elif info["finish_reason"] == "content_filter":
                  retry_reason = "finish_reason=content_filter"
              elif data is None:
                  retry_reason = f"unparseable JSON ({parse_error[:160]})"
              else:
                  retry_reason = "response did not contain a clips array"

              usage = info.get("usage") or {}
              print(f"REFINE ATTEMPT {attempt}/3 | MODEL: {CHAT_MODEL} | HTTP STATUS: {info['http_status']} | "
                    f"FINISH REASON: {info['finish_reason'] or '(absent)'} | "
                    f"PROMPT TOKENS: {usage.get('prompt_tokens') or '-'} | "
                    f"COMPLETION TOKENS: {usage.get('completion_tokens') or '-'} | "
                    f"JSON VALIDATION: {validation_note}"
                    + (f" | RETRY REASON: {retry_reason}" if retry_reason else ""))
              gpt.write_debug_attempt(
                  f"work/debug/refine_attempt_{attempt}.txt", f"refine {attempt}/3", CHAT_MODEL,
                  info, parse_result, validation_note, retry_reason, last_content)

              if info["ok"] and refined_items and info["finish_reason"] in ("stop", None):
                  refined = refined_items
                  break
              if refined_items and (best_refined is None
                                    or len(refined_items) > len(best_refined)):
                  best_refined = refined_items

          if refined is None and best_refined is not None:
              print(f"WARN: all 3 GPT-6 Luna refine attempts ended incomplete; using the "
                    f"{len(best_refined)} complete clip entr{'y' if len(best_refined) == 1 else 'ies'} "
                    f"recovered verbatim from the model's own output.")
              refined = best_refined

          if refined is None:
              print("WARN: GPT-6 Luna metadata refinement failed after 3 attempts; keeping the "
                    "curation-stage metadata (also produced by GPT-6 Luna). No placeholder "
                    "metadata is fabricated. Diagnostics: work/debug/refine_attempt_*.txt.")
          else:
              segments = transcript.get("segments", [])
              for clip in clips:
                  item = refined.get(clip["clip_index"])
                  if not item:
                      continue
                  title = str(item.get("title") or "").strip()
                  if title:
                      clip["title"] = title[:65]
                  description = str(item.get("description") or "").strip()
                  if description:
                      clip["description"] = description[:300]
                  topic = str(item.get("topic") or "").strip()
                  if topic:
                      clip["topic"] = topic[:120]
                  tags = item.get("tags")
                  if isinstance(tags, list) and tags:
                      clean = []
                      for tag in tags[:5]:
                          tag = str(tag).strip().replace(" ", "")
                          if not tag:
                              continue
                          if not tag.startswith("#"):
                              tag = "#" + tag.lstrip("#")
                          if re.fullmatch(r"#[\w\u00c0-\uffff]+", tag, re.IGNORECASE) and tag not in clean:
                              clean.append(tag)
                      if clean:
                          clip["tags"] = clean[:5]
                  hook = str(item.get("hook") or "").strip()
                  if hook:
                      start, end = clip["start_sec"], clip["end_sec"]
                      window = " ".join(s["text"] for s in segments
                                        if s["end"] > start - 10 and s["start"] < end + 10).lower()
                      probe = re.sub(r"\s+", " ", hook.lower()).strip(" .!?,")
                      real = False
                      if probe:
                          for pos in range(0, max(1, len(window) - len(probe) + 1)):
                              if SequenceMatcher(None, probe, window[pos:pos + len(probe)]).ratio() > 0.8:
                                  real = True
                                  break
                      if real:
                          clip["hook"] = hook[:140]
                      else:
                          print(f"WARN: refined hook for clip {clip['clip_index']} is not verbatim; dropped.")
                          clip["hook"] = ""
                  visual = item.get("visual_analysis") if isinstance(item.get("visual_analysis"), dict) else {}
                  if visual.get("main_subject"):
                      clip["visual_analysis"]["main_subject"] = str(visual["main_subject"]).strip()[:160]
                  if visual.get("scene"):
                      clip["visual_analysis"]["scene"] = str(visual["scene"]).strip()[:160]

          # Inject measured CV facts (never AI-guessed).
          for clip in clips:
              clip["visual_analysis"]["faces_detected"] = bool(
                  (tracks.get(clip["clip_index"]) or {}).get("primary"))

          with open("work/clips_final.json", "w", encoding="utf-8") as fh:
              json.dump(clips, fh, ensure_ascii=False, indent=2)

          print("Clip metadata ready (topic, hook, title, description, tags, visual analysis).")
          PY_META

      - name: Build render plan
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_PLAN'
          import json
          import os

          source = json.load(open("work/source.json", encoding="utf-8"))
          hints = json.load(open("work/render_hints.json", encoding="utf-8"))
          geometry = hints["geometry"]
          clips = json.load(open("work/clips_final.json", encoding="utf-8"))
          subtitles = json.load(open("work/subtitles.json", encoding="utf-8"))
          params = json.load(open("work/params.json", encoding="utf-8"))

          FONTS_DIR = os.environ.get("CLIPZY_FONTS_DIR", "/usr/local/share/fonts/clipzy")

          src_w, src_h = geometry["src_w"], geometry["src_h"]
          out_w, out_h = geometry["out_w"], geometry["out_h"]
          mode = geometry["mode"]
          aw, ah = geometry["aspect_window"]["w"], geometry["aspect_window"]["h"]
          manual_transform = geometry.get("manual_transform")
          manual_window = geometry.get("manual_window") or {"w": src_w, "h": src_h, "x": 0, "y": 0}
          mw, mh = manual_window["w"], manual_window["h"]
          mx, my = manual_window["x"], manual_window["y"]
          fps = source["fps"]
          has_audio = source["has_audio"]
          manual_scale = float((manual_transform or {}).get("scale", 1.0))

          encode_preset = "medium" if max(out_w, out_h) <= 1920 else "faster"
          gop = max(12, int(round(fps * 2)))


          def fnum(value):
              text = f"{float(value):.6f}".rstrip("0").rstrip(".")
              return text if text else "0"


          def ramp_window(ws, we, amp):
              """Cosine-ramped bump in [0,1] over [ws,we] with 0.8s ease in/out."""
              ramp = min(0.8, (we - ws) / 3.0)
              a, b = fnum(ws), fnum(we)
              r = fnum(ramp)
              expr = (
                  f"if(lt(t,{a}),0,"
                  f"if(lt(t,{fnum(ws + ramp)}),(1-cos(PI*(t-{a})/{r}))/2,"
                  f"if(lt(t,{fnum(we - ramp)}),1,"
                  f"if(lt(t,{b}),(1-cos(PI*({b}-t)/{r}))/2,0))))"
              )
              return f"({amp}*({expr}))"


          def center_expr(keypoints, default):
              """Piecewise-linear interpolation over [(t, value)] with hold at both ends."""
              by_time = {}
              for t, value in keypoints:
                  by_time[round(float(t), 2)] = float(value)
              points = sorted(by_time.items())
              if not points:
                  return fnum(default)
              if len(points) > 6:
                  step = (len(points) - 1) / 5.0
                  points = [points[int(i * step)] for i in range(6)]
              expr = fnum(points[-1][1])
              for i in range(len(points) - 1, 0, -1):
                  t0, v0 = points[i - 1]
                  t1, v1 = points[i]
                  if t1 - t0 < 0.05:
                      continue
                  seg = f"{fnum(v0)}+({fnum(v1 - v0)})*(t-{fnum(t0)})/{fnum(t1 - t0)}"
                  expr = f"if(lt(t,{fnum(t1)}),{seg},{expr})"
              t0, v0 = points[0]
              expr = f"if(lt(t,{fnum(t0)}),{fnum(v0)},{expr})"
              return f"({expr})"


          def build_zoom_chain(clip_hints, neutral=False):
              """Stage 2 of the unified transform: dynamic punch-in INSIDE the
              manual window (lanczos), face-follow anchored.

              neutral=True builds the identical chain with zero zoom amplitude
              (identity filters) for QC comparison - the zoom-presence check
              then proves the exported frames really carry the zoom.
              """
              windows = clip_hints.get("zoom_windows") or []
              if not windows:
                  return None
              z_terms = []
              cx_points, cy_points = [], []
              for window in windows:
                  amp = 0.0 if neutral else round(window["zoom_level"] - 1.0, 4)
                  z_terms.append(ramp_window(window["start_rel_sec"], window["end_rel_sec"], fnum(amp)))
                  for keypoint in window.get("keypoints") or []:
                      t, x, y = keypoint
                      cx_points.append((t, x))
                      cy_points.append((t, y))
              if not z_terms:
                  return None
              if neutral:
                  return []
              z_expr = "1+" + "+".join(z_terms)
              cx = center_expr(cx_points, 0.5)
              cy = center_expr(cy_points, 0.5)
              scale = (f"scale=w='2*round(iw*({z_expr})/2)':h='2*round(ih*({z_expr})/2)':"
                       f"eval=frame:flags=lanczos")
              # IMPORTANT: inside crop's x/y expressions, in_w/in_h reflect the
              # link-negotiated (first-frame) size, NOT the per-frame size coming
              # out of the dynamic scale. The zoomed dimensions are therefore
              # computed symbolically as mw*Z(t); clamping keeps the 1-px
              # even-rounding difference during ramps harmless.
              zoomed_w = f"{mw}*({z_expr})"
              zoomed_h = f"{mh}*({z_expr})"
              x_expr = (f"2*floor(min(max({cx}*({zoomed_w})-{mw}/2,0),"
                        f"max(({zoomed_w})-{mw},0))/2)")
              y_expr = (f"2*floor(min(max({cy}*({zoomed_h})-{mh}/2,0),"
                        f"max(({zoomed_h})-{mh},0))/2)")
              crop = f"crop=w={mw}:h={mh}:x='{x_expr}':y='{y_expr}'"
              return [scale, crop]


          def build_manual_crop():
              """Stage 1: the manual pinch-zoom window as a static base crop."""
              if manual_scale <= 1.001 and mx == 0 and my == 0 and (mw, mh) == (src_w, src_h):
                  return None
              return f"crop=w={mw}:h={mh}:x={mx}:y={my}"


          def build_aspect_crop(clip_hints):
              """Stage 4: largest target-ratio rect inside the manual window,
              optionally steered by the tracked primary face (never overriding
              the manual framing)."""
              if mode != "crop":
                  return None
              if (aw, ah) == (mw, mh):
                  return None
              keypoints = clip_hints.get("crop_keypoints")
              if keypoints:
                  x_expr = center_expr([(t, x) for t, x, y in keypoints], (mw - aw) / 2)
                  y_expr = center_expr([(t, y) for t, x, y in keypoints], (mh - ah) / 2)
                  x_full = f"2*floor(min(max({x_expr},0),{mw - aw})/2)"
                  y_full = f"2*floor(min(max({y_expr},0),{mh - ah})/2)"
                  return f"crop=w={aw}:h={ah}:x='{x_full}':y='{y_full}'"
              x0 = 2 * (int((mw - aw) / 2) // 2)
              y0 = 2 * (int((mh - ah) / 2) // 2)
              return f"crop=w={aw}:h={ah}:x={x0}:y={y0}"


          def build_pad_graph(head):
              prefix = f"[0:v]{','.join(head)}," if head else "[0:v]"
              blur_radius = max(2, min(20, min(out_w, out_h) // 4))
              return (
                  f"{prefix}split=2[fgs][bgs];"
                  f"[bgs]scale={out_w}:{out_h}:force_original_aspect_ratio=increase:flags=bicubic,"
                  f"crop={out_w}:{out_h},boxblur={blur_radius}:2,setsar=1[bgo];"
                  f"[fgs]scale={out_w}:{out_h}:force_original_aspect_ratio=decrease:flags=lanczos,"
                  f"setsar=1[fgo];"
                  f"[bgo][fgo]overlay=x=(W-w)/2:y=(H-h)/2[vout]"
              )


          plan_clips = []
          for clip in clips:
              index = clip["clip_index"]
              start = clip["start_sec"]
              length = round(clip["end_sec"] - clip["start_sec"], 3)
              clip_hints = hints["clips"].get(str(index)) or {}
              sub = next((s for s in subtitles.get("clips", []) if s["clip_index"] == index), None)
              burned_in = bool(sub and sub.get("burned_in"))

              # ---- Unified transform chain (stages 1 -> 5) --------------------
              manual_crop = build_manual_crop()
              zoom_chain = build_zoom_chain(clip_hints)
              zoom_chain_neutral = build_zoom_chain(clip_hints, neutral=True)
              tail = []
              if burned_in:
                  ass_path = sub.get("file") or f"work/subs/clip_{index}.ass"
                  tail.append(f"subtitles=filename={ass_path}:fontsdir={FONTS_DIR}")
              tail.append("setsar=1")
              tail.append("format=yuv420p")

              pre = ([manual_crop] if manual_crop else []) + (zoom_chain or [])
              if mode == "pad":
                  graph = build_pad_graph(pre)
                  graph += ";" + "[vout]" + ",".join(tail) + "[vfinal]"
                  final_scale = f"pad canvas {out_w}x{out_h} (blur background, fg fitted)"
              else:
                  chain_parts = list(pre)
                  aspect_crop = build_aspect_crop(clip_hints)
                  if aspect_crop:
                      chain_parts.append(aspect_crop)
                  current_w, current_h = (aw, ah) if aspect_crop else (mw, mh)
                  if (current_w, current_h) != (out_w, out_h):
                      chain_parts.append(f"scale={out_w}:{out_h}:flags=lanczos")
                      final_scale = f"{current_w}x{current_h} -> {out_w}x{out_h} (lanczos)"
                  else:
                      final_scale = "none (already at canvas size)"
                  chain_parts.extend(tail)
                  graph = "[0:v]" + ",".join(chain_parts) + "[vfinal]"

              wm_file = "work/watermark_logo.png"
              has_wm = os.path.exists(wm_file) and os.path.getsize(wm_file) > 0
              wm_pos = params.get("watermark_position", "bottom_right").lower()
              wm_size_key = params.get("watermark_size", "medium").lower()
              wm_scale_factor = {
                  "small": 0.12,
                  "medium": 0.18,
                  "large": 0.26
              }.get(wm_size_key, 0.18)

              wm_xy = {
                  "top_left": "24:24",
                  "top_right": "main_w-overlay_w-24:24",
                  "bottom_left": "24:main_h-overlay_h-24",
                  "bottom_right": "main_w-overlay_w-24:main_h-overlay_h-24"
              }.get(wm_pos, "main_w-overlay_w-24:main_h-overlay_h-24")

              if has_wm:
                  graph = graph.replace("[vfinal]", "[vpre]")
                  graph += f";movie={wm_file},scale={out_w}*{wm_scale_factor}:-1[wm];[vpre][wm]overlay={wm_xy}[vfinal]"

              # QC reference graphs: the identical video chain WITHOUT the
              # subtitle filter (qc_graph), plus a zoom-neutral variant
              # (qc_nozoom_graph) whose zoom amplitudes are zeroed - comparing
              # the exported frame against both proves the zoom really moved
              # pixels instead of merely existing in metadata.
              qc_graph = graph
              if burned_in:
                  sub_filter = f"subtitles=filename={ass_path}:fontsdir={FONTS_DIR}"
                  qc_graph = graph.replace(sub_filter + ",", "")
              neutral_pre = ([manual_crop] if manual_crop else []) + (zoom_chain_neutral or [])
              if mode == "pad":
                  qc_nozoom_graph = build_pad_graph(neutral_pre)
                  qc_nozoom_graph += ";" + "[vout]" + ",".join(t for t in tail
                                                               if not t.startswith("subtitles=")) + "[vfinal]"
              else:
                  neutral_parts = list(neutral_pre)
                  aspect_crop = build_aspect_crop(clip_hints)
                  if aspect_crop:
                      neutral_parts.append(aspect_crop)
                  current_w, current_h = (aw, ah) if aspect_crop else (mw, mh)
                  if (current_w, current_h) != (out_w, out_h):
                      neutral_parts.append(f"scale={out_w}:{out_h}:flags=lanczos")
                  neutral_parts.extend(t for t in tail if not t.startswith("subtitles="))
                  qc_nozoom_graph = "[0:v]" + ",".join(neutral_parts) + "[vfinal]"

              argv = [
                  os.environ.get("FFMPEG_BIN", "ffmpeg"), "-y", "-nostdin",
                  "-hide_banner", "-loglevel", "warning",
                  "-ss", f"{start:.3f}", "-t", f"{length:.3f}", "-i", "raw_video.mp4",
                  "-filter_complex", graph,
                  "-map", "[vfinal]",
              ]
              if has_audio:
                  argv += ["-map", "0:a:0?", "-c:a", "aac", "-b:a", "192k"]
              argv += [
                  "-c:v", "libx264", "-preset", encode_preset, "-crf", "18",
                  "-g", str(gop), "-movflags", "+faststart",
                  f"output_clips/clip_{index}.mp4",
              ]

              windows = clip_hints.get("zoom_windows") or []
              window_notes = "; ".join(
                  f"{w['start_rel_sec']:.1f}-{w['end_rel_sec']:.1f}s @{w['zoom_level']}x "
                  f"({w.get('steering', 'center')})" for w in windows) or "none"
              face_tracks = bool(clip_hints.get("crop_keypoints") or
                                 any(w.get("steering", "").startswith("face-follow") for w in windows))
              report = {
                  "source_resolution": f"{src_w}x{src_h}",
                  "source_fps": f"{source['fps']:g}",
                  "source_codec": f"{source['vcodec']} ({source['pix_fmt']})",
                  "source_bitrate": f"{source.get('video_bitrate', 0) // 1000} kbps",
                  "output_resolution": f"{out_w}x{out_h}",
                  "output_fps": f"{fps:g} (source frame rate preserved)",
                  "output_codec": "h264 (yuv420p, libx264 CRF 18 preset " + encode_preset + ")",
                  "output_quality": geometry.get("quality_note", ""),
                  "ai_zoom_intents": len(clip.get("editing", {}).get("zoom_cuts") or []),
                  "validated_zoom_windows": window_notes,
                  "manual_zoom_scale": f"{manual_scale:g}",
                  "manual_zoom_offset": (f"({(manual_transform or {}).get('offset_x', 0)}, "
                                         f"{(manual_transform or {}).get('offset_y', 0)})"),
                  "face_tracking_status": ("primary face tracked (steering zoom/aspect crop)"
                                           if face_tracks else "no primary face track (center-anchored)"),
                  "final_crop": (f"manual {mw}x{mh}@({mx},{my})"
                                 + (f"; aspect {aw}x{ah}" if (aw, ah) != (mw, mh) else "")
                                 + (f"; zoom peak {max([w['zoom_level'] for w in windows] or [1.0]):g}x"
                                    if windows else "")),
                  "final_scale": final_scale,
                  "filter_graph": graph,
              }

              plan_clips.append({
                  "clip_index": index,
                  "argv": argv,
                  "output": f"output_clips/clip_{index}.mp4",
                  "expect_duration": length,
                  "out_w": out_w, "out_h": out_h,
                  "fps": fps,
                  "has_audio": has_audio,
                  "burned_in": burned_in,
                  "ass": (sub.get("file") if burned_in else None),
                  "video_graph": graph,
                  "qc_graph": qc_graph,
                  "qc_nozoom_graph": qc_nozoom_graph,
                  "clip_start": start,
                  "zoom_windows": windows,
                  "encode_preset": encode_preset,
                  "report": report,
              })
              zoom_note = f", {len(windows)} zoom window(s)" if zoom_chain else ", no zoom"
              print(f"Planned clip {index}: {out_w}x{out_h} @ {fps:g} fps, x264 {encode_preset} CRF 18"
                    f"{zoom_note}, manual scale {manual_scale:g}, subtitles="
                    f"{'burned' if burned_in else 'none'}.")

          os.makedirs("output_clips", exist_ok=True)
          with open("work/render_plan.json", "w", encoding="utf-8") as fh:
              json.dump({"clips": plan_clips, "geometry": geometry}, fh, indent=2)

          print(f"Render plan ready for {len(plan_clips)} clip(s), mode={mode}, "
                f"canvas {out_w}x{out_h} ({geometry.get('output_quality', 'original')}).")
          PY_PLAN

      - name: Render clips
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_RENDER'
          import json
          import os
          import subprocess
          import sys

          ffprobe = os.environ.get("FFPROBE_BIN", "ffprobe")
          plan = json.load(open("work/render_plan.json", encoding="utf-8"))
          os.makedirs("output_clips", exist_ok=True)

          probes = []
          for entry in plan["clips"]:
              print(f"Rendering clip {entry['clip_index']} ({entry['expect_duration']}s) -> {entry['output']}")
              proc = subprocess.run(entry["argv"], capture_output=True, text=True)
              if proc.returncode != 0:
                  print(f"ERROR: ffmpeg failed for clip {entry['clip_index']}:")
                  print("\n".join((proc.stderr or "").strip().splitlines()[-40:]))
                  sys.exit(1)
              for line in (proc.stderr or "").splitlines():
                  if "fontselect" in line or "libass" in line.lower() or "glyf" in line.lower():
                      print(f"  libass: {line.strip()[:180]}")
              output = entry["output"]
              if not os.path.exists(output) or os.path.getsize(output) < 10240:
                  print(f"ERROR: clip {entry['clip_index']} output is missing or suspiciously small.")
                  sys.exit(1)
              probe_cmd = [ffprobe, "-v", "error", "-print_format", "json",
                           "-show_streams", "-show_format", output]
              pp = subprocess.run(probe_cmd, capture_output=True, text=True)
              info = json.loads(pp.stdout) if pp.returncode == 0 else {}
              probes.append({"clip_index": entry["clip_index"], "probe": info,
                             "size_bytes": os.path.getsize(output)})
              print(f"  done: {os.path.getsize(output) / 1e6:.2f} MB")

              # ----- Render report (full media pipeline visibility) ----------
              vstream = next((s for s in info.get("streams", [])
                              if s.get("codec_type") == "video"), {})
              out_bitrate = 0
              try:
                  out_bitrate = int(info.get("format", {}).get("bit_rate") or 0)
              except (TypeError, ValueError):
                  out_bitrate = 0
              rep = entry["report"]
              print("=" * 66)
              print(f"RENDER REPORT - clip {entry['clip_index']}")
              print(f"SOURCE RESOLUTION: {rep['source_resolution']}")
              print(f"SOURCE FPS: {rep['source_fps']}")
              print(f"SOURCE CODEC: {rep['source_codec']}")
              print(f"SOURCE BITRATE: {rep['source_bitrate']}")
              print(f"OUTPUT RESOLUTION: {rep['output_resolution']}")
              print(f"OUTPUT FPS: {rep['output_fps']}")
              print(f"OUTPUT CODEC: {rep['output_codec']}")
              print(f"OUTPUT BITRATE: {out_bitrate // 1000} kbps")
              print(f"OUTPUT FILE SIZE: {os.path.getsize(output) / 1e6:.2f} MB")
              print(f"OUTPUT QUALITY POLICY: {rep['output_quality']}")
              print(f"AI ZOOM INTENTS: {rep['ai_zoom_intents']}")
              print(f"VALIDATED ZOOM WINDOWS: {rep['validated_zoom_windows']}")
              print(f"MANUAL ZOOM SCALE: {rep['manual_zoom_scale']}")
              print(f"MANUAL ZOOM OFFSET: {rep['manual_zoom_offset']}")
              print(f"FACE TRACKING STATUS: {rep['face_tracking_status']}")
              print(f"FINAL CROP: {rep['final_crop']}")
              print(f"FINAL SCALE: {rep['final_scale']}")
              print(f"FFMPEG FILTER GRAPH: {rep['filter_graph']}")
              print("=" * 66)

          with open("work/outputs_probe.json", "w", encoding="utf-8") as fh:
              json.dump(probes, fh, indent=2)

          print(f"Rendered {len(plan['clips'])} clip(s).")
          PY_RENDER

      - name: Report cache usage
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_CACHE_REPORT'
          import os


          def dir_size(path):
              total = 0
              count = 0
              if not os.path.isdir(path):
                  return 0, 0
              for root, _dirs, files in os.walk(path):
                  for name in files:
                      try:
                          total += os.path.getsize(os.path.join(root, name))
                          count += 1
                      except OSError:
                          pass
              return total, count


          print("CACHE REPORT (videos are never cached - only reusable resources and "
                "computation results keyed by source content hash):")
          for label, path in (
                  ("computation: transcript", "work/cache/transcript"),
                  ("computation: curation", "work/cache/curation"),
                  ("computation: coarse frames", "work/coarse"),
                  ("computation: scene frames", "work/frames"),
                  ("resource: YuNet model", os.path.expanduser("~/clipzy-models")),
                  ("resource: fonts", os.path.expanduser("~/clipzy-fonts")),
                  ("resource: Python venv", os.environ.get("CLIPZY_VENV_DIR",
                                                           os.path.expanduser("~/clipzy-venv")))):
              size, count = dir_size(path)
              print(f"  {label:32s} {count:4d} file(s)  {size / 1e6:8.2f} MB")
          print("Per-step CACHE HIT / MISS lines above quantify the time each cache saved.")
          PY_CACHE_REPORT

      - name: Quality control
        shell: bash
        run: |
          set -Eeuo pipefail

          "$CLIPZY_PY" <<'PY_QC'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          import cv2
          import numpy as np

          ffmpeg = os.environ.get("FFMPEG_BIN", "ffmpeg")
          plan = json.load(open("work/render_plan.json", encoding="utf-8"))
          probes = {p["clip_index"]: p for p in json.load(open("work/outputs_probe.json", encoding="utf-8"))}
          subtitles = json.load(open("work/subtitles.json", encoding="utf-8"))
          clips = json.load(open("work/clips_final.json", encoding="utf-8"))
          params = json.load(open("work/params.json", encoding="utf-8"))

          errors = []
          warnings = []


          def probe_stream(probe, kind):
              for stream in probe.get("streams", []):
                  if stream.get("codec_type") == kind:
                      return stream
              return None


          def parse_rate(value):
              try:
                  if value and "/" in value:
                      num, den = value.split("/", 1)
                      return float(num) / float(den) if float(den) else 0.0
                  return float(value)
              except (TypeError, ValueError):
                  return 0.0


          def run_ffmpeg(args):
              return subprocess.run(args, capture_output=True, text=True)


          for entry in plan["clips"]:
              index = entry["clip_index"]
              output = entry["output"]
              tag = f"clip {index}"

              if not os.path.exists(output):
                  errors.append(f"{tag}: output file missing.")
                  continue
              if os.path.getsize(output) < 10240:
                  errors.append(f"{tag}: output file is suspiciously small.")

              probe = probes.get(index, {}).get("probe", {})
              video = probe_stream(probe, "video")
              audio = probe_stream(probe, "audio")
              if video is None:
                  errors.append(f"{tag}: no video stream in the rendered file.")
                  continue

              if video.get("codec_name") != "h264":
                  errors.append(f"{tag}: video codec is {video.get('codec_name')}, expected h264.")
              if video.get("pix_fmt") != "yuv420p":
                  errors.append(f"{tag}: pixel format is {video.get('pix_fmt')}, expected yuv420p.")
              if int(video.get("width") or 0) != entry["out_w"] or int(video.get("height") or 0) != entry["out_h"]:
                  errors.append(f"{tag}: resolution {video.get('width')}x{video.get('height')} "
                                f"!= planned {entry['out_w']}x{entry['out_h']}.")
              ratio = int(video.get("width") or 1) / max(1, int(video.get("height") or 1))
              expected_ratio = entry["out_w"] / entry["out_h"]
              if abs(ratio - expected_ratio) > 0.02:
                  errors.append(f"{tag}: aspect ratio {ratio:.4f} deviates from {expected_ratio:.4f}.")

              out_fps = parse_rate(video.get("r_frame_rate")) or parse_rate(video.get("avg_frame_rate"))
              if out_fps:
                  if abs(out_fps - entry["fps"]) > 0.5:
                      errors.append(f"{tag}: frame rate {out_fps:g} differs strongly from source {entry['fps']:g}.")
                  elif abs(out_fps - entry["fps"]) > 0.06:
                      warnings.append(f"{tag}: frame rate {out_fps:g} slightly differs from source {entry['fps']:g}.")

              duration = 0.0
              try:
                  duration = float(probe.get("format", {}).get("duration") or 0.0)
              except (TypeError, ValueError):
                  duration = 0.0
              if duration <= 0:
                  errors.append(f"{tag}: could not read output duration.")
              else:
                  if abs(duration - entry["expect_duration"]) > 1.5:
                      errors.append(f"{tag}: duration {duration:.2f}s differs from planned "
                                    f"{entry['expect_duration']:.2f}s.")
                  elif abs(duration - entry["expect_duration"]) > 0.5:
                      warnings.append(f"{tag}: duration {duration:.2f}s slightly differs from planned "
                                      f"{entry['expect_duration']:.2f}s.")

              if entry["has_audio"] and audio is None:
                  errors.append(f"{tag}: source has audio but the rendered clip does not.")
              if audio is not None and audio.get("codec_name") not in ("aac", None):
                  errors.append(f"{tag}: audio codec is {audio.get('codec_name')}.")

              # Decode integrity: exit code must be clean.
              proc = run_ffmpeg([ffmpeg, "-v", "error", "-xerror", "-i", output, "-f", "null", "-"])
              if proc.returncode != 0:
                  errors.append(f"{tag}: decode check failed: {(proc.stderr or '').strip()[:300]}")

              # Black frame detection.
              proc = run_ffmpeg([ffmpeg, "-i", output, "-vf", "blackdetect=d=0.4:pix_black_th=0.98",
                                 "-an", "-f", "null", "-"])
              for line in (proc.stderr or "").splitlines():
                  if "blackdetect" not in line:
                      continue
                  match = re.search(r"black_start:(\d+\.?\d*).*black_duration:(\d+\.?\d*)", line)
                  if match:
                      start, black_len = float(match.group(1)), float(match.group(2))
                      if black_len >= 1.0:
                          errors.append(f"{tag}: black frame run of {black_len:.1f}s at {start:.1f}s.")
                      elif black_len >= 0.4:
                          warnings.append(f"{tag}: short black run of {black_len:.1f}s at {start:.1f}s.")

              # ------------------------------------------------------------------
              # ZOOM PRESENCE (auto-zoom verification on actual exported frames).
              # At the peak of the largest zoom window, re-render the planned
              # graph from the source twice - once with the real zoom chain and
              # once with the zoom amplitudes neutralized. The exported frame
              # must match the ZOOMED reference clearly better than the neutral
              # one; otherwise the zoom existed only in metadata.
              # ------------------------------------------------------------------
              windows = entry.get("zoom_windows") or []
              if windows:
                  peak = max(windows, key=lambda w: min(w["end_rel_sec"], 15.0) - w["start_rel_sec"])
                  t_peak = round((peak["start_rel_sec"] + peak["end_rel_sec"]) / 2, 3)
                  t_peak = min(max(t_peak, 0.2), max(0.2, entry["expect_duration"] - 0.2))
                  with tempfile.TemporaryDirectory() as tmp:
                      out_png = os.path.join(tmp, "out.png")
                      zoom_png = os.path.join(tmp, "zoom.png")
                      nozoom_png = os.path.join(tmp, "nozoom.png")

                      def render_ref(graph, path):
                          body_graph = graph[len("[0:v]"):]
                          graph_at_t = f"[0:v]setpts=PTS+{t_peak:.3f}/TB," + body_graph
                          run_ffmpeg([ffmpeg, "-y", "-nostdin", "-loglevel", "error",
                                      "-ss", f"{entry['clip_start'] + t_peak:.3f}", "-t", "0.5",
                                      "-i", "raw_video.mp4",
                                      "-filter_complex", graph_at_t, "-map", "[vfinal]",
                                      "-frames:v", "1", path])

                      run_ffmpeg([ffmpeg, "-y", "-nostdin", "-loglevel", "error",
                                  "-ss", f"{t_peak:.3f}", "-i", output, "-frames:v", "1", out_png])
                      render_ref(entry["qc_graph"], zoom_png)
                      render_ref(entry["qc_nozoom_graph"], nozoom_png)
                      out_img = cv2.imread(out_png, cv2.IMREAD_GRAYSCALE)
                      zoom_img = cv2.imread(zoom_png, cv2.IMREAD_GRAYSCALE)
                      nozoom_img = cv2.imread(nozoom_png, cv2.IMREAD_GRAYSCALE)
                      if out_img is None or zoom_img is None or nozoom_img is None \
                              or not (out_img.shape == zoom_img.shape == nozoom_img.shape):
                          warnings.append(f"{tag}: zoom presence check inconclusive "
                                          f"(reference render failed at t={t_peak:.1f}s).")
                      else:
                          mad_zoom = float(np.abs(out_img.astype(int) - zoom_img.astype(int)).mean())
                          mad_nozoom = float(np.abs(out_img.astype(int) - nozoom_img.astype(int)).mean())
                          if mad_nozoom < 1.0:
                              warnings.append(f"{tag}: zoom presence check inconclusive at t={t_peak:.1f}s "
                                              f"(frame too static to discriminate); inspect manually.")
                          elif mad_zoom < 0.8 * mad_nozoom:
                              print(f"  {tag}: AI zoom verified on exported frames at t={t_peak:.1f}s "
                                    f"(mean |diff| zoomed {mad_zoom:.1f} vs neutral {mad_nozoom:.1f}, "
                                    f"peak {peak['zoom_level']}x, {peak.get('steering', 'center')}).")
                          else:
                              errors.append(
                                  f"{tag}: zoom windows were planned but exported frames do not show "
                                  f"the zoom (t={t_peak:.1f}s: |diff| zoomed {mad_zoom:.1f} vs neutral "
                                  f"{mad_nozoom:.1f}); refusing to claim auto zoom works.")
              elif entry.get("report", {}).get("ai_zoom_intents"):
                  errors.append(f"{tag}: zoom intents existed but no zoom windows reached the render plan.")

              # ------------------------------------------------------------------
              # Subtitle presence (pixel-isolated, motion-safe). At the SAME
              # output frame time, rebuild the source frame twice through the
              # planned video chain: once WITH the subtitles filter and once
              # WITHOUT it. Their difference is the exact subtitle footprint.
              # ------------------------------------------------------------------
              sub = next((s for s in subtitles.get("clips", []) if s["clip_index"] == index), None)
              if entry["burned_in"] and sub:
                  cues = [c for c in sub.get("cues", []) if c["end"] > c["start"]]
                  if not cues:
                      warnings.append(f"{tag}: no caption events; visual subtitle check skipped.")
                  else:
                      candidates = sorted(cues, key=lambda c: c["end"] - c["start"], reverse=True)[:5]
                      times = [round((c["start"] + c["end"]) / 2, 3) for c in candidates]

                      with tempfile.TemporaryDirectory() as tmp:
                          def output_frame(t, path):
                              run_ffmpeg([ffmpeg, "-y", "-nostdin", "-loglevel", "error",
                                          "-ss", f"{t:.3f}", "-i", output,
                                          "-frames:v", "1", path])

                          def source_frame(t, path, graph):
                              # Input seeking resets t to 0; lift PTS so per-frame
                              # zoom expressions and the subtitles filter evaluate
                              # at the correct clip-relative time.
                              body_graph = graph[len("[0:v]"):]
                              graph_at_t = f"[0:v]setpts=PTS+{t:.3f}/TB," + body_graph
                              run_ffmpeg([ffmpeg, "-y", "-nostdin", "-loglevel", "error",
                                          "-ss", f"{entry['clip_start'] + t:.3f}", "-t", "0.5",
                                          "-i", "raw_video.mp4",
                                          "-filter_complex", graph_at_t, "-map", "[vfinal]",
                                          "-frames:v", "1", path])

                          kernel = cv2.getStructuringElement(cv2.MORPH_RECT, (3, 3))
                          verified_at = None
                          ambiguous = "no cue could be sampled"
                          recalls = []
                          for t_cue in times:
                              out_png = os.path.join(tmp, "out.png")
                              nosub_png = os.path.join(tmp, "nosub.png")
                              withsub_png = os.path.join(tmp, "withsub.png")
                              output_frame(t_cue, out_png)
                              source_frame(t_cue, nosub_png, entry["qc_graph"])
                              source_frame(t_cue, withsub_png, entry["video_graph"])
                              out_img = cv2.imread(out_png, cv2.IMREAD_GRAYSCALE)
                              nosub_img = cv2.imread(nosub_png, cv2.IMREAD_GRAYSCALE)
                              withsub_img = cv2.imread(withsub_png, cv2.IMREAD_GRAYSCALE)
                              if out_img is None or nosub_img is None or withsub_img is None:
                                  ambiguous = f"reference render failed at t={t_cue:.1f}s"
                                  continue
                              if not (out_img.shape == nosub_img.shape == withsub_img.shape):
                                  ambiguous = f"reference shape mismatch at t={t_cue:.1f}s"
                                  continue
                              footprint = cv2.absdiff(withsub_img, nosub_img)
                              mask = footprint > 40
                              if mask.sum() < max(300, 0.0005 * mask.size):
                                  ambiguous = f"no visible caption pixels at t={t_cue:.1f}s"
                                  continue
                              diff_nosub = cv2.absdiff(out_img, nosub_img) > 40
                              diff_withsub = cv2.absdiff(out_img, withsub_img) > 40
                              recall_nosub = float((diff_nosub & mask).sum() / max(1, mask.sum()))
                              recall_withsub = float((diff_withsub & mask).sum() / max(1, mask.sum()))
                              recalls.append(recall_nosub)
                              inside_shift = float(cv2.absdiff(out_img, nosub_img)[mask].mean())
                              outside = ~cv2.dilate(mask.astype(np.uint8), kernel,
                                                    iterations=4).astype(bool)
                              outside_shift = (float(cv2.absdiff(out_img, nosub_img)[outside].mean())
                                              if outside.any() else 0.0)
                              ambiguous = (f"t={t_cue:.1f}s text-pixel recall "
                                           f"{recall_nosub:.2f} (no-sub) / {recall_withsub:.2f} (with-sub)")
                              if recall_nosub >= 0.60 and recall_withsub <= 0.35:
                                  verified_at = (t_cue, recall_nosub, recall_withsub,
                                                 inside_shift, outside_shift)
                                  break

                          if verified_at:
                              t_cue, r_no, r_with, in_shift, out_shift = verified_at
                              print(f"  {tag}: subtitle presence verified at t={t_cue:.1f}s "
                                    f"(text-pixel recall {r_no:.0%} vs with-sub reference "
                                    f"{r_with:.0%}; mean shift inside {in_shift:.1f} / "
                                    f"outside {out_shift:.1f}).")
                          elif recalls and min(recalls) < 0.25:
                              errors.append(
                                  f"{tag}: burned subtitles not detected at any sampled cue "
                                  f"({ambiguous}); refusing to claim subtitles were burned.")
                          else:
                              warnings.append(f"{tag}: subtitle verification inconclusive "
                                              f"({ambiguous}); treating as pass, but inspect the clip.")
              elif not entry["burned_in"] and subtitles.get("style") != "NONE":
                  print(f"  {tag}: no captions in range; burned_in=false reported honestly.")

          # Metadata sanity: no placeholders, no fabricated markers.
          PLACEHOLDER_PATTERNS = re.compile(
              r"(?i)(amazing video|video highlight|highlight \d|untitled|todo|xxx|undefined|nan|placeholder|【)", )
          for clip in clips:
              tag = f"clip {clip['clip_index']}"
              if not clip.get("title"):
                  errors.append(f"{tag}: missing title.")
              elif PLACEHOLDER_PATTERNS.search(clip["title"]):
                  errors.append(f"{tag}: placeholder-like title '{clip['title']}'.")
              if not clip.get("description"):
                  errors.append(f"{tag}: missing description.")
              tags = clip.get("tags") or []
              if not (3 <= len(tags) <= 5):
                  errors.append(f"{tag}: expected 3-5 tags, found {len(tags)}.")
              score = clip.get("viral_score")
              if not isinstance(score, int) or not (1 <= score <= 100):
                  errors.append(f"{tag}: viral_score {score} outside 1-100.")
              duration = round(clip["end_sec"] - clip["start_sec"], 2)
              for zoom in clip["editing"]["zoom_cuts"]:
                  if not (0 <= zoom["start_rel_sec"] < zoom["end_rel_sec"] <= duration):
                      errors.append(f"{tag}: zoom window {zoom} outside the clip duration.")
                  if not (1.05 <= zoom["zoom_level"] <= 1.20):
                      errors.append(f"{tag}: zoom level {zoom['zoom_level']} outside 1.05-1.20.")
              if clip["editing"]["zoom_enabled"] and not clip["editing"]["zoom_cuts"]:
                  errors.append(f"{tag}: zoom_enabled is true but zoom_cuts is empty.")
              # Manual transform echo must match the validated job parameters.
              if clip["editing"].get("manual_transform") != params.get("manual_transform"):
                  errors.append(f"{tag}: manual_transform in the manifest does not match the job parameters.")

          for warning in warnings:
              print(f"WARN: {warning}")
          if errors:
              print("ERROR: quality control failed:")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)
          print(f"Quality control passed for {len(plan['clips'])} clip(s) "
                f"({len(warnings)} warning(s)).")
          PY_QC

      - name: Build Android manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_MANIFEST'
          import json

          clips = json.load(open("work/clips_final.json", encoding="utf-8"))
          subtitles = json.load(open("work/subtitles.json", encoding="utf-8"))
          probes = {p["clip_index"]: p for p in json.load(open("work/outputs_probe.json", encoding="utf-8"))}
          transcript = json.load(open("work/transcript.json", encoding="utf-8"))
          params = json.load(open("work/params.json", encoding="utf-8"))
          tracks = {t["clip_index"]: t for t in json.load(open("work/face_tracks.json", encoding="utf-8"))}


          def parse_rate(value):
              try:
                  if value and "/" in value:
                      num, den = value.split("/", 1)
                      return float(num) / float(den) if float(den) else 0.0
                  return float(value)
              except (TypeError, ValueError):
                  return 0.0


          manifest = []
          for clip in clips:
              index = clip["clip_index"]
              sub = next((s for s in subtitles.get("clips", []) if s["clip_index"] == index), None)
              probe = probes.get(index, {}).get("probe", {})
              size = probes.get(index, {}).get("size_bytes", 0)
              video = next((s for s in probe.get("streams", []) if s.get("codec_type") == "video"), {})
              audio = next((s for s in probe.get("streams", []) if s.get("codec_type") == "audio"), {})

              visual = clip.get("visual_analysis") or {}
              manifest.append({
                  "clip_index": index,
                  "start_sec": clip["start_sec"],
                  "end_sec": clip["end_sec"],
                  "duration": round(clip["end_sec"] - clip["start_sec"], 2),
                  "viral_score": clip.get("viral_score", 0),
                  "topic": clip.get("topic", ""),
                  "hook": clip.get("hook", ""),
                  "title": clip.get("title", ""),
                  "description": clip.get("description", ""),
                  "tags": clip.get("tags", []),
                  "language": transcript.get("language", ""),
                  "visual_analysis": {
                      "main_subject": visual.get("main_subject", ""),
                      "scene": visual.get("scene", ""),
                      "faces_detected": bool((tracks.get(index) or {}).get("primary")),
                  },
                  "editing": clip.get("editing", {}),
                  "subtitles": {
                      "burned_in": bool(sub and sub.get("burned_in")),
                      "style": params["subtitle_style"],
                      "language": subtitles.get("language", ""),
                      "word_timing_source": subtitles.get("word_source", ""),
                  },
                  "subtitle_segments": (sub or {}).get("cues", []),
                  "render": {
                      "file": f"clip_{index}.mp4",
                      "width": int(video.get("width") or 0),
                      "height": int(video.get("height") or 0),
                      "fps": round(parse_rate(video.get("r_frame_rate")), 3),
                      "video_codec": video.get("codec_name", ""),
                      "audio_codec": audio.get("codec_name") or "none",
                      "size_bytes": size,
                  },
              })

          with open("clips_manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, indent=2)

          print(f"Manifest written: {len(manifest)} clip entries (Android-compatible array).")
          for clip in manifest:
              print(f"  clip {clip['clip_index']}: '{clip['title'][:48]}' "
                    f"zoom={'yes' if clip['editing'].get('zoom_enabled') else 'no'} "
                    f"subs={'burned' if clip['subtitles']['burned_in'] else 'no'} "
                    f"manual_scale={(clip['editing'].get('manual_transform') or {}).get('scale', 1.0)}")
          PY_MANIFEST

      - name: Upload clips and metadata to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          set -Eeuo pipefail

          for REQUIRED in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ENDPOINT_URL R2_BUCKET_NAME R2_PUBLIC_DOMAIN; do
            if [[ -z "${!REQUIRED:-}" ]]; then
              echo "ERROR: required R2 setting $REQUIRED is missing."
              exit 1
            fi
          done

          R2_PUBLIC_DOMAIN="${R2_PUBLIC_DOMAIN%/}"

          aws s3 cp output_clips/ "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type video/mp4

          FIRST_CLIP="$(find output_clips -maxdepth 1 -type f -name 'clip_*.mp4' | sort -V | head -n 1)"
          if [[ -z "$FIRST_CLIP" ]]; then
            echo "ERROR: no rendered clip found for primary download."
            exit 1
          fi

          aws s3 cp "$FIRST_CLIP" \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}.mp4" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type video/mp4

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}_meta.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          aws s3 cp clips_manifest.json \
            "s3://${R2_BUCKET_NAME}/outputs/${JOB_ID}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          python3 <<'PY_STATUS' > status.json
          import json
          import os

          job_id = os.environ["JOB_ID"]
          domain = os.environ["R2_PUBLIC_DOMAIN"].rstrip("/")
          manifest = json.load(open("clips_manifest.json", encoding="utf-8"))
          clips = [
              {
                  "clip_index": clip["clip_index"],
                  "file": f"clip_{clip['clip_index']}.mp4",
                  "url": f"{domain}/outputs/{job_id}/clip_{clip['clip_index']}.mp4",
              }
              for clip in manifest
          ]
          manual_transform = None
          raw_manual = (os.environ.get("MANUAL_TRANSFORM") or "").strip()
          if raw_manual:
              try:
                  manual_transform = json.loads(raw_manual)
              except ValueError:
                  manual_transform = None
          print(json.dumps({
              "job_id": job_id,
              "status": "ready",
              "file_name": f"{job_id}.mp4",
              "download_url": f"{domain}/outputs/{job_id}.mp4",
              "manifest_url": f"{domain}/outputs/{job_id}/manifest.json",
              "clip_count": len(manifest),
              "subtitle_style": os.environ.get("SUBTITLE_STYLE", "VIRAL"),
              "aspect_ratio": os.environ.get("ASPECT_RATIO", "source"),
              "output_quality": os.environ.get("OUTPUT_QUALITY", "original"),
              "manual_transform": manual_transform,
              "video_language": os.environ.get("TRANSCRIPT_LANGUAGE", ""),
              "clips": clips,
          }, ensure_ascii=False))
          PY_STATUS

          aws s3 cp status.json \
            "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json

          echo "Upload complete for job: ${JOB_ID}"

      # Debug artifacts for every failed run: the raw GPT-6 Luna attempts
      # (model, HTTP status, finish reason, token usage, parse result, retry
      # reason, response excerpts) plus the render plan used. Never contains
      # API keys or authorization headers.
      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clipzy-debug-${{ github.run_id }}
          path: |
            work/debug
            work/render_plan.json
            work/render_hints.json
            clips_manifest.json
          retention-days: 14
          if-no-files-found: ignore
