                      {"role": "system", "content": system_message},
                      {"role": "user", "content": parts},
                      {"role": "assistant", "content": (last_content or "")[:6000]},
                      {"role": "user", "content": retry_text},
                  ]
                  payload["temperature"] = 0.1
              elif attempt == 3:
                  # Compact regeneration: same mandatory fields, terser values.
                  kept = ""
                  if salvaged_clips:
                      stamps = "\n".join(
                          json.dumps({"start_sec": c.get("start_sec"), "end_sec": c.get("end_sec")},
                                     ensure_ascii=False)
                          for c in salvaged_clips)
                      kept = (f"The clip windows below are FINAL - reuse these EXACT timestamps, "
                              f"never add, remove or shift a clip:\n{stamps}\n")
                  compact_prompt = (
                      "Re-select the clips for this video using the attached keyframes and transcript, "
                      "but with a COMPACT output structure so the complete JSON always fits:\n"
                      "- video_analysis: topic + summary only (summary <= 200 chars).\n"
                      "- clips: clip_index, start_sec, end_sec, viral_score (1-100), hook (verbatim or \"\"), "
                      "title (<= 65 chars), description (<= 120 chars), tags (3-5), "
                      "visual_analysis {main_subject, scene} (<= 60 chars each), "
                      "zoom_intents [{start_rel_sec, end_rel_sec, zoom_level, target, reason <= 80 chars}] "
                      "(empty array when no visual justification exists).\n"
                      "Every mandatory field must be present for every clip. Return only JSON.\n\n" + kept)
                  payload["messages"] = [
                      {"role": "system", "content": "You return ONLY valid compact JSON, no Markdown fences."},
                      {"role": "user", "content": [{"type": "text", "text": compact_prompt}] + parts[1:]},
                  ]
                  payload["temperature"] = 0.2

              info = gpt.chat_with_retries(API_BASE, API_KEY, payload, timeout=300)
              last_content = info["content"] or ""
              data, parse_error = gpt.parse_json_content(last_content)
              parse_result = "ok" if data is not None else f"failed ({parse_error})"

              # A 200 response is never assumed complete: when the provider
              # says the output hit the limit, actively salvage what closed.
              if data is None and info["finish_reason"] == "length":
                  data, repair_note = gpt.repair_truncated_json(last_content)
                  if data is not None:
                      parse_result += f"; salvaged ({repair_note})"
                  else:
                      parse_result += "; salvage failed"

              video_analysis, clips_raw, problems = gpt.validate_curation_schema(
                  data, duration, low, high)
              validation_note = (f"{len(clips_raw)} clip(s) valid"
                                 + (f"; problems: {'; '.join(problems[:6])}" if problems else ""))

              retry_reason = ""
              if info["ok"] and clips_raw:
                  retry_reason = ""
              elif not info["ok"]:
                  retry_reason = f"request failed: {info['error'][:200]}"
              elif info["finish_reason"] == "length":
                  retry_reason = "finish_reason=length (output limit reached, response truncated)"
              elif info["finish_reason"] == "content_filter":
                  retry_reason = "finish_reason=content_filter (response blocked by content filtering)"
              elif info["finish_reason"] not in ("stop", None):
                  retry_reason = f"finish_reason={info['finish_reason']}"
              elif data is None:
                  retry_reason = f"unparseable JSON ({parse_error[:160]})"
              else:
                  retry_reason = "no clip passed schema validation"

              usage = info.get("usage") or {}
              print(f"ATTEMPT {attempt}/3 | MODEL: {CHAT_MODEL} | HTTP STATUS: {info['http_status']} | "
                    f"FINISH REASON: {info['finish_reason'] or '(absent)'} | "
                    f"PROMPT TOKENS: {usage.get('prompt_tokens') or '-'} | "
                    f"COMPLETION TOKENS: {usage.get('completion_tokens') or '-'} | "
                    f"JSON VALIDATION: {validation_note}"
                    + (f" | RETRY REASON: {retry_reason}" if retry_reason else ""))
              gpt.write_debug_attempt(
                  f"work/debug/curation_attempt_{attempt}.txt", f"{attempt}/3", CHAT_MODEL,
                  info, parse_result, validation_note, retry_reason, last_content)

              if info["ok"] and clips_raw and info["finish_reason"] in ("stop", None):
                  # A complete response: parsed cleanly AND the provider
                  # confirmed the output ended naturally (never assume a 200
                  # alone means complete).
                  final_result = (video_analysis, clips_raw)
                  break

              failure_summary.append(f"attempt {attempt}: {retry_reason}")
              # Preserve whatever was recovered for the next attempt.
              if clips_raw:
                  salvaged_clips = clips_raw
                  if best_salvage is None or len(clips_raw) > len(best_salvage[1]):
                      best_salvage = (video_analysis, clips_raw)
              if isinstance(video_analysis, dict) and video_analysis:
                  salvaged_analysis = video_analysis

          if final_result is None and best_salvage is not None:
              # Every attempt ended truncated or unusable, but the model's own
              # output contained complete, individually validated clips. Using
              # them verbatim is recovery, not fabrication - and it is strictly
              # better than failing the job after the same three attempts.
              print(f"WARN: all 3 GPT-6 Luna attempts ended incomplete; recovering "
                    f"{len(best_salvage[1])} complete clip(s) verbatim from the model's own "
                    f"truncated output (validated, never fabricated).")
              final_result = best_salvage

          if final_result is None:
              print("ERROR: GPT-6 Luna curation failed after 3 attempts (model "
                    f"{CHAT_MODEL}). Failure summary:")
              for line in failure_summary:
                  print(f"  - {line}")
              print("Raw responses and diagnostics were saved to work/debug/curation_attempt_*.txt "
                    "and are uploaded as workflow artifacts.")
              print("Refusing to fabricate fallback clips - fix the API issue and re-run the job.")
              sys.exit(1)

          video_analysis, clips_raw = final_result
          api_seconds = round(time.time() - api_started, 1)

          with open("work/video_analysis.json", "w", encoding="utf-8") as fh:
              json.dump(video_analysis, fh, ensure_ascii=False, indent=2)

          segments = transcript.get("segments", [])


          def hook_is_real(hook, clip_start, clip_end):
              if not hook:
                  return False
              window = " ".join(s["text"] for s in segments
                                if s["end"] > clip_start - 8 and s["start"] < clip_end + 8).lower()
              probe = re.sub(r"\s+", " ", hook.lower()).strip(" .!?,")
              if not probe:
                  return False
              size = len(probe)
              for start in range(0, max(1, len(window) - size + 1)):
                  if SequenceMatcher(None, probe, window[start:start + size]).ratio() > 0.8:
                      return True
              return False


          valid = []
          dropped = []
          for item in clips_raw:
              start = float(item["start_sec"])
              end = float(item["end_sec"])
              length = end - start

              visual = item.get("visual_analysis") if isinstance(item.get("visual_analysis"), dict) else {}
              clip = {
                  "start_sec": round(start, 2),
                  "end_sec": round(end, 2),
                  "viral_score": max(1, min(100, int(item.get("viral_score") or 50))),
                  "topic": str(item.get("topic") or "").strip()[:120],
                  "hook": str(item.get("hook") or "").strip()[:140],
                  "title": str(item.get("title") or "").strip()[:65],
                  "description": str(item.get("description") or "").strip()[:300],
                  "tags": [],
                  "visual_analysis": {
                      "main_subject": str(visual.get("main_subject") or "").strip()[:160],
                      "scene": str(visual.get("scene") or "").strip()[:160],
                  },
                  "zoom_intents": [],
              }
              tags = item.get("tags")
              if isinstance(tags, list):
                  for tag in tags[:5]:
                      tag = str(tag).strip().replace(" ", "")
                      if not tag:
                          continue
                      if not tag.startswith("#"):
                          tag = "#" + tag.lstrip("#")
                      if re.fullmatch(r"#[\w\u00c0-\uffff]+", tag, re.IGNORECASE) and tag not in clip["tags"]:
                          clip["tags"].append(tag)
              if not clip["title"] or not clip["description"]:
                  dropped.append("missing title or description")
                  continue
              if clip["hook"] and not hook_is_real(clip["hook"], start, end):
                  print(f"WARN: hook for clip at {start:.0f}s is not verbatim in the transcript; dropping the quote.")
                  clip["hook"] = ""

              intents = item.get("zoom_intents")
              if isinstance(intents, list):
                  for intent in intents[:3]:
                      if not isinstance(intent, dict):
                          continue
                      try:
                          ws = max(0.0, float(intent.get("start_rel_sec", 0)))
                          we = min(length, float(intent.get("end_rel_sec", 0)))
                      except (TypeError, ValueError):
                          continue
                      if we - ws < 1.0:
                          continue
                      try:
                          level = float(intent.get("zoom_level") or 1.10)
                      except (TypeError, ValueError):
                          level = 1.10
                      level = min(1.20, max(1.05, round(level, 2)))
                      clip["zoom_intents"].append({
                          "start_rel_sec": round(ws, 2),
                          "end_rel_sec": round(we, 2),
                          "zoom_level": level,
                          "target": "primary_subject",
                          "reason": str(intent.get("reason") or "").strip()[:200],
                      })
              valid.append(clip)

          # Remove heavily overlapping duplicates (keep the higher viral_score).
          valid.sort(key=lambda c: c["viral_score"], reverse=True)
          kept = []
          for clip in valid:
              duplicate = False
              for other in kept:
                  overlap = min(clip["end_sec"], other["end_sec"]) - max(clip["start_sec"], other["start_sec"])
                  shortest = min(clip["end_sec"] - clip["start_sec"], other["end_sec"] - other["start_sec"])
                  if shortest > 0 and overlap / shortest > 0.45:
                      duplicate = True
                      break
              if not duplicate:
                  kept.append(clip)

          kept.sort(key=lambda c: c["start_sec"])
          for index, clip in enumerate(kept, 1):
              clip["clip_index"] = index

          if dropped:
              print(f"Dropped {len(dropped)} invalid AI clip entr{'y' if len(dropped) == 1 else 'ies'}: {dropped}")
          if not kept:
              print("ERROR: GPT-6 Luna produced no usable clips after validation. Raw response excerpts:")
              for path in ("work/debug/curation_attempt_1.txt", "work/debug/curation_attempt_2.txt",
                           "work/debug/curation_attempt_3.txt"):
                  if os.path.exists(path):
                      excerpt = open(path, encoding="utf-8").read()[:800]
                      print(f"--- {path} ---\n{excerpt}")
              sys.exit(1)

          with open("work/curation.json", "w", encoding="utf-8") as fh:
              json.dump({"clips": kept}, fh, ensure_ascii=False, indent=2)

          # Curation computation cache (derived JSON only, never the video).
          cache_manager.save_cached(
              "work/cache/curation/curation.json",
              {"clips": kept, "video_analysis": video_analysis},
              meta={"source_sha256": source.get("source_sha256"), "model": CHAT_MODEL,
                    "target_duration": target_duration, "language_hint": language_hint,
                    "prompt_version": CURATION_PROMPT_VERSION, "api_seconds": api_seconds})

          zoom_count = sum(len(c["zoom_intents"]) for c in kept)
          print(f"Curation complete: {len(kept)} clip(s) accepted, {zoom_count} zoom intent(s) proposed "
                f"({api_seconds:.1f}s, 1-3 GPT-6 Luna attempt(s); cached for this source hash).")
          for clip in kept:
              print(f"  clip {clip['clip_index']}: {clip['start_sec']}-{clip['end_sec']}s "
                    f"score={clip['viral_score']} zoom_intents={len(clip['zoom_intents'])} "
                    f"title='{clip['title'][:50]}'")
          PY_CURATE

      - name: Track faces inside selected clips
        shell: bash
        run: |
          set -Eeuo pipefail

          "$CLIPZY_PY" <<'PY_TRACK'
          import json
          import os
          import subprocess
          import sys

          sys.path.insert(0, "work")

          import cv2

          import clipzy_vision as vision

          ffmpeg = os.environ.get("FFMPEG_BIN", "ffmpeg")
          curation = json.load(open("work/curation.json", encoding="utf-8"))

          method, detector = vision.load_detector()
          SAMPLE_FPS = 2.0
          os.makedirs("work/track", exist_ok=True)

          tracks_out = []
          for clip in curation["clips"]:
              index = clip["clip_index"]
              start = clip["start_sec"]
              length = round(clip["end_sec"] - clip["start_sec"], 3)
              frame_dir = f"work/track/c{index}"
              os.makedirs(frame_dir, exist_ok=True)

              cmd = [
                  ffmpeg, "-y", "-nostdin", "-hide_banner", "-loglevel", "error",
                  "-ss", f"{start:.3f}", "-t", f"{length:.3f}", "-i", "raw_video.mp4",
                  "-an", "-vf", f"fps={SAMPLE_FPS},scale=640:-2:flags=bicubic", "-q:v", "5",
                  f"{frame_dir}/f_%05d.jpg",
              ]
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  print(f"WARN: frame dump failed for clip {index}: {proc.stderr[-300:]}")
                  tracks_out.append({"clip_index": index, "method": method, "sample_fps": SAMPLE_FPS,
                                     "samples": [], "cuts": [], "primary": None})
                  continue

              files = sorted(f for f in os.listdir(frame_dir) if f.endswith(".jpg"))
              samples = []
              tracker = vision.IoUTracker(max_age_seconds=1.0)
              prev_gray = None
              cuts = []
              history = {}

              for position, name in enumerate(files):
                  image = cv2.imread(os.path.join(frame_dir, name))
                  if image is None:
                      continue
                  t = position / SAMPLE_FPS
                  gray = cv2.cvtColor(image, cv2.COLOR_BGR2GRAY)
                  if vision.histogram_correlation(prev_gray, gray) < 0.5:
                      cuts.append(round(t, 2))
                  prev_gray = gray
                  height, width = image.shape[:2]
                  boxes = vision.detect_faces(image, method, detector)
                  matched = tracker.update(t, boxes)
                  faces = []
                  # IoUTracker.update() returns [(id, (x, y, w, h), conf)]
                  # 3-tuples — keep this unpack in sync with that contract.
                  for track_id, (x, y, w, h), conf in matched:
                      faces.append({
                          "id": track_id,
                          "x": round((x + w / 2) / width, 4),
                          "y": round((y + h / 2) / height, 4),
                          "w": round(w / width, 4),
                          "h": round(h / height, 4),
                          "conf": round(float(conf), 3),
                      })
                      history.setdefault(track_id, []).append((t, x, y, w, h, conf))
                  samples.append({"t": round(t, 2), "faces": faces})

              cut_set = sorted(set(cuts))
              frame_count = max(1, len(samples))

              # Primary subject = persistence x area x centrality; tracks spanning a scene
              # cut are penalized because the framing must never jump across a cut.
              best_id, best_score = None, -1.0
              ids = sorted({f["id"] for s in samples for f in s["faces"]})
              for track_id in ids:
                  entries = [(s["t"], f) for s in samples for f in s["faces"] if f["id"] == track_id]
                  persistence = len(entries) / frame_count
                  if persistence < 0.4:
                      continue
                  median_area = sorted(f["w"] * f["h"] for _, f in entries)[len(entries) // 2]
                  median_x = sorted(f["x"] for _, f in entries)[len(entries) // 2]
                  median_y = sorted(f["y"] for _, f in entries)[len(entries) // 2]
                  centrality = 1.0 - min(1.0, ((median_x - 0.5) ** 2 + (median_y - 0.5) ** 2) ** 0.5 * 2)
                  score = 0.5 * persistence + 0.3 * min(1.0, median_area * 8) + 0.2 * centrality
                  if any(entries[0][0] < cut < entries[-1][0] for cut in cut_set):
                      score *= 0.4
                  if score > best_score:
                      best_id, best_score = track_id, score

              primary = None
              if best_id is not None:
                  raw_centers = [(s["t"], f["x"], f["y"]) for s in samples
                                 for f in s["faces"] if f["id"] == best_id]
                  center_samples = []
                  ema = None
                  for i, (t, cx, cy) in enumerate(raw_centers):
                      lo, hi = max(0, i - 2), min(len(raw_centers), i + 3)
                      mx = sorted(p[1] for p in raw_centers[lo:hi])[(hi - lo) // 2]
                      my = sorted(p[2] for p in raw_centers[lo:hi])[(hi - lo) // 2]
                      if ema is None:
                          ema = [mx, my]
                      else:
                          ema[0] = 0.4 * mx + 0.6 * ema[0]
                          ema[1] = 0.4 * my + 0.6 * ema[1]
                      center_samples.append({"t": round(t, 2), "x": round(ema[0], 4), "y": round(ema[1], 4)})
                  coverage = len(center_samples) / frame_count
                  primary = {"id": best_id, "coverage": round(coverage, 3), "center_samples": center_samples}

              tracks_out.append({
                  "clip_index": index,
                  "method": method,
                  "sample_fps": SAMPLE_FPS,
                  "samples": samples,
                  "cuts": cut_set,
                  "primary": primary,
              })
              print(f"Clip {index}: {len(samples)} tracked frames, {len(ids)} face track(s), "
                    f"primary={'#' + str(best_id) if best_id is not None else 'none'}, "
                    f"coverage={(primary or {}).get('coverage', 0)}, cuts={len(cut_set)}.")

          with open("work/face_tracks.json", "w", encoding="utf-8") as fh:
              json.dump(tracks_out, fh)

          detected = sum(1 for t in tracks_out if t["primary"])
          print(f"Detailed face tracking complete: primary subject tracked in "
                f"{detected}/{len(tracks_out)} clip(s) using {method}.")
          PY_TRACK
      - name: Reconcile zoom decisions and output geometry
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY_ZOOM'
          import json
          import os
          import sys

          source = json.load(open("work/source.json", encoding="utf-8"))
          curation = json.load(open("work/curation.json", encoding="utf-8"))
          tracks = {t["clip_index"]: t for t in json.load(open("work/face_tracks.json", encoding="utf-8"))}
          try:
              face_context = json.load(open("work/face_context.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              face_context = {"samples": []}
          params = json.load(open("work/params.json", encoding="utf-8"))

          src_w, src_h = source["width"], source["height"]
          src_ratio = src_w / src_h
          aspect = params["aspect_ratio"]
          preserve_quality = params["preserve_source_quality"] == "true"
          output_quality = params.get("output_quality", "original")
          manual_transform = params.get("manual_transform")


          def parse_ratio(label):
              if ":" in label:
                  a, b = label.split(":", 1)
                  return float(a) / float(b)
              return float(label)


          def round_even(value):
              return max(2, int(round(value / 2.0)) * 2)


          # =========================================================================
          # UNIFIED RENDERING TRANSFORM - stage 1: the manual pinch-zoom window.
          #
          # Transformation order (single FFmpeg pass, documented contract):
          #   1. MANUAL BASE FRAMING  - static crop of the source to the user's
          #      pinch-zoom window (scale s, offsets). Defines the "camera".
          #   2. AI AUTO ZOOM          - time-varying punch-in INSIDE the manual
          #      window (2-15s, cosine ramps, face-follow anchor when a primary
          #      face track exists, centered otherwise).
          #   3. FACE TRACKING         - only steers the anchor of stage 2 and the
          #      aspect-crop center of stage 4; it never overrides stage 1.
          #   4. ASPECT-RATIO CROP/PAD - largest target-ratio rect inside the
          #      manual window (crop mode) or blurred-background pad.
          #   5. FINAL SCALE           - lanczos resize to the output canvas.
          #      Subtitles are burned AFTER all geometry so they never zoom.
          # The final crop always stays inside source boundaries; manual and
          # automatic transforms compose multiplicatively (s * z(t)).
          # =========================================================================
          manual_active = bool(manual_transform)
          if manual_active:
              s = float(manual_transform["scale"])
              # Window center in source-fraction coords, clamped so the window
              # never leaves the frame (the Android preview clamps identically,
              # so preview and export agree by construction).
              cx_w = 0.5 + float(manual_transform["offset_x"])
              cy_w = 0.5 + float(manual_transform["offset_y"])
              mw_f, mh_f = 1.0 / s, 1.0 / s
              cx_w = min(1.0 - mw_f / 2, max(mw_f / 2, cx_w))
              cy_w = min(1.0 - mh_f / 2, max(mh_f / 2, cy_w))
              mw = round_even(src_w / s)
              mh = round_even(src_h / s)
              mx = round_even(min(max(cx_w * src_w - mw / 2, 0), src_w - mw))
              my = round_even(min(max(cy_w * src_h - mh / 2, 0), src_h - mh))
              print(f"Manual base framing: window {mw}x{mh} at ({mx},{my}) "
                    f"(scale {s:g}, offsets ({manual_transform['offset_x']}, "
                    f"{manual_transform['offset_y']})).")
          else:
              s = 1.0
              mw, mh, mx, my = src_w, src_h, 0, 0

          if aspect == "source":
              target_ratio = src_ratio
              target_label = source["aspect_ratio"]
          else:
              target_ratio = parse_ratio(aspect)
              target_label = aspect

          # ---- Output canvas policy (output_quality) --------------------------
          # original : native-ratio canvas that never upscales the source.
          # 1080p/720p/480p : short-side budget, capped at what the source can
          # support (explicit notice, never a silent replacement); upscaling is
          # only allowed when the user opted out of preserve_source_quality.
          native_w = round_even(min(src_w, src_h * target_ratio))
          native_h = round_even(native_w / target_ratio)
          if native_h > src_h:
              native_h = round_even(src_h)
              native_w = round_even(native_h * target_ratio)
          native_short = min(native_w, native_h)

          if output_quality == "original":
              out_w, out_h = native_w, native_h
              quality_note = "original (native dimensions, never upscaled)"
          else:
              requested_short = int(output_quality.replace("p", ""))
              if requested_short <= native_short:
                  quality_note = f"{output_quality} as requested"
              elif preserve_quality:
                  quality_note = (f"requested {output_quality} exceeds the source capability "
                                  f"({native_short}px short side); rendering at native "
                                  f"{native_short}px instead of upscaling")
              else:
                  quality_note = (f"requested {output_quality} exceeds the source capability "
                                  f"({native_short}px short side); upscaling is allowed because "
                                  f"preserve_source_quality=false")
              budget_short = (requested_short if (requested_short <= native_short or not preserve_quality)
                              else native_short)
              if target_ratio >= 1.0:
                  out_w = round_even(budget_short * target_ratio)
                  out_h = round_even(budget_short)
              else:
                  out_w = round_even(budget_short)
                  out_h = round_even(budget_short / target_ratio)

          mode = "passthrough"
          if manual_active or abs(target_ratio - src_ratio) >= 0.01 or (out_w, out_h) != (src_w, src_h):
              # Largest target-ratio rect inside the MANUAL WINDOW; the final
              # scale stage maps it onto the canvas.
              aw = round_even(min(mw, mh * target_ratio))
              ah = round_even(aw / target_ratio)
              if ah > mh:
                  ah = round_even(mh)
                  aw = round_even(ah * target_ratio)
              w_frac, h_frac = aw / mw, ah / mh
              centers = []
              for sample in face_context.get("samples", []):
                  for f in sample.get("faces", []):
                      # Remap source-fraction coords into the manual window.
                      x_m = (f["x"] * src_w - mx) / mw
                      y_m = (f["y"] * src_h - my) / mh
                      centers.append((x_m, y_m))
              if centers:
                  inside = sum(1 for x_m, y_m in centers
                               if 0.5 - w_frac / 2 <= x_m <= 0.5 + w_frac / 2
                               and 0.5 - h_frac / 2 <= y_m <= 0.5 + h_frac / 2)
                  containment = inside / len(centers)
                  # Verified subjects: crop to them regardless of how narrow the
                  # aspect window is (this is the standard shorts conversion).
                  mode = "crop" if containment >= 0.75 else "pad"
              else:
                  # No face evidence at all: only moderate blind crops fill the
                  # frame; extreme conversions (portrait<->landscape) keep the
                  # full content on a blurred canvas instead of guessing.
                  containment = None
                  mode = "crop" if (w_frac >= 0.5 and h_frac >= 0.5) else "pad"
              containment_note = "no face evidence" if containment is None else f"{containment:.0%}"
              print(f"Aspect conversion {src_w}x{src_h} (window {mw}x{mh}) -> {out_w}x{out_h}: "
                    f"{mode} mode (face containment {containment_note}, aspect window keeps "
                    f"{w_frac:.0%} width / {h_frac:.0%} height of the manual window).")
          else:
              aw, ah = src_w, src_h
              print(f"Aspect: source ratio {target_label} preserved; no geometric transform, "
                    f"no resizing (output {out_w}x{out_h}).")

          # ---- AI zoom budget ---------------------------------------------------
          # The effective source for zooming is the manual window: total
          # magnification is manual_scale * ai_zoom_level(t). With a manual zoom
          # the user already accepted upscaling, so at least the standard 1.10
          # emphasis level stays available (logged, never silent).
          min_m = min(mw, mh)
          min_out = min(out_w, out_h)
          upscale_budget = 1.25 if min_m >= 720 else 1.10
          z_max = min(1.20, upscale_budget * min_m / min_out)
          if manual_active:
              z_max = max(1.10, z_max)
          zoom_globally_enabled = z_max >= 1.06
          if not zoom_globally_enabled:
              print(f"WARN: zoom disabled globally: effective resolution budget {z_max:.2f}x "
                    f"is below 1.06x (window {mw}x{mh} vs canvas {out_w}x{out_h}).")
          print(f"Output quality: {quality_note}; AI zoom level cap {z_max:.2f}x "
                f"(total magnification ceiling {s * z_max:.2f}x incl. manual scale {s:g}).")

          clips_final = []
          render_clips = {}
          for clip in curation["clips"]:
              index = clip["clip_index"]
              length = round(clip["end_sec"] - clip["start_sec"], 3)
              track = tracks.get(index) or {}
              primary = track.get("primary")
              center_samples = (primary or {}).get("center_samples") or []
              cuts = track.get("cuts") or []
              sample_fps = track.get("sample_fps") or 2.0
              dropped_reasons = []
              accepted = []

              if not zoom_globally_enabled:
                  dropped_reasons.append("global zoom budget too low for this source resolution")

              for intent in clip.get("zoom_intents") or []:
                  try:
                      ws = max(0.0, min(length - 0.5, float(intent["start_rel_sec"])))
                      we = min(length, float(intent["end_rel_sec"]))
                  except (KeyError, TypeError, ValueError):
                      dropped_reasons.append("malformed zoom window")
                      continue
                  if we - ws < 1.2:
                      dropped_reasons.append(f"window {ws:.1f}-{we:.1f}s too short")
                      continue
                  inner_cuts = [c for c in cuts if ws < c < we]
                  if inner_cuts:
                      boundaries = [ws] + inner_cuts + [we]
                      spans = [(boundaries[i], boundaries[i + 1]) for i in range(len(boundaries) - 1)]
                      ws, we = max(spans, key=lambda span: span[1] - span[0])
                      if we - ws < 1.2:
                          dropped_reasons.append("scene cut inside the zoom window")
                          continue
                  try:
                      level = min(z_max, float(intent.get("zoom_level") or 1.10))
                  except (TypeError, ValueError):
                      level = 1.10
                  if level < 1.06:
                      dropped_reasons.append("resolution budget too low for this zoom level")
                      continue
                  # ------------------------------------------------------------------
                  # AUTO ZOOM FIX: a tracked primary subject is OPTIONAL steering,
                  # never a hard requirement. GPT-6 Luna already had to justify
                  # every zoom intent visually; when face tracking fails (no
                  # faces, detector unavailable, coverage gaps) the zoom is
                  # anchored at the center of the manual window instead of being
                  # silently discarded - the old hard gate is what made
                  # "AI auto zoom" disappear from exported videos.
                  # ------------------------------------------------------------------
                  if primary is not None:
                      in_window = [sm for sm in center_samples if ws - 0.5 <= sm["t"] <= we + 0.5]
                      expected = max(1, int(round((we - ws) * sample_fps)) + 1)
                      coverage = len(in_window) / expected
                      steering = "face-follow"
                      if coverage < 0.5:
                          steering = "center (face coverage "
                          steering += f"{coverage:.0%} below 50% inside the window)"
                  else:
                      steering = "center (no tracked primary subject)"
                  accepted.append({"ws": round(ws, 2), "we": round(we, 2),
                                   "level": round(level, 2),
                                   "steering": steering,
                                   "reason": intent.get("reason", "")})

              # Sort, merge windows that are too close, cap durations and count.
              accepted.sort(key=lambda z: z["ws"])
              merged = []
              for zoom in accepted:
                  if merged and zoom["ws"] - merged[-1]["we"] < 1.6:
                      merged[-1]["we"] = max(merged[-1]["we"], zoom["we"])
                      merged[-1]["level"] = max(merged[-1]["level"], zoom["level"])
                  else:
                      merged.append(zoom)
              for zoom in merged:
                  if zoom["we"] - zoom["ws"] > 15.0:
                      zoom["we"] = round(zoom["ws"] + 15.0, 2)
              merged = merged[:3]

              # Re-derive smooth follow keypoints from the tracked center
              # samples, remapped into MANUAL-WINDOW coordinates.
              zoom_windows = []
              for zoom in merged:
                  half = 0.5 / zoom["level"]
                  points = []
                  if zoom["steering"].startswith("face-follow"):
                      for sample in center_samples:
                          if zoom["ws"] - 0.5 <= sample["t"] <= zoom["we"] + 0.5:
                              x_m = (sample["x"] * src_w - mx) / mw
                              y_m = (sample["y"] * src_h - my) / mh
                              x = min(1.0 - half, max(half, x_m))
                              y = min(1.0 - half, max(half, y_m))
                              points.append((round(sample["t"], 2), round(x, 4), round(y, 4)))
                  if len(points) > 6:
                      step = (len(points) - 1) / 5.0
                      points = [points[int(i * step)] for i in range(6)]
                  if not points:
                      points = [(zoom["ws"], 0.5, 0.5)]
                  zoom_windows.append({
                      "start_rel_sec": zoom["ws"], "end_rel_sec": zoom["we"],
                      "zoom_level": zoom["level"], "keypoints": points,
                      "steering": zoom["steering"], "reason": zoom["reason"],
                  })

              zoom_cuts = [{"start_rel_sec": z["start_rel_sec"], "end_rel_sec": z["end_rel_sec"],
                            "zoom_level": z["zoom_level"], "target": "primary_subject"}
                           for z in zoom_windows]

              # Subject-aware crop following for aspect-crop mode (manual-window
              # pixel coords relative to the window origin).
              crop_keypoints = None
              if (mode == "crop" and center_samples and aw <= mw and ah <= mh):
                  points = []
                  for sample in center_samples:
                      x_px = min(max((sample["x"] * src_w - mx) - aw / 2, 0), mw - aw)
                      y_px = min(max((sample["y"] * src_h - my) - ah / 2, 0), mh - ah)
                      points.append((sample["t"], round(x_px), round(y_px)))
                  if len(points) > 16:
                      step = (len(points) - 1) / 15.0
                      points = [points[int(i * step)] for i in range(16)]
                  crop_keypoints = points

              # Caption placement: keep captions away from the primary face band.
              caption_band = "bottom"
              if center_samples:
                  ys = sorted(sm["y"] for sm in center_samples)
                  median_y = ys[len(ys) // 2]
                  if median_y > 0.58:
                      caption_band = "top"

              final_clip = dict(clip)
              final_clip.pop("zoom_intents", None)
              final_clip["duration"] = length
              final_clip["editing"] = {
                  "aspect_ratio": target_label,
                  "zoom_enabled": bool(zoom_windows),
                  "zoom_cuts": zoom_cuts,
                  "total_magnification": round(s * max([z["zoom_level"] for z in zoom_windows] or [1.0]), 3),
                  "manual_transform": manual_transform,
              }
              clips_final.append(final_clip)
              render_clips[str(index)] = {
                  "zoom_windows": zoom_windows,
                  "crop_keypoints": crop_keypoints,
                  "caption_band": caption_band,
              }

              status = (f"clip {index}: {len(zoom_windows)} zoom window(s) kept"
                        if zoom_windows else f"clip {index}: NO zoom (correct default)")
              if zoom_windows:
                  status += " [" + "; ".join(
                      f"{z['start_rel_sec']:.1f}-{z['end_rel_sec']:.1f}s @{z['zoom_level']}x "
                      f"({z['steering']})" for z in zoom_windows) + "]"
              if dropped_reasons:
                  status += f"; dropped intents: {dropped_reasons}"
              print(status)

          render_hints = {
              "geometry": {
                  "mode": mode, "src_w": src_w, "src_h": src_h,
                  "out_w": out_w, "out_h": out_h,
                  "target_label": target_label, "z_max": round(z_max, 3),
                  "aspect_window": {"w": aw, "h": ah},
                  "manual_transform": manual_transform,
                  "manual_window": {"w": mw, "h": mh, "x": mx, "y": my} if manual_active else None,
                  "output_quality": output_quality,
                  "quality_note": quality_note,
              },
              "clips": render_clips,
          }
          with open("work/render_hints.json", "w", encoding="utf-8") as fh:
              json.dump(render_hints, fh, indent=2)
          with open("work/clips_final.json", "w", encoding="utf-8") as fh:
              json.dump(clips_final, fh, ensure_ascii=False, indent=2)

          total_zooms = sum(len(c["editing"]["zoom_cuts"]) for c in clips_final)
          print(f"Zoom reconciliation complete: {total_zooms} zoom window(s) across "
                f"{len(clips_final)} clip(s). Empty zoom means NO zoom - there is no fallback. "
                f"Manual base framing: {'active (scale ' + format(s, 'g') + ')' if manual_active else 'none'}.")
          PY_ZOOM

      - name: Prepare subtitle preset fonts
        shell: bash
        run: |
          set -Eeuo pipefail

          # Baseline families from the distro; preset display fonts from Google Fonts.
          sudo apt-get install -y -qq fonts-roboto fonts-lato 2>/dev/null \
            || sudo apt-get install -y -qq fonts-roboto 2>/dev/null || true

          # Fonts are cached between jobs at ~/clipzy-fonts (runner-writable so
          # the cache action can restore/save them); they are copied into the
          # system font dir each run and never re-downloaded when cached.
          FONT_CACHE_DIR="${HOME}/clipzy-fonts"
          sudo mkdir -p "$CLIPZY_FONTS_DIR"
          if compgen -G "$FONT_CACHE_DIR/*.ttf" > /dev/null; then
            sudo cp -n "$FONT_CACHE_DIR"/*.ttf "$CLIPZY_FONTS_DIR"/ 2>/dev/null || true
            echo "Restored $(ls "$FONT_CACHE_DIR"/*.ttf 2>/dev/null | wc -l) cached font file(s)."
          fi

          BASE_URL="https://raw.githubusercontent.com/google/fonts/main/ofl"

          # Primary source: google/fonts on GitHub. Fallback: the Google Fonts
          # CSS API, which serves static TTFs through fonts.gstatic.com.
          fetch_font() {
            local family="$1" encoded="$2" css_family="$3"
            if [[ -f "$CLIPZY_FONTS_DIR/$encoded" ]]; then
              return 0
            fi
            if curl -fsSL --retry 2 --retry-delay 2 -m 90 \
                 -o "/tmp/$encoded" "$BASE_URL/$family/$encoded"; then
              sudo mv "/tmp/$encoded" "$CLIPZY_FONTS_DIR/$encoded"
              echo "Fetched font family: $family"
              return 0
            fi
            local url
            url="$(curl -fsSL -m 20 "https://fonts.googleapis.com/css2?family=${css_family}" \
                   | grep -o 'https://[^)]*' | head -n 1 || true)"
            if [[ -n "$url" ]] && curl -fsSL --retry 2 -m 60 -o "/tmp/$encoded" "$url"; then
              sudo mv "/tmp/$encoded" "$CLIPZY_FONTS_DIR/$encoded"
              echo "Fetched font family: $family (via Google Fonts CSS API)"
              return 0
            fi
            echo "WARN: could not fetch '$family'; libass will use a fallback font for that preset."
          }

          fetch_font montserrat "Montserrat%5Bwght%5D.ttf" "Montserrat:wght@400"
          fetch_font anton "Anton-Regular.ttf" "Anton"
          fetch_font oswald "Oswald%5Bwght%5D.ttf" "Oswald:wght@400"
          fetch_font orbitron "Orbitron%5Bwght%5D.ttf" "Orbitron:wght@400"
          fetch_font permanentmarker "PermanentMarker-Regular.ttf" "Permanent+Marker"
          fetch_font bungee "Bungee-Regular.ttf" "Bungee"
          fetch_font sharetechmono "ShareTechMono-Regular.ttf" "Share+Tech+Mono"
          fetch_font poppins "Poppins-SemiBold.ttf" "Poppins:wght@600"
          fetch_font playfairdisplay "PlayfairDisplay%5Bwght%5D.ttf" "Playfair+Display:wght@400"
          fetch_font quicksand "Quicksand%5Bwght%5D.ttf" "Quicksand:wght@400"
          fetch_font inter "Inter%5Bopsz%2Cwght%5D.ttf" "Inter:wght@400"

          # Mirror the final font set back into the cache directory.
          mkdir -p "$FONT_CACHE_DIR"
          sudo cp "$CLIPZY_FONTS_DIR"/*.ttf "$FONT_CACHE_DIR"/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$FONT_CACHE_DIR" 2>/dev/null || true
          echo "Font cache now holds $(ls "$FONT_CACHE_DIR"/*.ttf 2>/dev/null | wc -l) file(s)."

          sudo fc-cache -f >/dev/null 2>&1 || fc-cache -f >/dev/null 2>&1 || true
          echo "Installed font faces on this runner: $(fc-list 2>/dev/null | wc -l)"

