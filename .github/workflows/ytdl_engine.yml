name: YTDownloader Engine

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video YouTube'
        required: true
        type: string
      quality:
        description: 'Format / Kualitas Video (misal: 1080, 720, best)'
        required: false
        default: 'best'
      job_id:
        description: 'Unique Job ID dari Android'
        required: true
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp & FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp awscli

      - name: Download Video via yt-dlp
        id: ytdl
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          mkdir -p output
          
          # Pilih format sesuai input kualitas
          FORMAT_SPEC="bestvideo[height<=${{ github.event.inputs.quality }}]+bestaudio/best[height<=${{ github.event.inputs.quality }}]/best"
          if [ "${{ github.event.inputs.quality }}" = "best" ]; then
            FORMAT_SPEC="bestvideo+bestaudio/best"
          fi

          echo "Mengunduh video dengan format: $FORMAT_SPEC"
          yt-dlp -f "$FORMAT_SPEC" --merge-output-format mp4 -o "output/${JOB_ID}.%(ext)s" "${{ github.event.inputs.video_url }}"

          # Cari nama file keluaran
          OUTPUT_FILE=$(ls output/${JOB_ID}.* | head -n 1)
          FILE_NAME=$(basename "$OUTPUT_FILE")
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
          echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Video & Status to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          FILE_PATH="${{ steps.ytdl.outputs.output_file }}"
          FILE_NAME="${{ steps.ytdl.outputs.file_name }}"

          # 1. Upload Video ke R2
          aws s3 cp "$FILE_PATH" "s3://${R2_BUCKET_NAME}/videos/${FILE_NAME}" --endpoint-url "$R2_ENDPOINT_URL"

          DOWNLOAD_URL="${R2_PUBLIC_DOMAIN}/videos/${FILE_NAME}"

          # 2. Buat file metadata status ready
          cat <<EOF > status.json
          {
            "job_id": "${JOB_ID}",
            "status": "ready",
            "file_name": "${FILE_NAME}",
            "download_url": "${DOWNLOAD_URL}",
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          # Upload status.json ke R2 agar Android bisa langsung membaca tanpa rate limit GitHub API
          aws s3 cp status.json "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" --endpoint-url "$R2_ENDPOINT_URL"
