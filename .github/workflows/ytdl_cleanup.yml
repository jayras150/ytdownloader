name: YTDownloader Cleanup

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Job ID yang telah selesai'
        required: true
        type: string
      file_name:
        description: 'Nama file yang akan dihapus'
        required: true
        type: string

jobs:
  cleanup_r2:
    runs-on: ubuntu-latest
    steps:
      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Delete File from R2 & Update Status
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          JOB_ID="${{ github.event.inputs.job_id }}"
          FILE_NAME="${{ github.event.inputs.file_name }}"

          # Hapus file video dari R2
          aws s3 rm "s3://${R2_BUCKET_NAME}/videos/${FILE_NAME}" --endpoint-url "$R2_ENDPOINT_URL"

          # Update status.json menjadi completed
          cat <<EOF > status.json
          {
            "job_id": "${JOB_ID}",
            "status": "completed",
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          aws s3 cp status.json "s3://${R2_BUCKET_NAME}/status/${JOB_ID}.json" --endpoint-url "$R2_ENDPOINT_URL"
